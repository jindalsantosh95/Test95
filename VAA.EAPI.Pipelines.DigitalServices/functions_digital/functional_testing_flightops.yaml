parameters: 
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''
  testRepoPath: ''
  rootPath: ''
  sanityrootpath: 'VAA.EAPI.Automation'
  RestoreBuildProjects: '**/*.csproj'
  variableGroupName: ''
  environment: ''

jobs: 
  - job: 'SanityTesting'
    displayName: 'Flight Ops Sanity Testing'
    pool:
      name: ${{parameters.agentPool}}
      vmImage: ${{parameters.agentSpecification}}
    variables:
      - group: ${{parameters.variableGroupName}}

    steps:
      # Task to checkout the repository
      - checkout: 'self'
        displayName: 'Checkout Testing Repository'

      # Task to install DotNet Core SDK
      - task: UseDotNet@2
        displayName: 'Install DotNet Core SDK' 
        inputs:
          packageType: 'sdk'
          version: '10.0.x'
    
      # Task to build the project
      - task: DotNetCoreCLI@2
        displayName: 'Build Project'
        inputs:
          command: build
          projects: |
            ${{parameters.sanityrootpath}}/VAA.EAPI.Automation.FlightOperations/VAA.EAPI.Automation.FlightOperations.csproj
         # arguments: '--configuration $(BuildConfiguration) --no-restore'


      # task to perform the sanity test 
      - task: VSTest@2
        displayName: 'Flight Operations Sanity Testing' 
        inputs:
          testAssemblyVer2: |
            **\VAA.EAPI.Automation.FlightOperations.dll
            **\*Tests.dll
            !**\obj\**
          testFiltercriteria: 'Category=FlightOperationsMicroserviceTests'
          testRunTitle: 'Flight Operations Sanity Test'
          rerunFailedTests: true
          rerunType: basedOnTestFailureCount
          rerunMaxAttempts: 0
        continueOnError: true

          