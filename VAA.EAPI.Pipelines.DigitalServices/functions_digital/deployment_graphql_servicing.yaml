parameters:
  agentPool: ''
  agentPool_deployment: ''
  agentSpecification: ''
  applicationName: ''
  functionAppName: ''
  functionAppName_secure: ''
  environment: ''
  location: ''
  resourceGroupName: ''
  serviceConnection: ''
  subscriptionId: ''
  APIM_IP: ''
  WEBSITE_DNS_ALT_SERVER: ''
  WEBSITE_DNS_SERVER: ''   
  workspaceResourceId: ''
  ApplicationInsightName: ''
  storageAccountName: ''
  ApplicationInsigtName_Secure: ''
  storageAccountName_Secure: ''
  KeyvaultName: ''
  stitchfunctionAppName: ''
  stitchrgname: ''
  Redis_ConnectionString: ''
  ASPName: ''

jobs: 
- deployment: '${{parameters.environment}}'      
  
  pool:
    name: ${{parameters.agentPool_deployment}} 
    vmImage: ${{parameters.agentSpecification}}  
  
  environment: ${{parameters.environment}}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          artifact: drop      

        # Task to create the Public Function App      
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Create Function App'
          inputs:
            azureResourceManagerConnection: ${{parameters.serviceConnection}}
            subscriptionid: ${{parameters.subscriptionId}}
            resourceGroupName:  ${{parameters.resourceGroupName}}
            location:  ${{parameters.location}}
            csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy_digital.json
            csmParametersFile: $(Pipeline.workspace)/drop/Parameters/${{parameters.environment}}-digital-azuredeploy.parameters.json
            deploymentMode: 'Incremental'
            overrideParameters: -OperationsVisibilityMode Public -workspaceResourceId ${{parameters.workspaceResourceId}} -functionappName ${{parameters.functionAppName}} -AppInsightsName ${{parameters.ApplicationInsightName}} -storageaccountName ${{parameters.storageAccountName}} -keyVaultName ${{parameters.KeyvaultName}} -WEBSITE_DNS_SERVER ${{parameters.WEBSITE_DNS_SERVER}} -WEBSITE_DNS_ALT_SERVER ${{parameters.WEBSITE_DNS_ALT_SERVER}} -AppServicePlanName ${{parameters.ASPName}} -RedisCacheConnectionString ${{parameters.Redis_ConnectionString}}

        # Task to stop the Public Function App
        - task: AzureAppServiceManage@0
          displayName: 'Stop Azure App Service: ${{parameters.functionAppName}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Stop Azure App Service'
            WebAppName: ${{parameters.functionAppName}}


        # Task to deploy the Public Function App
        - task: AzureFunctionApp@1
          displayName: 'Deploy to Function APP' 
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            appType: 'functionApp'
            appName: ${{parameters.functionAppName}}
            deployToSlotOrASE: true
            resourceGroupName: ${{parameters.resourceGroupName}}
            package: '$(Pipeline.workspace)/drop/*.zip'
            deploymentMethod: 'runFromPackage'     

        # Task to start the Public Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start Azure App Service: ${{parameters.functionAppName}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Azure App Service'
            WebAppName: ${{parameters.functionAppName}}

        # Task to create the Secure Function App      
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Create Function App'
          inputs:
            azureResourceManagerConnection: ${{parameters.serviceConnection}}
            subscriptionid: ${{parameters.subscriptionId}}
            resourceGroupName:  ${{parameters.resourceGroupName}}
            location:  ${{parameters.location}}
            csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy_digital.json
            csmParametersFile: $(Pipeline.workspace)/drop/Parameters/${{parameters.environment}}-digital-azuredeploy.parameters.json
            deploymentMode: 'Incremental'
            overrideParameters: -OperationsVisibilityMode Secure -workspaceResourceId ${{parameters.workspaceResourceId}} -functionappName ${{parameters.functionAppName_secure}} -AppInsightsName ${{parameters.ApplicationInsigtName_Secure}} -storageaccountName ${{parameters.storageAccountName_Secure}} -keyVaultName ${{parameters.KeyvaultName}} -WEBSITE_DNS_SERVER ${{parameters.WEBSITE_DNS_SERVER}} -WEBSITE_DNS_ALT_SERVER ${{parameters.WEBSITE_DNS_ALT_SERVER}} -AppServicePlanName ${{parameters.ASPName}} -RedisCacheConnectionString ${{parameters.Redis_ConnectionString}}

        # Task to stop the Secure Function App
        - task: AzureAppServiceManage@0
          displayName: 'Stop Azure App Service: ${{parameters.functionAppName_secure}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Stop Azure App Service'
            WebAppName: ${{parameters.functionAppName_secure}}


        # Task to deploy the Secure Function App
        - task: AzureFunctionApp@1
          displayName: 'Deploy to Function APP' 
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            appType: 'functionApp'
            appName: ${{parameters.functionAppName_secure}}
            deployToSlotOrASE: true
            resourceGroupName: ${{parameters.resourceGroupName}}
            package: '$(Pipeline.workspace)/drop/*.zip'
            deploymentMethod: 'runFromPackage'     

        # Task to start the Secure Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start Azure App Service: ${{parameters.functionAppName_secure}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Azure App Service'
            WebAppName: ${{parameters.functionAppName_secure}}
    


