parameters:   
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''  
  rootPath: ''
  subRootPath: ''
  applicationName: ''
  deploymentroot: 'VAA.EAPI.GraphQL'

stages: 
  - stage: 'Build'
    jobs: 
      - job: 'Build'
        displayName: 'Build'  
        pool:
          name: ${{parameters.agentPool}} 
          vmImage: ${{parameters.agentSpecification}} 

        steps:
          # Task to install DotNet Core SDK
          - task: UseDotNet@2
            displayName: 'Install DotNet Core SDK' 
            inputs:
              packageType: 'sdk'
              version: '10.0.x'
          
          # Task to build projects
          - task: DotNetCoreCLI@2
            displayName: 'Build GraphQL function project'
            inputs:
              command: 'build'
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Servicing.csproj
                **/${{parameters.deploymentroot}}.Domain.Account.csproj
                **/${{parameters.deploymentroot}}.Domain.Trips.csproj
                **/${{parameters.deploymentroot}}.Domain.Loyalty.csproj
                **/${{parameters.deploymentroot}}.Rest.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}}'

            #Task to build & run unit test
          - task: DotNetCoreCLI@2
            displayName: 'Build & run unit tests'
            inputs:
              command: 'test'
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Servicing.Tests.csproj
                **/${{parameters.deploymentroot}}.Domain.Account.Tests.csproj
                **/${{parameters.deploymentroot}}.Domain.Trips.Tests.csproj
                **/${{parameters.deploymentroot}}.Domain.Loyalty.Tests.csproj
                **/${{parameters.deploymentroot}}.Rest.Tests.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}} --collect "XPlat Code coverage"'


          # Task to Install Report Generator Tool
          - script: 'dotnet tool install --global dotnet-reportgenerator-globaltool --version 4.5.8'
            displayName: 'Install ReportGenerator tool'

          # Task to publish the project
          - task: DotNetCoreCLI@2
            displayName: 'Publish Project'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Servicing.csproj
                **/${{parameters.deploymentroot}}.Domain.Account.csproj
                **/${{parameters.deploymentroot}}.Domain.Trips.csproj
                **/${{parameters.deploymentroot}}.Domain.Loyalty.csproj
                **/${{parameters.deploymentroot}}.Rest.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}} --output $(build.ArtifactStagingDirectory)'
              zipAfterPublish: false

          - task: PowerShell@2
            displayName: 'Test REST startup hook artifact contract'
            inputs:
              pwsh: true # Deployment parameters contain JSON comments supported by PowerShell 7.
              targetType: filePath
              filePath: 'scripts/test-rest-startup-hook-package.ps1'
              arguments: '-PublishPath "$(Build.ArtifactStagingDirectory)/${{parameters.deploymentroot}}.Rest"'

          # Task to create merge folder
          - script: 'mkdir  $(Build.ArtifactStagingDirectory)\merge'
            displayName: 'Create merge folder to combine packages'
            
          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Servicing
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Account
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Trips
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Loyalty
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy graphQL build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy GraphQL to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Rest
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          - task: PowerShell@2
            displayName: 'Verify REST startup hook package'
            inputs:
              targetType: inline
              script: |
                $hook = '$(Build.ArtifactStagingDirectory)/merge/hostextensions/VAA.EAPI.GraphQL.WebSocketHost.dll'
                if (-not (Test-Path -LiteralPath $hook -PathType Leaf)) {
                  throw 'REST package is missing the native WebSocket startup hook.'
                }
                [System.Reflection.AssemblyName]::GetAssemblyName($hook) | Out-Null

          # Task to create package, zip file
          - task: ArchiveFiles@2
            displayName: 'Package build outputs'
            inputs:
              rootFolderOrFile:  $(Build.ArtifactStagingDirectory)\merge
              includeRootFolder: false
              archiveType: 'zip' 
              archiveFile: '$(Build.ArtifactStagingDirectory)/${{parameters.deploymentroot}}.Rest.zip' 

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\merge'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\merge'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true
              
          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Servicing'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Servicing'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Account'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Account'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Trips'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Trips'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Loyalty'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Loyalty'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Rest'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Rest'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to copy the ARM files to artifactstagingdirectory
          - task: CopyFiles@2
            displayName: 'Copy ARM Files'
            inputs:
              SourceFolder: '${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment'
              TargetFolder: '$(build.ArtifactStagingDirectory)'

          - task: PowerShell@2
            displayName: 'Set DEV REST startup hook content path'
            inputs:
              pwsh: true # Keep JSON comment support consistent with the artifact contract test.
              targetType: inline
              script: |
                # Both DEV REST apps use C:\home (confirmed via their SCM content paths).
                # Change this REST artifact only, not the shared GraphQL parameter source.
                $path = '$(Build.ArtifactStagingDirectory)/Parameters/dev-digital-azuredeploy.parameters.json'
                $parameters = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
                $parameters.parameters.NativeWebSocketsConfiguration.value.startupHookPath = 'C:\home\site\wwwroot\hostextensions\VAA.EAPI.GraphQL.WebSocketHost.dll'
                $parameters | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $path -Encoding UTF8

          # task to publish build artifacts to Azure Pipelines 
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts' 
            inputs:
              PathtoPublish: $(build.ArtifactStagingDirectory)
              ArtifactName: 'drop' 
              publishLocation: 'Container'

          # task to validate the DEV ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - DEV'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_DEV}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment/Template/azuredeploy_digital.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment/Parameters/dev-digital-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the SIT ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - SIT'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_SIT}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment/Template/azuredeploy_digital.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment/Parameters/sit-digital-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the UAT ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - UAT'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_UAT}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment/Template/azuredeploy_digital.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment/Parameters/uat-digital-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the PROD ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - PROD'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_Prod}}
              subscriptionId: ${{parameters.subscriptionId_Prod}}
              resourceGroupName: ${{parameters.resourceGroupName_PROD}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment/Template/azuredeploy_digital.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment/Parameters/prod-digital-azuredeploy.parameters.json
              deploymentMode: Validation
