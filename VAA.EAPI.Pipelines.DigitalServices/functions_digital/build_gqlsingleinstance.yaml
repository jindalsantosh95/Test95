parameters:   
  agentPool: ''
  agentPool_Sanity: ''
  agentSpecification: ''
  buildConfiguration: ''  
  rootPath: ''
  subRootPath: ''
  SPECTRAL_DSN: ''
  SPECTRAL_KEY: ''
  applicationName: ''
  deploymentroot: 'VAA.EAPI.GraphQL'

stages: 
  - stage: 'Build'
    jobs: 
      - job: 'Build'
        displayName: 'Build'  
        pool:
          name: ${{parameters.agentPool}} 
          vmImage: ${{parameters.agentSpecification}} 
      
        steps:
          # Task to install DotNet Core SDK
          - task: UseDotNet@2
            displayName: 'Install DotNet Core SDK' 
            inputs:
              packageType: 'sdk'
              version: '10.0.x'
          
          # Task to build projects
          - task: DotNetCoreCLI@2
            displayName: 'Build GraphQL function project'
            inputs:
              command: 'build'
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Concierge.csproj
                **/${{parameters.deploymentroot}}.Domain.RefData.csproj
                **/${{parameters.deploymentroot}}.Domain.Security.csproj
                **/${{parameters.deploymentroot}}.Domain.Servicing.csproj
                **/${{parameters.deploymentroot}}.Domain.VHols.csproj
                **/${{parameters.deploymentroot}}.Domain.WebForms.csproj
                **/${{parameters.deploymentroot}}.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}}'

           #Task to build & run unit test
          - task: DotNetCoreCLI@2
            displayName: 'Build & run unit tests'
            inputs:
              command: 'test'
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Concierge.Tests.csproj
                **/${{parameters.deploymentroot}}.Domain.RefData.Tests.csproj
                **/${{parameters.deploymentroot}}.Domain.Security.Tests.csproj
                **/${{parameters.deploymentroot}}.Domain.Servicing.Tests.csproj
                **/${{parameters.deploymentroot}}.Domain.VHols.Tests.csproj
                **/${{parameters.deploymentroot}}.Domain.WebForms.Tests.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}} --collect "XPlat Code coverage"'


          # # Task to Install Report Generator Tool
          # - script: 'dotnet tool install --global dotnet-reportgenerator-globaltool --version 4.5.8'
          #   displayName: 'Install ReportGenerator tool'

          # # Task to Create Reports
          # - script: 'reportgenerator -reports:$(Agent.TempDirectory)/**/coverage.cobertura.xml -targetdir:$(Build.SourcesDirectory)/coverlet/reports -filefilters:-*VAA.EAPI.Common*;-*VAA.EAPI.Domain*;-*VAA.EAPI.Infrastructure* -classfilters:-*WesalServiceReference.* -reporttypes:"cobertura"'
          #   displayName: 'Create reports'
           
          # # Task to Publish Code Coverage
          # - task: PublishCodeCoverageResults@1
          #   displayName: 'Publish code coverage'
          #   inputs: 
          #     codecoverageTool: cobertura
          #     summaryFileLocation: '$(Build.SourcesDirectory)/coverlet/reports/Cobertura.xml'

          # Task to publish the project
          - task: DotNetCoreCLI@2
            displayName: 'Publish Project'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Concierge.csproj
                **/${{parameters.deploymentroot}}.Domain.RefData.csproj
                **/${{parameters.deploymentroot}}.Domain.Security.csproj
                **/${{parameters.deploymentroot}}.Domain.Servicing.csproj
                **/${{parameters.deploymentroot}}.Domain.VHols.csproj
                **/${{parameters.deploymentroot}}.Domain.WebForms.csproj
                **/${{parameters.deploymentroot}}.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}} --output $(build.ArtifactStagingDirectory)'
              zipAfterPublish: false

          # Task to create merge folder
          - script: 'mkdir  $(Build.ArtifactStagingDirectory)\merge'
            displayName: 'Create merge folder to combine packages'

          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Concierge
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.RefData
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Security
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Servicing
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.VHols
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.WebForms
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy graphQL build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy GraphQL to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to create package, zip file
          - task: ArchiveFiles@2
            displayName: 'Package build outputs'
            inputs:
              rootFolderOrFile:  $(Build.ArtifactStagingDirectory)\merge
              includeRootFolder: false
              archiveType: 'zip' 
              archiveFile: '$(Build.ArtifactStagingDirectory)/${{parameters.deploymentroot}}.zip' 
 
          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\merge'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\merge'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Concierge'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Concierge'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.RefData'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.RefData'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Security'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Security'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Servicing'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Servicing'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.VHols'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.VHols'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.WebForms'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.WebForms'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to copy the ARM files to artifactstagingdirectory
          - task: CopyFiles@2
            displayName: 'Copy ARM Files'
            inputs:
              SourceFolder: '${{parameters.deploymentroot}}/${{parameters.subRootPath}}.Deployment'
              TargetFolder: '$(build.ArtifactStagingDirectory)'

          # task to publish build artifacts to Azure Pipelines 
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts' 
            inputs:
              PathtoPublish: $(build.ArtifactStagingDirectory)
              ArtifactName: 'drop' 
              publishLocation: 'Container'

        