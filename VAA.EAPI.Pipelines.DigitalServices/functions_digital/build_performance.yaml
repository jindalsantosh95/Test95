parameters:   
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''  
  rootPath: ''
  subRootPath: ''
  applicationName: ''
  SPECTRAL_DSN: ''
  SPECTRAL_KEY: ''


stages: 
  - stage: 'Build'
    jobs: 
      - job: 'Build'
        displayName: 'Build'  
        pool:
          name: ${{parameters.agentPool}} 
          vmImage: ${{parameters.agentSpecification}}         
          
        steps:

          # Task to install DotNet Core SDK
          - task: UseDotNet@2
            displayName: 'Install DotNet Core SDK' 
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          # Task to restore
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '${{parameters.rootPath}}/**/${{parameters.subRootPath}}.${{parameters.applicationName}}.csproj'
          
          # Task to build the project
          - task: DotNetCoreCLI@2
            displayName: 'Build Project'
            inputs:
              command: 'build'
              projects: '${{parameters.rootPath}}/**/${{parameters.subRootPath}}.${{parameters.applicationName}}.csproj'
              arguments: '--configuration ${{parameters.buildConfiguration}}'


          # Task to publish the project
          - task: DotNetCoreCLI@2
            displayName: 'Publish Project'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: |
                  ${{parameters.rootPath}}/**/${{parameters.subRootPath}}.${{parameters.applicationName}}.csproj
                  
                  
              arguments: '--configuration ${{parameters.buildConfiguration}} --output $(build.ArtifactStagingDirectory)'
              zipAfterPublish: true

          # Task to copy the ARM files to artifactstagingdirectory
          - task: CopyFiles@2
            displayName: 'Copy ARM Files'
            inputs:
              SourceFolder: '${{parameters.rootPath}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment'
              TargetFolder: '$(build.ArtifactStagingDirectory)'
 
          # task to publish build artifacts to Azure Pipelines 
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts' 
            inputs:
              PathtoPublish: '$(build.ArtifactStagingDirectory)'
              ArtifactName: 'drop' 
              publishLocation: 'Container'

          # task to validate the DEV ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - DEV'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_Digital_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_DEV}}
              location: ${{parameters.location}}
              csmFile: $(build.ArtifactStagingDirectory)/Template/azuredeploy_digital.json
              csmParametersFile: $(build.ArtifactStagingDirectory)/Parameters/dev-digital-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the SIT ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - SIT'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_Digital_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_SIT}}
              location: ${{parameters.location}}
              csmFile: $(build.ArtifactStagingDirectory)/Template/azuredeploy_digital.json
              csmParametersFile: $(build.ArtifactStagingDirectory)/Parameters/sit-digital-azuredeploy.parameters.json
              deploymentMode: Validation  

          # task to validate the UAT ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - UAT'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_Digital_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_UAT}}
              location: ${{parameters.location}}
              csmFile: $(build.ArtifactStagingDirectory)/Template/azuredeploy_digital.json
              csmParametersFile: $(build.ArtifactStagingDirectory)/Parameters/uat-digital-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the PROD ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - PROD'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_Prod}}
              subscriptionId: ${{parameters.subscriptionId_Prod}}
              resourceGroupName: ${{parameters.resourceGroupName_PROD}}
              location: ${{parameters.location}}
              csmFile: $(build.ArtifactStagingDirectory)/Template/azuredeploy_digital.json
              csmParametersFile: $(build.ArtifactStagingDirectory)/Parameters/prod-digital-azuredeploy.parameters.json
              deploymentMode: Validation 