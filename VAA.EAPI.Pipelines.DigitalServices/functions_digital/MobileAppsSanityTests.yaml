parameters: 
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''
  testRepoPath: 'Enterprise Microservices'
  rootPath: ''
  sanityrootpath: 'VAA.EAPI.Automation'
  RestoreBuildProjects: '**/*.csproj'
  variableGroupName: ''
  environment: ''

jobs: 
  - job: 'MobileApps_Testing'
    displayName: 'MobileApps Sanity Tests'
    
    pool:
      name: ${{parameters.agentPool}}
      vmImage: ${{parameters.agentSpecification}}
    variables:
      - group: ${{parameters.variableGroupName}}
    steps:
      # Task to checkout the repository
      - checkout: 'self'
        displayName: 'Checkout Testing Repository'

      # Task to install DotNet Core SDK
      - task: UseDotNet@2
        displayName: 'Install DotNet Core SDK' 
        inputs:
          packageType: 'sdk'
          version: '10.0.x'
    
      # Task to build the project
      - task: DotNetCoreCLI@2
        displayName: 'Build Project'
        inputs:
          command: build
          projects: |
            ${{parameters.sanityrootpath}}/VAA.EAPI.Automation.MobileApp/VAA.EAPI.Automation.MobileApp.csproj
            ${{parameters.sanityrootpath}}/VAA.EAPI.Automation.OCI/VAA.EAPI.Automation.OCI.csproj
            ${{parameters.sanityrootpath}}/VAA.EAPI.Automation.Trips/VAA.EAPI.Automation.Trips.csproj
         # arguments: '--configuration $(BuildConfiguration) --no-restore'

      #Mobile apps testing
      - task: VSTest@2
        displayName: 'MobileApps-GraphQLTestSuite'
        inputs:
          testAssemblyVer2: | 
            **\VAA.EAPI.Automation.Trips.dll
            **\VAA.EAPI.Automation.OCI.dll
            **\VAA.EAPI.Automation.MobileApp.dll
            **\*Tests.dll
            !**\obj\**
          testFiltercriteria: 'Category=MobileAppsSanityTests'
          testRunTitle: 'MobileAppsSanity-GraphQLTestSuite'
          rerunFailedTests: true
          rerunType: basedOnTestFailureCount
          rerunMaxAttempts: 2
        continueOnError: true

      - task: PublishTestResults@2
        displayName: 'Publish Test Results **/Log_For_*.txt'
        inputs:
           testResultsFormat: XUnit
           testResultsFiles: '**/Log_For_*.txt'    

      - task: epsteam.EmailReportExtension.EmailReport.EmailReport@1
        displayName: 'Send Email Report Always'
        inputs:
          subject: '[{environmentStatus}] {passPercentage} GraphQL - $(env) STAGE | Mobile apps Tests passed post deployment'
          includeInToSectionStr: 2
          toAddress: 'vinay.dhawan@fly.virgin.com;rachana.srivastava@fly.virgin.com;santosh.jindal@fly.virgin.com;himani.saxena@fly.virgin.com;robert.hutson@fly.virgin.com;Rajveer.Singh@fly.virgin.com;Pooja.Bishnoi@fly.virgin.com;Dimitris.Dimitriou@fly.virgin.com'
          defaultDomain: VirginAtlantic365.onmicrosoft.com
          includeCommits: false
          includeOthersInTotal: false
          includeResultsFromOtherJobs: false
          includeBuildSummary: false
          groupTestResultsBy: run
          maxTestFailuresToShow: 10
          enableTLS: true
          smtpConnectionEndpoint: EmailServices
