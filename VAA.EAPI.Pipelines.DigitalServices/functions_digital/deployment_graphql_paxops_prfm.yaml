parameters:
  agentPool: ''
  agentPool_deployment: ''
  agentSpecification: ''
  applicationName: ''
  functionAppName: ''
  environment: ''
  location: ''
  resourceGroupName: ''
  serviceConnection: ''
  subscriptionId: ''
  APIM_IP: ''
  WEBSITE_DNS_ALT_SERVER: ''
  WEBSITE_DNS_SERVER: ''   
  workspaceResourceId: ''
  appInsightsName: ''
  storageAccName: ''
  stitchfunctionAppName: ''
  stitchrgname: ''
  Redis_ConnectionString: ''
  keyvaultName: ''
  TripsMs_URL: ''
  PaxopsMs_URL: ''
  TripsMs_OcpSubID: ''
  BookingIdJwtKey: ''
  PaxopsMs_OcpSubID: ''
  CheckInIdJwtKey: ''
  ASPName: ''

jobs: 
- deployment: '${{parameters.environment}}'      
  
  pool:
    name: ${{parameters.agentPool_deployment}} 
    vmImage: ${{parameters.agentSpecification}}  
  
  environment: ${{parameters.environment}}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          artifact: drop      

        # Task to create the Function App      
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Create Function App'
          inputs:
            azureResourceManagerConnection: ${{parameters.serviceConnection}}
            subscriptionid: ${{parameters.subscriptionId}}
            resourceGroupName:  ${{parameters.resourceGroupName}}
            location:  ${{parameters.location}}
            csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy_digital.json
            csmParametersFile: $(Pipeline.workspace)/drop/Parameters/uat-digital-azuredeploy.parameters.json
            deploymentMode: 'Incremental'
            overrideParameters: -workspaceResourceId ${{parameters.workspaceResourceId}} -AppServicePlanName ${{parameters.ASPName}} -TRIPMS {"MSUrl":"$(TripsMs_URL)","OcpSubID":"$(TripsMs_OcpSubID)","BookingIdJwtKey":"$(BookingIdJwtKey)"} -CheckIn {"MSUrl":"$(PaxopsMs_URL)","OcpSubID":"$(PaxopsMs_OcpSubID)","CheckInIdJwtKey":"$(CheckInIdJwtKey)","RequirementIdExpiryTimeinMin":"20","TravelPartyIdExpiryTimeinMin":"20","BasketIdExpiryTimeinMin":"20"} -keyVaultName ${{parameters.keyvaultName}} -storageaccountName ${{parameters.storageAccName}} -AppInsightsName ${{parameters.appInsightsName}} -functionappName ${{parameters.functionAppName}} -RedisCacheConnectionString ${{parameters.Redis_ConnectionString}} -WEBSITE_DNS_SERVER ${{parameters.WEBSITE_DNS_SERVER}} -WEBSITE_DNS_ALT_SERVER ${{parameters.WEBSITE_DNS_ALT_SERVER}}

        # Task to stop the Function App
        - task: AzureAppServiceManage@0
          displayName: 'Stop Azure App Service: ${{parameters.functionAppName}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Stop Azure App Service'
            WebAppName: ${{parameters.functionAppName}}

        # Task to deploy the Function App
        - task: AzureFunctionApp@1
          displayName: 'Deploy to Function APP' 
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            appType: 'functionApp'
            appName: ${{parameters.functionAppName}}
            deployToSlotOrASE: true
            resourceGroupName: ${{parameters.resourceGroupName}}
            package: '$(Pipeline.workspace)/drop/*.zip'
            deploymentMethod: 'runFromPackage'     

        # Task to start the Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start Azure App Service: ${{parameters.functionAppName}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Azure App Service'
            WebAppName: ${{parameters.functionAppName}}

    
