trigger:
  branches:
    include:
      - '*'
    
  paths:
    include:
      - VAA.EAPI.Orchastration/VAA.EAPI.Orchestration.RetailTherapy*
    exclude:     
      - VAA.EAPI.Orchastration/VAA.EAPI.Orchestration.RetailTherapy.bruno
pr:
  branches:
    include:
      - main
  
  paths:
    include:
      - VAA.EAPI.Orchastration/VAA.EAPI.Orchestration.RetailTherapy*
    exclude:     
      - VAA.EAPI.Orchastration/VAA.EAPI.Orchestration.RetailTherapy.bruno

variables: 
  
  - group: Digital_Variables
  - group: APIM  
  - group: APIM_IP
  - group: Spectral_Ops
  - name: agentPool
    value: 'Azure Pipelines' 
  - name: agentPool1
    value: 'LoyaltySystems'  
  - name: agentSpecification
    value: 'windows-latest'
  - name: buildConfiguration
    value: 'release'           
  - name: rootPath
    value: 'VAA.EAPI.Orchastration'  
  - name: subRootPath
    value: 'VAA.EAPI.Orchestration'  
  - name: applicationName
    value: 'RetailTherapy'
  - name: microserviceName
    value: 'retailing' 
  - name: productId
    value: 'EAPI-OrchRetaiTherapy' 
  - name: apimurlname
    value: 'Retailing'            
  - name: functionAppName_DEV
    value: 'VA-DV-EUN-RETAILING-FN-01' 
  - name: functionAppName_SIT
    value: 'VA-TS-EUN-RETAILING-FN-01' 
  - name: functionAppName_UAT
    value: 'VA-TU-EUN-RETAILING-FN-01' 
  - name: functionAppName_PROD
    value: 'va-pr-eun-retailing-fn-01' 

name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)

stages:
  # CI (Build) Pipeline
  - template: functions_digital/build_omnevo.yaml
    parameters:
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification)
      buildConfiguration: $(buildConfiguration)
      location: $(location)           
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      SPECTRAL_DSN: $(SPECTRAL_DSN)
      SPECTRAL_KEY: $(SPECTRAL_KEY)
      applicationName: $(applicationName) 
      resourceGroupName_DEV: $(resourceGroupName_Omnevo_DEV)
      resourceGroupName_SIT: $(resourceGroupName_Omnevo_SIT)
      resourceGroupName_UAT: $(resourceGroupName_Omnevo_UAT)
      resourceGroupName_PROD: $(resourceGroupName_Omnevo_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      subscriptionId_NonProd: $(subscriptionId_NonProd)  
      serviceConnection_Prod: $(serviceConnection_Prod)
      subscriptionId_Prod: $(subscriptionId_Prod)  

  # Drift/Coverage and Inferential Review Sensors
  - stage: DriftAndCoverageSensors
    displayName: Drift/Coverage & Inferential Sensors
    dependsOn: Build
    jobs:
      - job: DriftCoverage
        displayName: Drift & Coverage Scan
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: Drift/Coverage Scan
            inputs:
              targetType: 'filePath'
              filePath: 'scripts/drift_coverage_scan.ps1'
              arguments: '-ScopePath "$(rootPath)"'
              pwsh: true
      - job: InferentialReview
        displayName: Inferential (Semantic/LLM) Review
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: Inferential Review
            inputs:
              targetType: 'filePath'
              filePath: 'scripts/inferential_review.ps1'
              arguments: '-ScopePath "$(rootPath)"'
              pwsh: true

  # CD (Deployment) Pipeline
  - template: functions_digital/release_flightops.yaml
    parameters:
      agentPool: $(agentPool)
      agentPool_deployment: $(agentPool1)      
      location: $(location)           
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      buildConfiguration: $(buildConfiguration)
      agentSpecification: $(agentSpecification) 
      applicationName: $(applicationName)
      microserviceName: $(microserviceName)
      apimurlname: $(apimurlname)
      resourceGroupName_DEV: $(resourceGroupName_Omnevo_DEV)
      resourceGroupName_SIT: $(resourceGroupName_Omnevo_SIT)
      resourceGroupName_UAT: $(resourceGroupName_Omnevo_UAT)
      resourceGroupName_PROD: $(resourceGroupName_Omnevo_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      subscriptionId_NonProd: $(subscriptionId_NonProd) 
      serviceConnection_Prod: $(serviceConnection_Prod)
      subscriptionId_Prod: $(subscriptionId_Prod)    
      functionAppName_DEV: $(functionAppName_DEV)
      functionAppName_SIT: $(functionAppName_SIT)
      functionAppName_UAT: $(functionAppName_UAT)
      functionAppName_PROD: $(functionAppName_PROD)
      APIM_IP_DEV_SIT_UAT: $(APIM_IP_DEV_SIT_UAT)
      APIM_IP_PRD: $(APIM_IP_PRD)
      APIM_NonProd: $(APIM_NonProd)
      APIM_Prod: $(APIM_Prod)
      APIMResourceGroupName_NonProd: $(APIMResourceGroupName_NonProd)       
      APIMServiceConnection_NonProd: $(APIMServiceConnection_NonProd)
      APIMSubscriptionId_NonProd: $(APIMSubscriptionId_NonProd) 
      APIMResourceGroupName_Prod: $(APIMResourceGroupName_Prod)       
      APIMServiceConnection_Prod: $(APIMServiceConnection_Prod)
      APIMSubscriptionId_Prod: $(APIMSubscriptionId_Prod)
      workspaceResourceId: $(workspaceResourceId)
      workspaceResourceId_prod: $(workspaceResourceId_prod)
      asename: $(asename)
      asename_prod: $(asename_prod)
      WEBSITE_DNS_ALT_SERVER: $(WEBSITE_DNS_ALT_SERVER)
      WEBSITE_DNS_SERVER: $(WEBSITE_DNS_SERVER) 
      VARIABLE_GROUP_NAME_DEV: "Digital_Omnevo_Dev"
      VARIABLE_GROUP_NAME_SIT: "Digital_Omnevo_SIT"
      VARIABLE_GROUP_NAME_UAT: "Digital_Omnevo_UAT"    
      sanityfile: functional_testing_flightops.yaml
