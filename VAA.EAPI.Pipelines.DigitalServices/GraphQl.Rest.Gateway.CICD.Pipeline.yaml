trigger:
  branches:
    include:
      - '*'
    
  paths:
    include:
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Domain.Servicing*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Domain.Account*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Domain.Trips*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Domain.Loyalty*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Rest*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Deployment*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.WebSocketHost/**
      - VAA.EAPI.GraphQL/NativeWebSocketHost.targets
      - scripts/test-rest-startup-hook-package.ps1
      - scripts/test-rest-function-key-order.ps1
      - VAA.EAPI.Pipelines.DigitalServices/functions_digital/Graphql_Rest_Gateway/**
pr:
  branches:
    include:
      - main
  
  paths:
    include:
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Domain.Servicing*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Domain.Account*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Domain.Trips*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Domain.Loyalty*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Rest*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.Deployment*
      - VAA.EAPI.GraphQL/VAA.EAPI.GraphQL.WebSocketHost/**
      - VAA.EAPI.GraphQL/NativeWebSocketHost.targets
      - scripts/test-rest-startup-hook-package.ps1
      - scripts/test-rest-function-key-order.ps1
      - VAA.EAPI.Pipelines.DigitalServices/functions_digital/Graphql_Rest_Gateway/**

variables: 
  
  - group: Graphql_Digital
  - group: APIM  
  - group: APIM_IP
  - group: Spectral_Ops
  - group: Graphql_Stitch
  - name: agentPool
    value: 'Azure Pipelines' 
  - name: agentPool1
    value: 'LoyaltySystems'  
  - name: agentSpecification
    value: 'windows-latest'
  - name: buildConfiguration
    value: 'release'           
  - name: rootPath
    value: 'VAA.EAPI.GraphQL'  
  - name: subRootPath
    value: 'VAA.EAPI.GraphQL'  
  - name: applicationName
    value: 'Rest'
  - name: microserviceName
    value: 'rest' 
  - name: productId
    value: 'Graphql-Rest' 
  - name: apimurlname
    value: 'rest'            
  - name: functionAppName_DEV
    value: 'va-dv-eun-gqlrestgateway-fn-01' 
  - name: functionAppName_SIT
    value: 'va-ts-eun-gqlrestgateway-fn-01'
  - name: functionAppName_UAT
    value: 'va-tu-eun-gqlrestgateway-fn-01'
  - name: functionAppName_PROD
    value: 'va-pr-eun-gqlrestgateway-fn-01'
  - name: functionAppName_DEV_Secure
    value: 'va-dv-eun-gqlrestgateways-fn-01' 
  - name: functionAppName_SIT_Secure
    value: 'va-ts-eun-gqlrestgateways-fn-01'
  - name: functionAppName_UAT_Secure
    value: 'va-tu-eun-gqlrestgateways-fn-01'
  - name: functionAppName_PROD_Secure
    value: 'va-pr-eun-gqlrestgateways-fn-01'


name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)

stages:
  # CI (Build) Pipeline
  - template: functions_digital/Graphql_Rest_Gateway/build_graphqlrest.yaml
    parameters:
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification)
      buildConfiguration: $(buildConfiguration)
      location: $(location)           
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      applicationName: $(applicationName) 
      resourceGroupName_DEV: $(resourceGroupName_Gql_DEV)
      resourceGroupName_SIT: $(resourceGroupName_Gql_SIT)
      resourceGroupName_UAT: $(resourceGroupName_Gql_UAT)
      resourceGroupName_PROD: $(resourceGroupName_Gql_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      subscriptionId_NonProd: $(subscriptionId_NonProd)  
      serviceConnection_Prod: $(serviceConnection_Prod)
      subscriptionId_Prod: $(subscriptionId_Prod)


  # CD (Deployment) Pipeline
  - template: functions_digital/Graphql_Rest_Gateway/release_graphql_rest_slot.yaml
    parameters:
      agentPool: $(agentPool)
      agentPool_deployment: $(agentPool1)      
      location: $(location)           
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      buildConfiguration: $(buildConfiguration)
      agentSpecification: $(agentSpecification) 
      applicationName: $(applicationName)
      microserviceName: $(microserviceName)
      apimurlname: $(apimurlname)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      subscriptionId_NonProd: $(subscriptionId_NonProd)    
      serviceConnection_Prod: $(serviceConnection_Prod)
      subscriptionId_Prod: $(subscriptionId_Prod) 
      resourceGroupName_DEV: $(resourceGroupName_GqlRest_DEV)
      resourceGroupName_SIT: $(resourceGroupName_GqlRest_SIT)
      resourceGroupName_UAT: $(resourceGroupName_GqlRest_UAT)
      resourceGroupName_PROD: $(resourceGroupName_GqlRest_PROD)
      functionAppName_DEV: $(functionAppName_DEV)
      functionAppName_SIT: $(functionAppName_SIT)
      functionAppName_UAT: $(functionAppName_UAT)
      functionAppName_PROD: $(functionAppName_PROD)
      functionAppName_DEV_Secure: $(functionAppName_DEV_Secure)
      functionAppName_SIT_Secure: $(functionAppName_SIT_Secure)
      functionAppName_UAT_Secure: $(functionAppName_UAT_Secure)
      functionAppName_PROD_Secure: $(functionAppName_PROD_Secure)
      APIM_IP_DEV_SIT_UAT: $(APIM_IP_DEV_SIT_UAT)
      APIM_IP_PRD: $(APIM_IP_PRD)
      APIM_NonProd: $(APIM_NonProd)
      APIM_Prod: $(APIM_Prod)
      APIMResourceGroupName_NonProd: $(APIMResourceGroupName_NonProd)       
      APIMServiceConnection_NonProd: $(APIMServiceConnection_NonProd)
      APIMSubscriptionId_NonProd: $(APIMSubscriptionId_NonProd) 
      APIMResourceGroupName_Prod: $(APIMResourceGroupName_Prod)       
      APIMServiceConnection_Prod: $(APIMServiceConnection_Prod)
      APIMSubscriptionId_Prod: $(APIMSubscriptionId_Prod)
      workspaceResourceId: $(workspaceResourceId)
      workspaceResourceId_prod: $(workspaceResourceId_prod)
      asename: $(asename)
      asename_prod: $(asename_prod)
      WEBSITE_DNS_ALT_SERVER: $(WEBSITE_DNS_ALT_SERVER)
      WEBSITE_DNS_SERVER: $(WEBSITE_DNS_SERVER)
      AppInsightsName_DEV: $(AppInsightsName_Rest_DEV)
      AppInsightsName_SIT: $(AppInsightsName_Rest_SIT)
      AppInsightsName_UAT: $(AppInsightsName_Rest_UAT)
      AppInsightsName_PROD: $(AppInsightsName_Rest_PROD)
      storageAccountName_DEV: $(storageAccountName_Rest_DEV)
      storageAccountName_SIT: $(storageAccountName_Rest_SIT)
      storageAccountName_UAT: $(storageAccountName_Rest_UAT)
      storageAccountName_PROD: $(storageAccountName_Rest_PROD)
      AppInsightsName_Secure_DEV: $(AppInsightsName_Rest_secure_DEV)
      AppInsightsName_Secure_SIT: $(AppInsightsName_Rest_secure_SIT)
      AppInsightsName_Secure_UAT: $(AppInsightsName_Rest_secure_UAT)
      AppInsightsName_Secure_PROD: $(AppInsightsName_Rest_secure_PROD)
      storageAccountName_Secure_DEV: $(storageAccountName_Rest_secure_DEV)
      storageAccountName_Secure_SIT: $(storageAccountName_Rest_secure_SIT)
      storageAccountName_Secure_UAT: $(storageAccountName_Rest_secure_UAT)
      storageAccountName_Secure_PROD: $(storageAccountName_Rest_secure_PROD)
      KeyvaultName_DEV: $(Gateway_Keyvault_DEV)
      KeyvaultName_SIT: $(Gateway_Keyvault_SIT)
      KeyvaultName_UAT: $(Gateway_Keyvault_UAT)
      KeyvaultName_PROD: $(Gateway_Keyvault_PROD)
      Redis_DEV: $(Redis_DEV)
      Redis_SIT: $(Redis_SIT)
      Redis_UAT: $(Redis_UAT)
      Redis_PROD: $(Redis_PROD)
