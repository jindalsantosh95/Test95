

trigger:
  branches:
    include:
    - '*'
    
  paths:
    include:
      - VAA.EAPI.GraphQL*
      
  

variables:  
  - name: SolutionName
    value: 'VAA.EAPI.GraphQL'
  - name: RootPath
    value: 'VAA.EAPI.GraphQL'
  - name: BuildConfiguration
    value: 'release'

    
      
name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)
stages:
 - stage: 'build'
   
   
   jobs: 
    - job: buildDev
      displayName: Build Dev    
      pool:
       vmImage: 'windows-latest'
      

      steps: 
       - template: templates/build.yml
       #- template: templates/build.yml
         parameters:
          buildConfiguration: $(BuildConfiguration)
          applicationName: $(SolutionName)     
          RootPath:  $(RootPath)

      
       

 - stage: 'DeploytoDev'
   variables: 
    - template: ../variables/GraphQL-dev-var.yml
   displayName: 'Deploy Function to Dev' 
   condition: and(succeeded(),eq(variables['Build.SourceBranch'], 'refs/heads/main'))
   dependsOn: build   
   jobs:
     - template: templates/deployment.yml   
     #- template: templates/deployment.yml
       parameters:
        JobName: 'DeployDev'
        FunctionName: ${{variables.GraphQLFunctionApp}}
        SolutionName: $(SolutionName)       
        ServiceConnection: ${{variables.ServiceConnection}}
        Environment: ${{variables.Environment}}
        RG_FunctionApp: ${{variables.RG_FunctionApp}}
        Subscriptionid: ${{variables.Subscriptionid}}
 
 - stage: 'DeploytoSIT'
   variables: 
    - template: ../variables/GraphQL-sit-var.yml
   displayName: 'Deploy Function to SIT' 
   condition: and(succeeded(),eq(variables['Build.SourceBranch'], 'refs/heads/main'))
   dependsOn: build   
   jobs:
     - template: templates/deployment.yml   
     #- template: templates/deployment.yml
       parameters:
        JobName: 'DeploytoSIT'
        FunctionName: ${{variables.GraphQLFunctionApp}}
        SolutionName: $(SolutionName)       
        ServiceConnection: ${{variables.ServiceConnection}}
        Environment: ${{variables.Environment}}
        RG_FunctionApp: ${{variables.RG_FunctionApp}}
        Subscriptionid: ${{variables.Subscriptionid}}

 - stage: 'DeploytoUAT'
   variables: 
    - template: ../variables/GraphQL-uat-var.yml
   displayName: 'Deploy Function to Uat' 
   condition: and(succeeded(),eq(variables['Build.SourceBranch'], 'refs/heads/main'))
   dependsOn: build   
   jobs:
     - template: templates/deployment.yml   
     #- template: templates/deployment.yml
       parameters:
        JobName: 'DeploytoUAT'
        FunctionName: ${{variables.GraphQLFunctionApp}}
        SolutionName: $(SolutionName)       
        ServiceConnection: ${{variables.ServiceConnection}}
        Environment: ${{variables.Environment}}
        RG_FunctionApp: ${{variables.RG_FunctionApp}}
        Subscriptionid: ${{variables.Subscriptionid}}

 - stage: 'DeploytoProd'
   variables: 
    - template: ../variables/GraphQL-prod-var.yml
   displayName: 'Deploy Function to Prod' 
   condition: and(succeeded(),eq(variables['Build.SourceBranch'], 'refs/heads/main'))
   dependsOn: build   
   jobs:
     - template: templates/deployment.yml   
     #- template: templates/deployment.yml
       parameters:
        JobName: 'DeploytoProd'
        FunctionName: ${{variables.GraphQLFunctionApp}}
        SolutionName: $(SolutionName)       
        ServiceConnection: ${{variables.ServiceConnection}}
        Environment: ${{variables.Environment}}
        RG_FunctionApp: ${{variables.RG_FunctionApp}}
        Subscriptionid: ${{variables.Subscriptionid}}