query Query($request: CarbonIndexRequestInput!) {
  CarbonIndex(request: $request) {
    originAirport
    destinationAirport
    flightNumber
    flightDate
    requestId
    sourceMethodology
    sourceQuality
    kilosCo2e    
    source
    refSourceMethodology
    refSourceQuality
    refKilosCo2e    
    refSource
    statusCode
    errorMessage
    fareFamilies
  }
}