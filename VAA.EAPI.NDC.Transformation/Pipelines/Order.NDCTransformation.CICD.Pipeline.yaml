trigger:
  branches:
    include:
      - '*'
    
  paths:
    include:
      - VAA.EAPI.NDC.Transformation/Microservices/VAA.EAPI.NDC.Order
      - VAA.EAPI.NDC.Transformation/VAA.EAPI.NDC.Order.Deployment
      - VAA.EAPI.NDC.Transformation/Pipelines/Order*

variables: 
  - group: Common_Variables
  - group: APIM  
  - group: APIM_IP
  - group: Spectral_Ops
  - group: AzureWebJobsStorage
  - name: agentPool
    value: 'Azure Pipelines' 
  - name: agentPool1
    value: 'LoyaltySystems'   
  - name: agentSpecification
    value: 'windows-latest'
  - name: buildConfiguration
    value: 'release'           
  - name: rootPath
    value: 'VAA.EAPI.NDC.Transformation'  
  - name: subRootPath
    value: 'VAA.EAPI.NDC.Order'  
  - name: microserviceName
    value: 'NDCOrder' 
  - name: productId
    value: 'EAPI_NDCTransformation'  
  - name: apimurlname
    value: 'NDCTranformation_order'         
  - name: functionAppName_DEV
    value: 'avadeunafnndcorder' 
  - name: functionAppName_SIT
    value: 'avateunafnndcorder'
  - name: functionAppName_UAT
    value: 'avaseunafnndcorder' 
  - name: functionAppName_SANDBOX
    value: 'avaieunafnndcorder'
  - name: functionAppName_PRD
    value: 'avapeunafnndcorder'   
  - name: slotName
    value: 'DS'  
  - name: resourceGroupName_DEV
    value: 'RG-VA-D-EUN-NDCTRANSFORMATION' 
  - name: resourceGroupName_SIT
    value: 'RG-VA-T-EUN-NDCTRANSFORMATION'
  - name: resourceGroupName_UAT
    value: 'RG-VA-S-EUN-NDCTRANSFORMATION' 
  - name: resourceGroupName_SANDBOX
    value: 'RG-VA-I-EUN-NDCTRANSFORMATION'
  - name: resourceGroupName_PROD
    value: 'RG-VA-P-EUN-NDCTRANSFORMATION'

          
      
name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)

stages:
  # CI (Build) Pipeline
  - template: Functions/build.yaml
    parameters:   
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification)
      buildConfiguration: $(buildConfiguration)
      location: $(location)           
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      SPECTRAL_DSN: $(SPECTRAL_DSN)
      SPECTRAL_KEY: $(SPECTRAL_KEY)
      resourceGroupName_DEV: $(resourceGroupName_DEV)
      resourceGroupName_SIT: $(resourceGroupName_SIT)
      resourceGroupName_UAT: $(resourceGroupName_UAT)
      resourceGroupName_SANDBOX: $(resourceGroupName_SANDBOX)
      resourceGroupName_PROD: $(resourceGroupName_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      serviceConnection_Prod: $(serviceConnection_Prod)

  # CD (Deployment) Pipeline
  - template: Functions/release.yaml
    parameters:
      agentPool: $(agentPool)
      agentPool_SANDBOX: $(agentPool1)
      agentSpecification: $(agentSpecification) 
      buildConfiguration: $(buildConfiguration)  
      location: $(location)
      functionAppName_DEV: $(functionAppName_DEV)
      functionAppName_SIT: $(functionAppName_SIT)
      functionAppName_UAT: $(functionAppName_UAT)
      functionAppName_SANDBOX: $(functionAppName_SANDBOX)
      functionAppName_PRD: $(functionAppName_PRD) 
      AzureWebJobsStorage_DEV: $(AzureWebJobsStorage_NDCOrder_DEV)
      AzureWebJobsStorage_SIT: $(AzureWebJobsStorage_NDCOrder_SIT)
      AzureWebJobsStorage_UAT: $(AzureWebJobsStorage_NDCOrder_UAT)
      AzureWebJobsStorage_SANDBOX: $(AzureWebJobsStorage_NDCOrder_SANDBOX)
      AzureWebJobsStorage_PROD: $(AzureWebJobsStorage_NDCOrder_PROD)
      slotName: $(slotName)      
      APIM_NonProd: $(APIM_NonProd)
      APIM_Prod: $(APIM_Prod)           
      APIM_IP_DEV_SIT_UAT: $(APIM_IP_DEV_SIT_UAT)
      APIM_IP_PRD: $(APIM_IP_PRD)
      WEBSITE_DNS_ALT_SERVER: $(WEBSITE_DNS_ALT_SERVER)
      WEBSITE_DNS_SERVER: $(WEBSITE_DNS_SERVER)        
      WEBSITE_DNS_ALT_SERVER_SANDBOX: $(WEBSITE_DNS_ALT_SERVER_SANDBOX)
      WEBSITE_DNS_SERVER_SANDBOX: $(WEBSITE_DNS_SERVER_SANDBOX)