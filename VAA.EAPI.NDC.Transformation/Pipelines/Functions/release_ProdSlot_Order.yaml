parameters:
  agentPool: ''
  agentPool_Sanity: ''
  agentPool_SANDBOX: ''
  agentSpecification: ''
  buildConfiguration: ''   
  functionAppName_DEV: ''
  functionAppName_SIT: ''
  functionAppName_SANDBOX: ''
  functionAppName_Preview: ''
  functionAppName_UAT: ''
  functionAppName_PRD: ''
  AzureWebJobsStorage_DEV: ''
  AzureWebJobsStorage_SIT: ''
  AzureWebJobsStorage_UAT: ''
  AzureWebJobsStorage_SANDBOX: ''
  AzureWebJobsStorage_PROD: '' 
  APIM_IP_DEV_SIT_UAT: '' 
  APIM_IP_PRD: ''
  WEBSITE_DNS_ALT_SERVER: ''
  WEBSITE_DNS_SERVER: ''
  WEBSITE_DNS_ALT_SERVER_SANDBOX: ''
  WEBSITE_DNS_SERVER_SANDBOX: ''

stages:
  - stage: 'AFN_DEV'
    variables: 
    - template: /VAA.EAPI.NDC.Transformation/Pipelines/Variables/dev.yaml
    displayName: 'AFN - DEV' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:   
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/deployment_ProdSlot.yaml   
        parameters:
          functionAppName: ${{parameters.functionAppName_DEV}}
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}          
          environment: ${{variables.environment}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName}}       
          serviceConnection: ${{variables.serviceConnection}}
          subscriptionId: ${{variables.subscriptionId}}
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}} 
          AzureWebJobsStorage: ${{parameters.AzureWebJobsStorage_DEV}}

  - stage: 'Testing_DEV'
    displayName: 'NDC Sanity-DEV' 
    dependsOn: AFN_DEV  
    jobs:  
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/functional_testing_ndc.yaml
        parameters:
          agentPool: ${{parameters.agentPool_Sanity}}
          agentSpecification: ${{parameters.agentSpecification}}  
          buildConfiguration: ${{parameters.buildConfiguration}} 
          testRepoPath: ${{parameters.testRepoPath_DEV}} 
          variableGroupName: ${{parameters.VARIABLE_GROUP_NAME_NDC_DEV}} 

  - stage: 'AFN_SIT'
    variables: 
    - template: /VAA.EAPI.NDC.Transformation/Pipelines/Variables/sit.yaml
    displayName: 'AFN - SIT' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/deployment_ProdSlot.yaml   
        parameters:
          functionAppName: ${{parameters.functionAppName_SIT}}
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}                 
          environment: ${{variables.environment}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName}}        
          serviceConnection: ${{variables.serviceConnection}}
          subscriptionId: ${{variables.subscriptionId}}
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}  
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}    
          AzureWebJobsStorage: ${{parameters.AzureWebJobsStorage_SIT}}
          
  - stage: 'Testing_SIT'
    displayName: 'NDC Sanity-SIT' 
    dependsOn: AFN_SIT  
    jobs:  
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/functional_testing_ndc.yaml
        parameters:
          agentPool: ${{parameters.agentPool_Sanity}}
          agentSpecification: ${{parameters.agentSpecification}}  
          buildConfiguration: ${{parameters.buildConfiguration}} 
          testRepoPath: ${{parameters.testRepoPath_SIT}} 
          variableGroupName: ${{parameters.VARIABLE_GROUP_NAME_NDC_SIT}}
                                         

  - stage: 'AFN_UAT'
    variables: 
    - template: /VAA.EAPI.NDC.Transformation/Pipelines/Variables/uat.yaml
    displayName: 'AFN - UAT' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/deployment_ProdSlot.yaml   
        parameters:
          functionAppName: ${{parameters.functionAppName_UAT}}
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}                 
          environment: ${{variables.environment}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName}}        
          serviceConnection: ${{variables.serviceConnection}}
          subscriptionId: ${{variables.subscriptionId}}
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}} 
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}} 
          AzureWebJobsStorage: ${{parameters.AzureWebJobsStorage_UAT}}

  - stage: 'Testing_UAT'
    displayName: 'NDC Sanity-UAT' 
    dependsOn: AFN_UAT  
    jobs:  
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/functional_testing_ndc.yaml
        parameters:
          agentPool: ${{parameters.agentPool_Sanity}}
          agentSpecification: ${{parameters.agentSpecification}}  
          buildConfiguration: ${{parameters.buildConfiguration}} 
          testRepoPath: ${{parameters.testRepoPath_UAT}} 
          variableGroupName: ${{parameters.VARIABLE_GROUP_NAME_NDC_UAT}} 
  
          
  - stage: 'AFN_SANDBOX'
    variables: 
    - template: /VAA.EAPI.NDC.Transformation/Pipelines/Variables/sandbox.yaml
    displayName: 'AFN - SANDBOX' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/deployment_SBPR.yaml   
        parameters:
          functionAppName: ${{parameters.functionAppName_SANDBOX}}
          agentPool: ${{parameters.agentPool_SANDBOX}}
          agentSpecification: ${{parameters.agentSpecification}}                
          environment: ${{variables.environment}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName}}        
          serviceConnection: ${{variables.serviceConnection}}
          subscriptionId: ${{variables.subscriptionId}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER_SANDBOX}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER_SANDBOX}}
          AzureWebJobsStorage: ${{parameters.AzureWebJobsStorage_SANDBOX}}

  - stage: 'Testing_Sandbox'
    displayName: 'NDC Sanity-Sandbox' 
    dependsOn: AFN_SANDBOX  
    jobs:  
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/functional_testing_ndc.yaml
        parameters:
          agentPool: ${{parameters.agentPool_Sanity}}
          agentSpecification: ${{parameters.agentSpecification}}  
          buildConfiguration: ${{parameters.buildConfiguration}} 
          testRepoPath: ${{parameters.testRepoPath_SANDBOX}} 
          variableGroupName: ${{parameters.VARIABLE_GROUP_NAME_NDC_Sandbox}} 
          
  - stage: 'AFN_Preview'
    variables: 
    - template: /VAA.EAPI.NDC.Transformation/Pipelines/Variables/preview.yaml
    displayName: 'AFN - preview' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/deployment_SBPR.yaml   
        parameters:
          functionAppName: ${{parameters.functionAppName_Preview}}
          agentPool: ${{parameters.agentPool_SANDBOX}}
          agentSpecification: ${{parameters.agentSpecification}}                
          environment: ${{variables.environment}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName}}        
          serviceConnection: ${{variables.serviceConnection}}
          subscriptionId: ${{variables.subscriptionId}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER_SANDBOX}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER_SANDBOX}}
          AzureWebJobsStorage: ${{parameters.AzureWebJobsStorage_SANDBOX}}

  - stage: 'Testing_Preview'
    displayName: 'NDC Sanity-Preview' 
    dependsOn: AFN_Preview  
    jobs:  
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/functional_testing_ndc.yaml
        parameters:
          agentPool: ${{parameters.agentPool_Sanity}}
          agentSpecification: ${{parameters.agentSpecification}}  
          buildConfiguration: ${{parameters.buildConfiguration}} 
          testRepoPath: ${{parameters.testRepoPath_PREVIEW}} 
          variableGroupName: ${{parameters.VARIABLE_GROUP_NAME_NDC_Preview}}
          
  - stage: 'AFN_PROD'
    variables: 
    - template: /VAA.EAPI.NDC.Transformation/Pipelines/Variables/prod.yaml
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.NDC.Transformation/Pipelines/Functions/deployment_ProdSlot.yaml   
        parameters:
          functionAppName: ${{parameters.functionAppName_PRD}}
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}                 
          environment: ${{variables.environment}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName}}        
          serviceConnection: ${{variables.serviceConnection}}
          subscriptionId: ${{variables.subscriptionId}}   
          APIM_IP: ${{parameters.APIM_IP_PRD}}  
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}  
          AzureWebJobsStorage: ${{parameters.AzureWebJobsStorage_PROD}}            