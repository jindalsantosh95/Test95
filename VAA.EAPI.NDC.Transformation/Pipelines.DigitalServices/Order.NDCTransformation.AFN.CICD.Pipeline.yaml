trigger:
  branches:
    include:
      - '*'

  paths:
    include:
      - VAA.EAPI.NDC.Transformation/VAA.EAPI.NDC.Order
      - VAA.EAPI.NDC.Transformation/VAA.EAPI.NDC.Order.Deployment
      - VAA.EAPI.NDC.Transformation/Pipelines.DigitalServices/Order*
    exclude: 
      - VAA.EAPI.NDC.Transformation/VAA.EAPI.NDC.Order.bruno
pr:
  branches:
    include:
      - main

  paths:
    include:
      - VAA.EAPI.NDC.Transformation/VAA.EAPI.NDC.Order
      - VAA.EAPI.NDC.Transformation/VAA.EAPI.NDC.Order.Deployment
      - VAA.EAPI.NDC.Transformation/Pipelines.DigitalServices/Order*
    exclude: 
      - VAA.EAPI.NDC.Transformation/VAA.EAPI.NDC.Order.bruno

variables: 
  - group: Common_Variables
  - group: Digital_Variables
  - group: APIM  
  - group: APIM_IP
  - group: Spectral_Ops
  - group: AzureWebJobsStorage
  - name: agentPool
    value: 'Azure Pipelines' 
  - name: agentPool1
    value: 'LoyaltySystems'
  - name: agentPool2
    value: 'EAPITestingAgent'
  - name: agentSpecification
    value: 'windows-latest'
  - name: buildConfiguration
    value: 'release'           
  - name: rootPath
    value: 'VAA.EAPI.NDC.Transformation'  
  - name: subRootPath
    value: 'VAA.EAPI.NDC.Order'  
  - name: microserviceName
    value: 'NDCOrder' 
  - name: productId
    value: 'EAPI_NDCTransformation'  
  - name: apimurlname
    value: 'NDCTranformation_order'         
  - name: functionAppName_DEV
    value: 'va-dv-eun-ndcorder-fn-01' 
  - name: functionAppName_SIT
    value: 'va-ts-eun-ndcorder-fn-01'
  - name: functionAppName_UAT
    value: 'va-tu-eun-ndcorder-fn-01' 
  - name: functionAppName_SANDBOX
    value: 'avaieunafnndcorder'
  - name: functionAppName_Preview
    value: 'avabeunafnndcorder'
  - name: functionAppName_PROD
    value: 'va-pr-eun-ndcorder-fn-01'
  - name: ApiVersion
    value: 'v2'
  - name: resourceGroupName_DEV
    value: 'rg-va-dv-eun-ndc-transform-01' 
  - name: resourceGroupName_SIT
    value: 'rg-va-ts-eun-ndc-transform-01'
  - name: resourceGroupName_UAT
    value: 'rg-va-tu-eun-ndc-transform-01' 
  - name: resourceGroupName_SANDBOX
    value: 'RG-VA-I-EUN-NDCTRANSFORMATION'
  - name: resourceGroupName_Preview
    value: 'RG-VA-b-EUN-NDCTRANSFORMATION'
  - name: resourceGroupName_PROD
    value: 'rg-va-pr-eun-ndc-transform-01'



name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)

stages:
  # CI (Build) Pipeline
  - template: functions_digital/build_digital.yaml
    parameters:   
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification)
      buildConfiguration: $(buildConfiguration)
      location: $(location)           
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      SPECTRAL_DSN: $(SPECTRAL_DSN)
      SPECTRAL_KEY: $(SPECTRAL_KEY)
      resourceGroupName_DEV: $(resourceGroupName_DEV)
      resourceGroupName_SIT: $(resourceGroupName_SIT)
      resourceGroupName_UAT: $(resourceGroupName_UAT)
      resourceGroupName_SANDBOX: $(resourceGroupName_SANDBOX)
      resourceGroupName_Preview: $(resourceGroupName_Preview)
      resourceGroupName_PROD: $(resourceGroupName_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      subscriptionId_NonProd: $(subscriptionId_NonProd) 
      serviceConnection_Prod: $(serviceConnection_Prod)
      subscriptionId_Prod: $(subscriptionId_Prod)    

  # CD (Deployment) Pipeline
  - template: functions_digital/release_digital.yaml
    parameters:
      agentPool: $(agentPool)
      agentPool_deployment: $(agentPool1)
      agentPool_Sanity: $(agentPool1)
      agentPool_SANDBOX: $(agentPool1)
      agentSpecification: $(agentSpecification) 
      buildConfiguration: $(buildConfiguration)  
      location: $(location)
      functionAppName_DEV: $(functionAppName_DEV)
      functionAppName_SIT: $(functionAppName_SIT)
      functionAppName_UAT: $(functionAppName_UAT)
      functionAppName_SANDBOX: $(functionAppName_SANDBOX)
      functionAppName_Preview: $(functionAppName_Preview)
      functionAppName_PROD: $(functionAppName_PROD) 
      resourceGroupName_DEV: $(resourceGroupName_DEV)
      resourceGroupName_SIT: $(resourceGroupName_SIT)
      resourceGroupName_UAT: $(resourceGroupName_UAT)
      resourceGroupName_SANDBOX: $(resourceGroupName_SANDBOX)
      resourceGroupName_PROD: $(resourceGroupName_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      subscriptionId_NonProd: $(subscriptionId_NonProd) 
      serviceConnection_Prod: $(serviceConnection_Prod)
      subscriptionId_Prod: $(subscriptionId_Prod)    
      APIM_IP_DEV_SIT_UAT: $(APIM_IP_DEV_SIT_UAT)
      APIM_IP_PRD: $(APIM_IP_PRD)
      APIM_NonProd: $(APIM_NonProd)
      APIM_Prod: $(APIM_Prod)
      APIMResourceGroupName_NonProd: $(APIMResourceGroupName_NonProd)       
      APIMServiceConnection_NonProd: $(APIMServiceConnection_NonProd)
      APIMSubscriptionId_NonProd: $(APIMSubscriptionId_NonProd) 
      APIMResourceGroupName_Prod: $(APIMResourceGroupName_Prod)       
      APIMServiceConnection_Prod: $(APIMServiceConnection_Prod)
      APIMSubscriptionId_Prod: $(APIMSubscriptionId_Prod)
      workspaceResourceId: $(workspaceResourceId)
      workspaceResourceId_prod: $(workspaceResourceId_prod)
      asename: $(asename)
      asename_prod: $(asename_prod)
      AzureWebJobsStorage_DEV: $(AzureWebJobsStorage_NDCOrder_DEV)
      AzureWebJobsStorage_SIT: $(AzureWebJobsStorage_NDCOrder_SIT)
      AzureWebJobsStorage_UAT: $(AzureWebJobsStorage_NDCOrder_UAT)
      AzureWebJobsStorage_SANDBOX: $(AzureWebJobsStorage_NDCOrder_SANDBOX)
      AzureWebJobsStorage_PROD: $(AzureWebJobsStorage_NDCOrder_PROD)   
      WEBSITE_DNS_ALT_SERVER: $(WEBSITE_DNS_ALT_SERVER)
      WEBSITE_DNS_SERVER: $(WEBSITE_DNS_SERVER)        
      WEBSITE_DNS_ALT_SERVER_SANDBOX: $(WEBSITE_DNS_ALT_SERVER_SANDBOX)
      WEBSITE_DNS_SERVER_SANDBOX: $(WEBSITE_DNS_SERVER_SANDBOX)
      VARIABLE_GROUP_NAME_NDC_DEV: "TESTING_NDC_DEV"
      VARIABLE_GROUP_NAME_NDC_SIT: "TESTING_NDC_SIT"
      VARIABLE_GROUP_NAME_NDC_UAT: "TESTING_NDC_UAT"
      VARIABLE_GROUP_NAME_NDC_Preview: "TESTING_NDC_Preview"
      VARIABLE_GROUP_NAME_NDC_Sandbox: "TESTING_NDC_Sandbox"
