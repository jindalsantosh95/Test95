name: ai-delivery-sequence-goal-loop

on:
  workflow_dispatch:
    inputs:
      automatic_resume:
        description: Monitor recovery; retain the goal document's bounded continuation count.
        required: false
        default: false
        type: boolean
      smoke_test:
        description: Create and process a harmless Ready smoke-test diagram without running the external agent command.
        required: false
        default: false
        type: boolean
  push:
    branches-ignore: [main]
    paths:
      - docs/sequence-diagrams.md
      - docs/sequence-diagrams/*.md

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sequence-goal-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-delivery-agents:
    name: Resolve delivery agents
    runs-on: ubuntu-latest
    outputs:
      documentation_only: ${{ steps.route.outputs.documentation_only }}
      delivery_surfaces: ${{ steps.route.outputs.delivery_surfaces }}
      development_agent: ${{ steps.route.outputs.development_agent }}
      qa_agent: ${{ steps.route.outputs.qa_agent }}
      qa_matrix: ${{ steps.route.outputs.qa_matrix }}
      qa_count: ${{ steps.route.outputs.qa_count }}
      remote_matrix: ${{ steps.route.outputs.remote_matrix }}
      remote_count: ${{ steps.route.outputs.remote_count }}
      has_diagrams: ${{ steps.route.outputs.has_diagrams }}
      has_index: ${{ steps.route.outputs.has_index }}
      has_inprogress: ${{ steps.route.outputs.has_inprogress }}
      inprogress_list: ${{ steps.route.outputs.inprogress_list }}
    steps:
      - name: Detect sequence-goal GitHub App credentials
        id: app-credentials
        shell: pwsh
        env:
          APP_ID: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
          APP_SLUG: ${{ vars.SEQUENCE_GOAL_GITHUB_APP_SLUG }}
        run: |
          $hasAppId = -not [string]::IsNullOrWhiteSpace($env:APP_ID)
          $hasPrivateKey = -not [string]::IsNullOrWhiteSpace($env:APP_PRIVATE_KEY)
          if ($hasAppId -xor $hasPrivateKey) {
            throw 'Sequence-goal GitHub App configuration is incomplete; both App ID and private key are required.'
          }
          if ($hasAppId -and [string]::IsNullOrWhiteSpace($env:APP_SLUG)) {
            throw 'SEQUENCE_GOAL_GITHUB_APP_SLUG is required when sequence-goal GitHub App credentials are configured.'
          }
          "configured=$(($hasAppId -and $hasPrivateKey).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create cross-repository routing token
        id: routing-token
        if: steps.app-credentials.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          private-key: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
          owner: VAAD1ST

      - name: Check out source for routing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve goal delivery surface
        id: route
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.routing-token.outputs.token || github.token }}
          SEQUENCE_GOAL_COORDINATOR_REPOSITORY: ${{ github.repository }}
          SEQUENCE_GOAL_WEBUI_REPOSITORY: ${{ vars.SEQUENCE_GOAL_WEBUI_REPOSITORY }}
          SEQUENCE_GOAL_IOS_BASE_BRANCH: ${{ vars.SEQUENCE_GOAL_IOS_BASE_BRANCH }}
          SEQUENCE_GOAL_ANDROID_BASE_BRANCH: ${{ vars.SEQUENCE_GOAL_ANDROID_BASE_BRANCH }}
          SEQUENCE_GOAL_WEBUI_BASE_BRANCH: ${{ vars.SEQUENCE_GOAL_WEBUI_BASE_BRANCH }}
          SEQUENCE_GOAL_GITHUB_APP_SLUG: ${{ vars.SEQUENCE_GOAL_GITHUB_APP_SLUG }}
        run: |
          ./scripts/resolve-sequence-goal-delivery-agents.ps1 -SmokeTest:([bool]('${{ inputs.smoke_test }}' -eq 'true'))
  run-sequence-loop:
    name: Sequence goal coordinator
    needs: resolve-delivery-agents
    if: needs.resolve-delivery-agents.outputs.documentation_only != 'true' && (github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && github.actor != vars.SEQUENCE_GOAL_GITHUB_APP_SLUG && github.actor != format('{0}[bot]', vars.SEQUENCE_GOAL_GITHUB_APP_SLUG)))
    concurrency:
      group: sequence-goal-ledger-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SEQUENCE_GOAL_PRODUCTION_JOB_TIMEOUT_MINUTES || '90') }}
    env:
      SEQUENCE_GOAL_MAX_CHANGED_FILES: ${{ vars.SEQUENCE_GOAL_MAX_CHANGED_FILES || '200' }}
      SEQUENCE_GOAL_AGENT_TIMEOUT_MINUTES: ${{ vars.SEQUENCE_GOAL_AGENT_TIMEOUT_MINUTES || '40' }}
      SEQUENCE_GOAL_VERIFY_TIMEOUT_MINUTES: ${{ vars.SEQUENCE_GOAL_VERIFY_TIMEOUT_MINUTES || '20' }}
    outputs:
      has_diagrams: ${{ steps.detect.outputs.has_diagrams }}
      has_index: ${{ steps.detect.outputs.has_index }}
      has_inprogress: ${{ steps.inprogress.outputs.has_inprogress }}
      inprogress_list: ${{ steps.inprogress.outputs.inprogress_list }}
      goal_document: ${{ steps.evidence.outputs.goal_document }}
      delivery_surfaces: ${{ needs.resolve-delivery-agents.outputs.delivery_surfaces }}
      qa_agent: ${{ needs.resolve-delivery-agents.outputs.qa_agent }}
      qa_matrix: ${{ needs.resolve-delivery-agents.outputs.qa_matrix }}
      qa_count: ${{ needs.resolve-delivery-agents.outputs.qa_count }}
      remote_matrix: ${{ needs.resolve-delivery-agents.outputs.remote_matrix }}

    steps:
      - name: Detect sequence-goal GitHub App credentials
        id: app-credentials
        shell: pwsh
        env:
          APP_ID: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
        run: |
          "configured=$(((-not [string]::IsNullOrWhiteSpace($env:APP_ID)) -and (-not [string]::IsNullOrWhiteSpace($env:APP_PRIVATE_KEY))).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create sequence-goal GitHub App token
        id: app-token
        if: steps.app-credentials.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        env:
          APP_ID: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Fetch active delivery refs
        shell: pwsh
        run: |
          $branchRef = "+refs/heads/$($env:GITHUB_REF_NAME):refs/remotes/origin/$($env:GITHUB_REF_NAME)"
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main $branchRef

      - name: Sync branch with main
        if: github.ref_name != 'main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Branch already contains origin/main."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Automatic conflict recovery failed while merging origin/main. Resolve conflicts on the branch and rerun the loop."
          }

          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: Prepare smoke-test Ready goal
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_test == true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagram = 'docs/sequence-diagrams/agent-loop-smoke-test.md'
          $today = (Get-Date).ToString('yyyy-MM-dd')

          @"
          # Agent Loop Smoke Test

          Harmless workflow smoke test for the sequence-goal agent loop.

          ## Agent Loop Goal

          | Field | Value |
          | --- | --- |
          | Goal | Prove the sequence-goal workflow can promote, verify, complete, and record evidence without touching product code. |
          | Status | ``Ready`` |
          | Owner | Platform Engineering |
          | Review cadence | On workflow change |
          | Last reviewed | $today |
          | Harness Sensor | ``scripts/check-sequence-diagram-status.ps1`` |
          | Promotion verification | Fast |
          | Maximum agent resources | 0 tokens; `$0.00 USD` |
          | Actual agent resources | 0 tokens (0 input, 0 cached + 0 output, 0 reasoning); `$0.00 USD` |
          | Acceptance evidence | Smoke run records promotion, verification, completion, and cleanup in the GitHub Actions run. |
          | Done when | Workflow smoke run completes and records evidence. |

          ## Why this flow exists

          This diagram exists only to exercise the agent loop safely.

          ## High-level behavior

          1. Create a Ready goal.
          2. Let the workflow promote it to InProgress.
          3. Skip external agent execution in smoke mode.
          4. Run harness verification and promote to Complete.

          ## Integration points

          | Component | Responsibility |
          | --- | --- |
          | ``ai-delivery-sequence-goal-loop.yml`` | Executes the smoke delivery loop. |
          | ``scripts/check-sequence-diagram-status.ps1`` | Validates sequence goal metadata. |

          ## Key non-functional considerations

          - **Idempotency**: Re-running the smoke test rewrites this harmless diagram.
          - **Correlation**: GitHub run id is recorded in agent-loop evidence.
          - **Retry behavior**: Uses the standard lock/attempt policy.
          - **No-op path**: No product code or external systems are touched.

          ## Sequence (detailed)

          ````mermaid
          sequenceDiagram
              participant Workflow as ai-delivery-sequence-goal-loop.yml
              participant Diagram as Smoke Diagram
              participant Harness as verify.ps1

              Workflow ->> Diagram: Promote Ready to InProgress
              Workflow ->> Harness: Run scoped verification
              Harness -->> Workflow: Verification passed
              Workflow ->> Diagram: Promote InProgress to Complete
          ````

          ## Failure paths to capture in implementation

          - Verification failure.
          - Stale lock requiring triage.

          Expected behavior:

          - Keep goal InProgress and record run evidence.
          - Require manual stale-lock triage after max attempts.

          ## Agent delivery constraints

          - Do not change product code or call external delivery repositories.
          - Exercise only the coordinator promotion, verification, evidence, and cleanup path.
          - Verify with ``scripts/verify.ps1 -ScopePath '.' -SkipBuild -SkipDeploymentCheck``.

          ## Expected harness

          - ``scripts/check-sequence-diagram-status.ps1``

          ## Open points to finalize

          - None. This is a smoke-test-only goal.
          "@ | Set-Content -LiteralPath $diagram -Encoding UTF8

          $indexPath = 'docs/sequence-diagrams.md'
          $index = Get-Content -LiteralPath $indexPath -Raw
          $row = '| [Agent Loop Smoke Test](sequence-diagrams/agent-loop-smoke-test.md) | Harmless workflow smoke test for sequence-goal automation | `Ready` |'
          if ($index -match 'sequence-diagrams/agent-loop-smoke-test\.md') {
            $index = [regex]::Replace(
              $index,
              '(?im)^\|\s*\[Agent Loop Smoke Test\]\(sequence-diagrams/agent-loop-smoke-test\.md\)\s*\|.*$',
              [System.Text.RegularExpressions.MatchEvaluator]{ param($m) return $row }
            )
          } else {
            $index = [regex]::Replace(
              $index,
              '(?im)(^\|\s*\[Native Search and Book - All Scenarios\]\(sequence-diagrams/vaa-eapi-native-search-and-book-all-scenarios\.md\)\s*\|.*$)',
              [System.Text.RegularExpressions.MatchEvaluator]{ param($m) return "$($m.Value)`r`n$row" }
            )
          }

          [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $indexPath), $index, [System.Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- $diagram $indexPath
          git diff --cached --quiet
          $smokeStagedExit = $LASTEXITCODE
          if ($smokeStagedExit -eq 1) {
            git commit -m 'chore(sequence-goal): prepare smoke-test goal'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to commit smoke-test goal before origin binding.' }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to push smoke-test goal before origin binding.' }
          } elseif ($smokeStagedExit -ne 0) { throw 'Failed to inspect staged smoke-test goal.' }

      - name: Detect changed sequence diagrams
        id: detect
        shell: pwsh
        run: |
          foreach ($directory in @('docs', 'docs/sequence-diagrams')) {
            $item = Get-Item -LiteralPath $directory -Force -ErrorAction Stop
            if (-not $item.PSIsContainer -or $item.LinkType -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Sequence-goal directory must be a regular directory: $directory"
            }
          }
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch origin/main for sequence-goal detection.' }
          $diffFiles = @(& git diff --name-only origin/main...HEAD)
          $isSmokeTest = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.smoke_test }}' -eq 'true'
          $hasIndex = $diffFiles -contains 'docs/sequence-diagrams.md'
          "has_index=$($hasIndex.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $diagrams = @(
            @($diffFiles; $(if ($isSmokeTest) { 'docs/sequence-diagrams/agent-loop-smoke-test.md' })) |
            Where-Object {
              $_ -like 'docs/sequence-diagrams/*.md' -and
              ((Split-Path -Leaf $_) -notmatch '(?i)^(_template|template)') -and
              (Test-Path -LiteralPath $_ -PathType Leaf)
            } |
            Sort-Object -Unique
          )

          if ($diagrams.Count -eq 0) {
            "has_diagrams=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No changed sequence diagram files."
            if ($hasIndex) {
              Write-Host "Sequence diagram index changed; verification will still run."
            }
            exit 0
          }

          "has_diagrams=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $joined = ($diagrams -join ';')
          "diagram_list=$joined" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Changed diagram files: $joined"

          $actionableGoals = @()
          foreach ($diagram in $diagrams) {
            $item = Get-Item -LiteralPath $diagram -Force -ErrorAction Stop
            if ($item.LinkType -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                (Split-Path -Parent $item.FullName) -cne (Resolve-Path -LiteralPath 'docs/sequence-diagrams').Path) {
              throw "Sequence goal must be a regular file directly under docs/sequence-diagrams: $diagram"
            }
            $text = Get-Content -LiteralPath $diagram -Raw
            $statusMatch = [regex]::Match($text, '(?im)^\|\s*Status\s*\|\s*`(?<status>[^`]+)`\s*\|\s*$')
            if ($statusMatch.Success -and $statusMatch.Groups['status'].Value.Trim() -in @('Ready', 'InProgress')) {
              $actionableGoals += $diagram
            }
          }

          if (-not $isSmokeTest -and $actionableGoals.Count -gt 1) {
            throw "Sequence-goal branches must own exactly one actionable Ready/InProgress goal diagram. Found $($actionableGoals.Count): $($actionableGoals -join ';')"
          }

      - name: Promote Ready goals to InProgress
        if: steps.detect.outputs.has_diagrams == 'true'
        shell: pwsh
        env:
          DIAGRAM_LIST: ${{ steps.detect.outputs.diagram_list }}
        run: |
          $diagrams = $env:DIAGRAM_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
          foreach ($diagram in $diagrams) {
            $text = Get-Content -LiteralPath $diagram -Raw
            $statusMatch = [regex]::Match($text, '(?im)^\|\s*Status\s*\|\s*`(?<status>[^`]+)`\s*\|\s*$')
            if (-not $statusMatch.Success) {
              continue
            }

            if ($statusMatch.Groups['status'].Value.Trim() -eq 'Ready') {
              ./scripts/promote-sequence-goal.ps1 `
                -DiagramPath $diagram `
                -ToStatus InProgress `
                -TaskRef "branch:$env:GITHUB_REF_NAME" `
                -TransitionNote "Auto-promoted by sequence goal loop on branch push."

            }
          }

      - name: Commit status changes
        if: steps.detect.outputs.has_diagrams == 'true'
        shell: pwsh
        run: |
          if ((git status --porcelain).Length -eq 0) {
            Write-Host "No status changes to commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/sequence-diagrams.md docs/sequence-diagrams
          git commit -m "chore(sequence-goal): auto-promote Ready goals to InProgress"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit Ready-to-InProgress status.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push Ready-to-InProgress status.' }

      - name: Detect InProgress goals
        id: inprogress
        if: steps.detect.outputs.has_diagrams == 'true'
        shell: pwsh
        env:
          DIAGRAM_LIST: ${{ steps.detect.outputs.diagram_list }}
        run: |
          $diagrams = $env:DIAGRAM_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
          $inprogress = @()
          foreach ($diagram in $diagrams) {
            $text = Get-Content -LiteralPath $diagram -Raw
            if ($text -match '(?im)^\|\s*Final state\s*\|\s*`Abandoned`\s*\|\s*$') { continue }
            $statusMatch = [regex]::Match($text, '(?im)^\|\s*Status\s*\|\s*`(?<status>[^`]+)`\s*\|\s*$')
            if ($statusMatch.Success -and $statusMatch.Groups['status'].Value.Trim() -eq 'InProgress') {
              $inprogress += $diagram
            }
          }

          if ($inprogress.Count -eq 0) {
            "has_inprogress=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No InProgress goals detected."
            exit 0
          }

          "has_inprogress=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "inprogress_list=$($inprogress -join ';')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "InProgress goals: $($inprogress -join ';')"

      - name: Initialize coordinator state in goal document
        id: evidence
        if: steps.inprogress.outputs.has_inprogress == 'true'
        shell: pwsh
        env:
          INPROGRESS_LIST: ${{ steps.inprogress.outputs.inprogress_list }}
          AUTOMATIC_RESUME: ${{ inputs.automatic_resume || false }}
          DELIVERY_STAGE: ${{ needs.resolve-delivery-agents.outputs.remote_count == '0' && needs.resolve-delivery-agents.outputs.qa_count == '0' && 'Completion' || 'Delivery' }}
        run: |
          . ./scripts/sequence-goal-document-state.ps1
          $diagrams = @($env:INPROGRESS_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries))
          if ($diagrams.Count -ne 1) { throw 'A delivery branch must own exactly one goal document.' }
          $diagram = $diagrams[0]
          $text = Get-Content -LiteralPath $diagram -Raw
          $previous = Get-GoalTaskState $text Coordinator
          $continuationStage = if ($env:DELIVERY_STAGE -eq 'Completion') { 'Completion' } else { 'Delivery' }
          $priorStage = if ($previous.continuationStage) { $previous.continuationStage } else { 'Delivery' }
          $automaticContinuations = if ($env:AUTOMATIC_RESUME -eq 'true') { $(if ($priorStage -eq $continuationStage) { [int]$previous.automaticContinuations } else { 0 }) + 1 } else { 0 }
          if ($automaticContinuations -gt 3) { throw 'Automatic delivery continuation limit reached. Review the goal document and explicitly restart after resolving the blocker.' }
          $mode = [regex]::Match($text, '(?im)^\|\s*Promotion verification\s*\|\s*`?(?<value>[^`|]+)').Groups['value'].Value.Trim()
          if (-not $mode) { $mode = 'Fast' }
          if ($mode -notin @('Fast','Full')) { throw 'Invalid promotion verification mode.' }
          $state = [ordered]@{
            branch = $env:GITHUB_REF_NAME; repository = $env:GITHUB_REPOSITORY
            runId = '${{ github.run_id }}'; runAttempt = [int]'${{ github.run_attempt }}'
            status = 'InProgress'; startedAtUtc = (Get-Date).ToUniversalTime().ToString('o'); completedAtUtc = $null
            automaticContinuations = $automaticContinuations
            continuationStage = $continuationStage
            continuationLimit = 3
            continuationPolicy = 'Each delivery/completion stage resumes automatically up to three times; Blocked work or exhausted recovery requires an explicit restart.'
            goals = @(@{ diagram=$diagram; title=[regex]::Match($text,'(?im)^\|\s*Goal\s*\|\s*(?<value>[^|]+)').Groups['value'].Value.Trim(); verificationMode=$mode; harnessSensor=[regex]::Match($text,'(?im)^\|\s*Harness Sensor\s*\|\s*(?<value>[^|]+)').Groups['value'].Value.Trim() })
            verification = @(); commits = @(); failure = $null
          }
          Write-GoalTaskState -RepositoryRoot $pwd -Branch $env:GITHUB_REF_NAME -DiagramPath $diagram -Task Coordinator -State $state
          "goal_document=$diagram" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload production-agent command logs
        if: always() && steps.inprogress.outputs.has_inprogress == 'true' && contains(needs.resolve-delivery-agents.outputs.delivery_surfaces, 'Backend') && (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true)
        uses: actions/upload-artifact@v4
        with:
          name: production-agent-command-logs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: TestResults/agent-command-logs/
          if-no-files-found: ignore

  open-coordinator-pr:
    name: Open draft coordinator PR
    needs: [resolve-delivery-agents, run-sequence-loop]
    if: needs.run-sequence-loop.result == 'success' && needs.run-sequence-loop.outputs.has_inprogress == 'true' && (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true)
    concurrency:
      group: sequence-goal-ledger-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Create sequence-goal GitHub App token
        id: app-token
        if: env.APP_ID != '' && env.APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          private-key: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out coordinator branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Create or refresh draft coordinator PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          INPROGRESS_LIST: ${{ needs.run-sequence-loop.outputs.inprogress_list }}
        run: |
          $ErrorActionPreference = 'Stop'
          $diagrams = $env:INPROGRESS_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
          ./scripts/open-sequence-goal-coordinator-pr.ps1 -DiagramPaths $diagrams -Repository '${{ github.repository }}' -CoordinatorBranch $env:GITHUB_REF_NAME -GitHubAppSlug '${{ vars.SEQUENCE_GOAL_GITHUB_APP_SLUG }}' | Write-Host
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- docs/sequence-diagrams
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'chore(sequence-goal): register draft coordinator PR'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to commit draft coordinator PR registration.' }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to push draft coordinator PR registration.' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'Failed to inspect draft coordinator PR registration.'
          }

  deliver-cross-repository-production:
    name: ${{ matrix.agent }}
    env:
      SEQUENCE_GOAL_IOS_BASE_BRANCH: ${{ vars.SEQUENCE_GOAL_IOS_BASE_BRANCH || 'develop' }}
      SEQUENCE_GOAL_ANDROID_BASE_BRANCH: ${{ vars.SEQUENCE_GOAL_ANDROID_BASE_BRANCH || 'develop' }}
      SEQUENCE_GOAL_WEBUI_REPOSITORY: ${{ vars.SEQUENCE_GOAL_WEBUI_REPOSITORY }}
      SEQUENCE_GOAL_WEBUI_BASE_BRANCH: ${{ vars.SEQUENCE_GOAL_WEBUI_BASE_BRANCH || 'main' }}
    needs: [resolve-delivery-agents, run-sequence-loop, open-coordinator-pr]
    if: needs.run-sequence-loop.result == 'success' && needs.run-sequence-loop.outputs.has_inprogress == 'true' && needs.open-coordinator-pr.result == 'success' && needs.resolve-delivery-agents.outputs.remote_count != '0' && (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true) && (github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && github.actor != vars.SEQUENCE_GOAL_GITHUB_APP_SLUG && github.actor != format('{0}[bot]', vars.SEQUENCE_GOAL_GITHUB_APP_SLUG)))
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-delivery-agents.outputs.remote_matrix) }}
    runs-on: ${{ matrix.surface == 'MobileIos' && 'macos-latest' || 'ubuntu-latest' }}
    concurrency:
      group: sequence-goal-production-writer-${{ matrix.repository }}-${{ github.ref_name }}-${{ matrix.surface }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: ${{ fromJSON(vars.SEQUENCE_GOAL_PRODUCTION_JOB_TIMEOUT_MINUTES || '90') }}
    steps:
      - name: Create cross-repository GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          private-key: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo_name }}

      - name: Create coordinator GitHub App token
        id: coordinator-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          private-key: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out coordinator
        uses: actions/checkout@v4
        with:
          path: coordinator
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.base_branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and Codex CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI
        shell: pwsh
        run: |
          npm install -g @openai/codex@0.146.0
          codex --version

      - name: Install and verify SwiftLint for iOS delivery
        if: matrix.surface == 'MobileIos'
        shell: bash
        run: |
          set -euo pipefail
          SWIFTLINT_VERSION="0.65.0"
          SWIFTLINT_ARCHIVE="$RUNNER_TEMP/portable_swiftlint.zip"
          SWIFTLINT_DIR="$RUNNER_TEMP/swiftlint-$SWIFTLINT_VERSION"
          curl --fail --location --retry 3 \
            --output "$SWIFTLINT_ARCHIVE" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6  $SWIFTLINT_ARCHIVE" | shasum -a 256 --check
          mkdir -p "$SWIFTLINT_DIR"
          unzip -q "$SWIFTLINT_ARCHIVE" -d "$SWIFTLINT_DIR"
          SWIFTLINT_BIN="$SWIFTLINT_DIR/swiftlint"
          chmod +x "$SWIFTLINT_BIN"
          echo "$SWIFTLINT_DIR" >> "$GITHUB_PATH"
          test "$("${SWIFTLINT_BIN}" version)" = "$SWIFTLINT_VERSION"

      - name: Deliver production change and create or reuse PR
        id: production_delivery
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COORDINATOR_GH_TOKEN: ${{ steps.coordinator-token.outputs.token }}
          COORDINATOR_REF: ${{ github.ref_name }}
          DELIVERY_SURFACE: ${{ matrix.surface }}
          DELIVERY_REPOSITORY: ${{ matrix.repository }}
          DELIVERY_BASE_BRANCH: ${{ matrix.base_branch }}
          DELIVERY_AGENT: ${{ matrix.agent }}
          SEQUENCE_GOAL_GITHUB_APP_SLUG: ${{ vars.SEQUENCE_GOAL_GITHUB_APP_SLUG }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEQUENCE_GOAL_AGENT_COMMAND_JSON: ${{ secrets.SEQUENCE_GOAL_AGENT_COMMAND_JSON }}
          SEQUENCE_GOAL_AGENT_MODEL: ${{ vars.SEQUENCE_GOAL_AGENT_MODEL || 'gpt-6-sol' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $controlledGitHubToken = $env:GH_TOKEN
          $controlledCoordinatorToken = $env:COORDINATOR_GH_TOKEN
          $gitAuthHeader = "AUTHORIZATION: basic $([Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$controlledGitHubToken")))"
          $coordinatorAuthHeader = "AUTHORIZATION: basic $([Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:COORDINATOR_GH_TOKEN)")))"
          $coordinatorRoot = (Resolve-Path 'coordinator').Path
          $targetRoot = (Resolve-Path 'target').Path
          try {
          git -C $coordinatorRoot config --local http.https://github.com/.extraheader $coordinatorAuthHeader
          git -C $targetRoot config --local http.https://github.com/.extraheader $gitAuthHeader
          $fullSafeRef = $env:COORDINATOR_REF -replace '[^A-Za-z0-9_.-]', '-'
          $safeRef = $fullSafeRef
          $safeRef = $safeRef.Substring(0, [Math]::Min($safeRef.Length, 160))
          $refHash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($env:COORDINATOR_REF))).Substring(0, 10).ToLowerInvariant()
          $branch = if ($env:DELIVERY_SURFACE -eq 'MobileIos') {
            "feat/sequence-goal-$($safeRef.ToLowerInvariant())-$refHash"
          } else {
            "sequence-goal/$safeRef-$($env:DELIVERY_SURFACE)-$refHash"
          }
          $derivedBranch = $branch
          $retryBranchPattern = '^(?:' + [regex]::Escape($derivedBranch) + ')-retry-\d+-\d+$'
          git -C $coordinatorRoot fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to refresh origin/main in the coordinator checkout.' }
          Push-Location $targetRoot
          try {
            . "$coordinatorRoot/scripts/sequence-goal-production-recovery.ps1"
            $productionOutcome = $null
            $productionState = $null
            $recoverPublication = $false
            $recoveryMode = 'Resume'
            $recoverPushedBranch = $false
            $resourceUsage = $null
            # Closed PRs are terminal history. Only an open PR can be reused by a fresh delivery attempt.
            $coordinatorIdentity = "Associated sequence-goal delivery for ``$($env:GITHUB_REPOSITORY)@$($env:COORDINATOR_REF)``."
            $surfaceIdentity = "- Surface: ``$($env:DELIVERY_SURFACE)``"
            $phaseIdentity = '- Phase: `Production`'
            $hasExactLine = { param([string]$Body, [string]$Value) [regex]::IsMatch($Body, '(?m)^' + [regex]::Escape($Value) + '\s*$') }
            $coordinatorOwnedPathPattern = '^(?:\.codex/agent-loop/|docs/sequence-diagrams(?:\.md$|/)|docs/behavior-harness\.md$)'
            $appSlug = $env:SEQUENCE_GOAL_GITHUB_APP_SLUG; $trustedAuthors = @('github-actions', 'github-actions[bot]'); if ($appSlug) { $trustedAuthors += @($appSlug, "${appSlug}[bot]", "app/$appSlug") }
            $existingJson = gh pr list --repo $env:DELIVERY_REPOSITORY --state open --limit 1000 --json number,url,state,isDraft,mergedAt,createdAt,headRefName,headRefOid,baseRefName,body,author,headRepository
            if ($LASTEXITCODE -ne 0) { throw 'Failed to discover existing associated delivery PRs.' }
            $openPullRequests = @($existingJson | ConvertFrom-Json)
            $candidates = @($openPullRequests | Where-Object {
              (($_.headRefName -in @($derivedBranch)) -or $_.headRefName -match $retryBranchPattern) -and
              (& $hasExactLine ([string]$_.body) $coordinatorIdentity)
            })
            $matching = @($candidates | Where-Object {
              (& $hasExactLine ([string]$_.body) $coordinatorIdentity) -and
              (& $hasExactLine ([string]$_.body) $surfaceIdentity) -and
              (& $hasExactLine ([string]$_.body) $phaseIdentity) -and
              $_.author.login -in $trustedAuthors -and
              $_.headRepository.nameWithOwner -eq $env:DELIVERY_REPOSITORY -and
              ($_.headRefName -in @($derivedBranch) -or $_.headRefName -match $retryBranchPattern) -and
              $_.baseRefName -eq $env:DELIVERY_BASE_BRANCH
            })
            if ($candidates.Count -ne $matching.Count) { throw "An open associated delivery PR for $coordinatorIdentity and $($env:DELIVERY_SURFACE) has conflicting or untrusted identity metadata." }
            $existing = @($matching | Where-Object state -eq 'OPEN')
            if ($existing.Count -gt 1) { throw "Multiple open associated PRs found for $coordinatorIdentity and $($env:DELIVERY_SURFACE) in $($env:DELIVERY_REPOSITORY)." }
            if ($existing.Count -eq 1) { $branch = [string]$existing[0].headRefName }
            $diagrams = @(git -C $coordinatorRoot diff --name-only origin/main...HEAD 2>$null | Where-Object { $_ -like 'docs/sequence-diagrams/*.md' -and $_ -notmatch '/_template' })
            if ($LASTEXITCODE -ne 0 -or $diagrams.Count -ne 1) { throw 'Expected exactly one coordinator sequence diagram.' }
            $script:GoalRoot = $coordinatorRoot
            $script:GoalBranch = $env:COORDINATOR_REF
            $script:GoalPath = $diagrams[0]
            $script:GoalSurface = $env:DELIVERY_SURFACE
            $goalDigest = Get-ProductionGoalDigest (Get-Content -LiteralPath (Join-Path $coordinatorRoot $diagrams[0]) -Raw)
            $goalIdentity = @($env:GITHUB_REPOSITORY, $env:COORDINATOR_REF, $env:DELIVERY_REPOSITORY, $env:DELIVERY_BASE_BRANCH, $env:DELIVERY_SURFACE, $goalDigest) -join "`n"
            $resumeProduction = $existing.Count -eq 1 -and -not (Test-ProductionReadiness -State (Read-DeliveryGoalState $env:GITHUB_REPOSITORY $env:COORDINATOR_REF $env:DELIVERY_SURFACE) -HeadSha $existing[0].headRefOid)
            if ($existing.Count -eq 0) {
              $orphanRefs = @(git ls-remote --heads origin "refs/heads/$derivedBranch" "refs/heads/$derivedBranch-retry-*")
              if ($LASTEXITCODE -ne 0 -or $orphanRefs.Count -gt 20) { throw 'Unable to bound unpublished production branch discovery.' }
              $recoverable = @()
              foreach ($orphanRef in $orphanRefs) {
                $orphanBranch = ($orphanRef -split '\s+')[1] -replace '^refs/heads/', ''
                $history = @(gh pr list --repo $env:DELIVERY_REPOSITORY --state all --head $orphanBranch --json number | ConvertFrom-Json)
                if ($LASTEXITCODE -ne 0) { throw 'Failed to check unpublished branch PR history.' }
                if ($history.Count -gt 0) { continue }
                git fetch origin "refs/heads/$orphanBranch"
                if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch unpublished production branch.' }
                git switch --detach FETCH_HEAD
                if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect unpublished production branch.' }
                $checkpoint = Read-ProductionGoalState -RepositoryRoot $targetRoot -Identity $goalIdentity
                if ($null -ne $checkpoint -and $checkpoint.branch -ceq $orphanBranch) {
                  $recoverable += [pscustomobject]@{ branch=$orphanBranch; head=(git rev-parse HEAD).Trim(); checkpoint=$checkpoint }
                }
              }
              if ($recoverable.Count -gt 1) { throw 'Multiple unpublished production branches found; reconcile before resuming.' }
              if ($recoverable.Count -eq 1) {
                $branch = $recoverable[0].branch
                git switch -c $branch $recoverable[0].head
                if ($LASTEXITCODE -ne 0) { throw 'Failed to recover unpublished production branch.' }
                $productionState = $recoverable[0].checkpoint
                $recoverPublication = (Get-ProductionRecoveryMode -State $productionState -HeadSha $recoverable[0].head) -eq 'Publish'
                $recoverPushedBranch = $true
              } else {
              git switch --detach "origin/$($env:DELIVERY_BASE_BRANCH)"
              if ($LASTEXITCODE -ne 0) { throw 'Failed to restore production base.' }
              $staleRemoteBranch = @(git ls-remote --heads origin "refs/heads/$branch")
              if ($LASTEXITCODE -ne 0) { throw "Failed to inspect the remote delivery branch '$branch'." }
              if ($staleRemoteBranch.Count -gt 1) { throw "Multiple remote refs unexpectedly matched delivery branch '$branch'." }
              if ($staleRemoteBranch.Count -eq 1) {
                $branch = "${branch}-retry-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
                git check-ref-format --branch $branch 2>$null | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "Collision-safe delivery branch '$branch' is invalid." }
                $retryRemoteBranch = @(git ls-remote --heads origin "refs/heads/$branch")
                if ($LASTEXITCODE -ne 0) { throw "Failed to inspect collision-safe delivery branch '$branch'." }
                if ($retryRemoteBranch.Count -ne 0) { throw "Collision-safe delivery branch '$branch' already exists; rerun with a new attempt." }
              }
              git switch -c $branch
              }
            } else {
              $pr = $existing[0]
              git fetch origin $branch
              if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch incomplete production branch.' }
              git switch -c $branch --track "origin/$branch"
              if ($LASTEXITCODE -ne 0) { throw 'Failed to resume incomplete production branch.' }
              $productionState = Read-ProductionGoalState -RepositoryRoot $targetRoot -Identity $goalIdentity
              $resourceUsage = $productionState.resourceUsage
              $remoteProductionHead = (git rev-parse HEAD).Trim()
              $recoveryMode = Get-ProductionRecoveryMode -State $productionState -HeadSha $remoteProductionHead -NeedsReadyTransition ($existing[0].isDraft -and $env:DELIVERY_SURFACE -ne 'MobileIos')
              $resumeProduction = $recoveryMode -eq 'Resume'
              $recoverPublication = $recoveryMode -eq 'Publish'
            }
            if ($existing.Count -eq 0 -or $resumeProduction -or $recoverPublication) {
              $diagrams = @(git -C $coordinatorRoot diff --name-only origin/main...HEAD 2>$null | Where-Object { $_ -like 'docs/sequence-diagrams/*.md' -and $_ -notmatch '/_template' })
              if ($LASTEXITCODE -ne 0) { throw 'Failed to identify the coordinator sequence diagram for new associated-PR delivery.' }
              if ($diagrams.Count -ne 1) { throw "Expected exactly one changed sequence diagram, found $($diagrams.Count)." }
              $registrationArguments = @{
                CoordinatorRepository = $env:GITHUB_REPOSITORY; CoordinatorBranch = $env:COORDINATOR_REF
                Repository = $env:DELIVERY_REPOSITORY; BaseBranch = $env:DELIVERY_BASE_BRANCH; Branch = $branch
                GoalIdentity = $goalIdentity; Phase = 'Production'; Surface = $env:DELIVERY_SURFACE; Agent = $env:DELIVERY_AGENT; DiagramPath = $diagrams[0]
              }
              if ($existing.Count -eq 1) { $registrationArguments.ExistingPr = $existing[0] }
              if ($recoverPushedBranch) { $registrationArguments.RecoverPushedBranch = $true }
              if (-not $recoverPublication) { $existing = @(& "$coordinatorRoot/scripts/register-sequence-goal-branch.ps1" @registrationArguments) }
              $existing = @($existing | Where-Object { $_.number -gt 0 })
              if ($recoverPublication) {
                $productionOutcome = $productionState.outcome
                $resourceUsage = $productionState.resourceUsage
                Write-Host 'Recovering pushed production checkpoint; generation and verification are not repeated.'
              } else {
              $headBeforeProductionAgent = (git rev-parse HEAD).Trim()
              $script:GoalProductionBranch = $branch
              $script:GoalProductionPr = [string]$existing[0].url
              $reservation = [pscustomobject]@{
                status='Incomplete'; summary='Implementation in progress; restart resumes the published branch.'
                acceptanceEvidence=@(); verification=@()
                remainingWork=@(if ($null -ne $productionState) { $productionState.outcome.remainingWork } else { 'Inspect the goal and published branch, then complete remaining acceptance criteria.' })
              }
              if ($reservation.remainingWork.Count -eq 0) { $reservation.remainingWork = @('Reverify the changed production branch against the goal.') }
              $null = Write-ProductionGoalState -RepositoryRoot $targetRoot -Identity $goalIdentity -Outcome $reservation -ResourceUsage @{} -Reserved
              $budgetEvidencePath = "$coordinatorRoot/TestResults/agent-resource/sequence-goal-loop-$($env:GITHUB_RUN_ID)-$($env:DELIVERY_SURFACE).budget.json"
              $productionOutcomePath = Join-Path $env:RUNNER_TEMP "production-outcome-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-$($env:DELIVERY_SURFACE).json"
              if (Test-Path -LiteralPath $productionOutcomePath) { throw 'Production outcome path already exists.' }
              Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
              Remove-Item Env:COORDINATOR_GH_TOKEN -ErrorAction SilentlyContinue
              git config --local --unset-all http.https://github.com/.extraheader 2>$null
              if ($LASTEXITCODE -notin @(0, 5)) { throw 'Failed to remove target-repository Git authentication.' }
              $global:LASTEXITCODE = 0
              git -C $coordinatorRoot config --local --unset-all http.https://github.com/.extraheader 2>$null
              if ($LASTEXITCODE -notin @(0, 5)) { throw 'Failed to remove coordinator Git authentication.' }
              $global:LASTEXITCODE = 0
              $githubOutputPath = $env:GITHUB_OUTPUT
              foreach ($commandEntryPath in @((Split-Path -Parent $githubOutputPath), $githubOutputPath)) {
                $commandEntry = Get-Item -LiteralPath $commandEntryPath -Force -ErrorAction SilentlyContinue
                if ($null -ne $commandEntry -and ($null -ne $commandEntry.LinkType -or ($commandEntry.Attributes -band [System.IO.FileAttributes]::ReparsePoint))) {
                  throw "Production GitHub Actions output path cannot be a symbolic link or reparse point: $commandEntryPath"
                }
              }
              'agent_executed=true' | Out-File -FilePath $githubOutputPath -Append
              $githubOutputHash = (Get-FileHash -LiteralPath $githubOutputPath -Algorithm SHA256).Hash
              $agentStartedPath = Join-Path $env:RUNNER_TEMP "sequence-goal-production-started-$($env:DELIVERY_SURFACE)"
              if (Test-Path -LiteralPath $agentStartedPath) { throw 'Production agent start marker already exists.' }
              Remove-Item Env:GITHUB_OUTPUT -ErrorAction Stop
              try {
                Set-Content -LiteralPath $agentStartedPath -Value 'agent-started' -Encoding UTF8
                & "$coordinatorRoot/scripts/run-sequence-goal-agent.ps1" `
                  -DiagramPath $diagrams[0] `
                  -BranchName $branch `
                  -DeliverySurface $env:DELIVERY_SURFACE `
                  -TargetRepositoryRoot $targetRoot `
                  -ProductionOutcomePath $productionOutcomePath `
                  -ProductionResumeContext $(if ($null -ne $productionState) { $productionState.outcome | ConvertTo-Json -Depth 12 } elseif ($resumeProduction) { [string]$existing[0].body } else { '' }) `
                  -UsagePath "$coordinatorRoot/TestResults/agent-resource/sequence-goal-loop-$($env:GITHUB_RUN_ID)-$($env:DELIVERY_SURFACE).jsonl" `
                  -BudgetEvidencePath $budgetEvidencePath
                $productionAgentExitCode = $LASTEXITCODE
              } finally {
                $env:GITHUB_OUTPUT = $githubOutputPath
              }
              $githubOutputItem = Get-Item -LiteralPath $githubOutputPath -Force -ErrorAction SilentlyContinue
              if ($null -eq $githubOutputItem -or $githubOutputItem.PSIsContainer -or $null -ne $githubOutputItem.LinkType -or ($githubOutputItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -or (Get-FileHash -LiteralPath $githubOutputPath -Algorithm SHA256).Hash -ne $githubOutputHash) {
                throw 'Production agent modified the GitHub Actions output command file.'
              }
              if ($productionAgentExitCode -ne 0) { throw "Production agent failed for surface '$($env:DELIVERY_SURFACE)'." }
              $productionOutcome = ConvertFrom-ProductionOutcome -Message (Get-Content -LiteralPath $productionOutcomePath -Raw)
              $resourceUsage = & "$coordinatorRoot/scripts/get-agent-resource-summary.ps1" -WorkflowId 'sequence-goal-loop' -BudgetEvidencePath $budgetEvidencePath | ConvertFrom-Json
              $changes = @(git status --porcelain)
              if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect production delivery changes.' }
              $headAfterProductionAgent = (git rev-parse HEAD).Trim()
              if ($LASTEXITCODE -ne 0) { throw 'Failed to capture the production delivery head after agent execution.' }
              if ($headAfterProductionAgent -ne $headBeforeProductionAgent) {
                throw 'Production agents must leave changes uncommitted so the workflow can validate the complete final tree.'
              }
              $agentCommitPaths = @(git diff --name-only --no-renames $headBeforeProductionAgent HEAD)
              if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect commits created during production agent execution.' }
              $baseBranchPaths = @(git diff --name-only --no-renames "origin/$($env:DELIVERY_BASE_BRANCH)...HEAD")
              if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect the production branch diff from its base.' }
              $workingTreePaths = @(git diff --name-only --no-renames HEAD)
              if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect tracked production worktree changes.' }
              $untrackedPaths = @(git ls-files --others --exclude-standard)
              if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect untracked production worktree changes.' }
              $changedPaths = @($baseBranchPaths; $agentCommitPaths; $workingTreePaths; $untrackedPaths) |
                ForEach-Object { ($_ -replace '\\', '/') } | Sort-Object -Unique
              if (@(@($workingTreePaths) + @($untrackedPaths) | Where-Object { $_ -match '^\.sequence-goal-delivery/' }).Count -gt 0) {
                throw 'Production agents cannot change workflow-owned delivery registration records.'
              }
              if ($changedPaths.Count -eq 0 -and -not $resumeProduction) { throw "Production produced no changes: $($productionOutcome.summary)" }
              $blockedProductionChanges = @($changedPaths | Where-Object {
                $_ -match '^(?:\.github/|\.githooks/|\.codex/(?:hooks|skills)/|scripts/)' -or
                $_ -match '(^|/)(?:local\.settings|appsettings)(?:\..*)?\.json$' -or
                $_ -match '(^|/)(?:serviceDependencies|PublishProfiles)/'
              })
              if ($blockedProductionChanges.Count -gt 0) {
                throw "Production agent changed blocked path(s): $($blockedProductionChanges -join ', ')"
              }
              $substantiveProductionChanges = @($changedPaths | Where-Object {
                $_ -notmatch '^\.sequence-goal-delivery/' -and
                $_ -notmatch '^\.codex/agent-loop/' -and $_ -notmatch '^TestResults/'
              })
              if ($substantiveProductionChanges.Count -eq 0 -and $productionOutcome.status -eq 'Complete') { throw 'Production agent produced no substantive target-repository changes.' }
              if ($env:DELIVERY_SURFACE -eq 'Backend') {
                $automationChanges = @($changedPaths | Where-Object { $_ -match '^VAA\.EAPI\.Automation/' })
                if ($automationChanges.Count -gt 0) {
                  throw "Backend production agent changed QA-owned automation paths: $($automationChanges -join ', ')"
                }
                $coordinatorChanges = @($changedPaths | Where-Object { $_ -match $coordinatorOwnedPathPattern })
                if ($coordinatorChanges.Count -gt 0) {
                  throw "Backend production agent changed coordinator-owned goal or evidence paths: $($coordinatorChanges -join ', ')"
                }
              }
              git config user.name 'github-actions[bot]'
              git config user.email 'github-actions[bot]@users.noreply.github.com'
              if ($env:DELIVERY_SURFACE -eq 'MobileIos') {
                git config core.hooksPath .githooks
                & ./.githooks/pre-push
                if ($LASTEXITCODE -ne 0) { throw 'Mobile iOS branch naming validation failed.' }
              }
              git add -A
              if ($LASTEXITCODE -ne 0) { throw 'Failed to stage generated production changes.' }
              git diff --cached --quiet
              $stagedProductionExitCode = $LASTEXITCODE
              $commitTitle = if ($env:DELIVERY_SURFACE -eq 'MobileIos') {
                'feat(sequence-goal): deliver mobile iOS changes'
              } else {
                "feat(sequence-goal): deliver $($env:DELIVERY_SURFACE) changes"
              }
              if ($stagedProductionExitCode -eq 1) {
                git commit -m $commitTitle
                if ($LASTEXITCODE -ne 0) { throw 'Failed to commit generated production changes.' }
              } elseif ($stagedProductionExitCode -eq 0 -and -not $resumeProduction -and $productionOutcome.status -eq 'Complete') {
                throw 'Remote production agent produced no committable target-repository changes.'
              } elseif ($stagedProductionExitCode -notin @(0, 1)) {
                throw "Failed to inspect staged production changes (git diff exit code $stagedProductionExitCode)."
              }
              git diff --quiet $headBeforeProductionAgent HEAD
              $finalProductionDiffExitCode = $LASTEXITCODE
              if ($finalProductionDiffExitCode -eq 0 -and -not $resumeProduction -and $productionOutcome.status -eq 'Complete') { throw 'Production agent changes cancel to an empty final tree.' }
              if ($finalProductionDiffExitCode -notin @(0, 1)) { throw "Failed to validate the final production tree (git diff exit code $finalProductionDiffExitCode)." }
              if ($productionOutcome.status -eq 'Complete' -and $env:DELIVERY_SURFACE -eq 'Backend') {
                # Resolve using the target repository, not the coordinator's documentation diff.
                $scopes = @(& ./scripts/resolve-verify-scopes.ps1 -Base "origin/$($env:DELIVERY_BASE_BRANCH)" -Head HEAD | ConvertFrom-Json)
                if ($LASTEXITCODE -ne 0 -or $scopes.Count -eq 0) { throw 'Failed to resolve mandatory production verification scopes.' }
                foreach ($scope in $scopes) {
                  $verifyArguments = @{ Base = "origin/$($env:DELIVERY_BASE_BRANCH)" }
                  $verifyArguments[[string]$scope.kind] = [string]$scope.path
                  if ($scope.kind -eq 'ScopePath') {
                    $verifyArguments.SkipBuild = $true
                    $verifyArguments.SkipDeploymentCheck = $true
                  }
                  $verificationPassed = $false
                  try {
                    & ./scripts/verify.ps1 @verifyArguments
                    $verificationPassed = $? -and $LASTEXITCODE -eq 0
                  } catch { Write-Warning $_.Exception.Message }
                  $productionOutcome.verification += [pscustomobject]@{
                    command = "scripts/verify.ps1 -$($scope.kind) $($scope.path) -Base origin/$($env:DELIVERY_BASE_BRANCH)$(if ($scope.kind -eq 'ScopePath') { ' -SkipBuild -SkipDeploymentCheck' })"
                    exitCode = $(if ($verificationPassed) { 0 } else { 1 })
                  }
                  if (-not $verificationPassed) {
                    $productionOutcome.status = 'Incomplete'
                    $productionOutcome.remainingWork = @("Required verification failed: $($scope.kind) $($scope.path)")
                    break
                  }
                }
              }
              $productionOutcome | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $productionOutcomePath -Encoding UTF8
              $env:GH_TOKEN = $controlledGitHubToken
              $env:COORDINATOR_GH_TOKEN = $controlledCoordinatorToken
              git config --local http.https://github.com/.extraheader $gitAuthHeader
              git push --set-upstream origin $branch
              if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the generated production branch.' }
              git -C $coordinatorRoot config --local http.https://github.com/.extraheader $coordinatorAuthHeader
              $productionState = Write-ProductionGoalState -RepositoryRoot $targetRoot -Identity $goalIdentity -Outcome $productionOutcome -ResourceUsage $resourceUsage
              }
              $diagramText = Get-Content -LiteralPath (Join-Path $coordinatorRoot $diagrams[0]) -Raw
              $goalMatch = [regex]::Match($diagramText, '(?im)^\|\s*Goal\s*\|(?<value>[^|]+)\|\s*$')
              $goalTitle = if ($goalMatch.Success) { $goalMatch.Groups['value'].Value.Trim().Trim('`') } else { [System.IO.Path]::GetFileNameWithoutExtension($diagrams[0]) }
              $deliveredFiles = @(git diff --name-only --no-renames "origin/$($env:DELIVERY_BASE_BRANCH)...HEAD" | Where-Object { $_ } | Select-Object -First 100)
              $deliveredFileList = if ($deliveredFiles.Count -gt 0) { @($deliveredFiles | ForEach-Object { "- ``$_``" }) } else { @('- No changed files detected.') }
              $body = @(
                "Associated sequence-goal delivery for ``$($env:GITHUB_REPOSITORY)@$($env:COORDINATOR_REF)``."
                ''
                '## Delivered outcome'
                ''
                $goalTitle
                ''
                '## Delivery ownership'
                ''
                "- Surface: ``$($env:DELIVERY_SURFACE)``"
                "- Agent: ``$($env:DELIVERY_AGENT)``"
                '- Phase: `Production`'
                "- Base branch: ``$($env:DELIVERY_BASE_BRANCH)``"
                ''
                '## Delivered files'
                ''
                $deliveredFileList
                ''
                '## Review scope'
                ''
                'Review only regressions introduced by this PR relative to its base branch that affect the stated delivery acceptance criteria.'
                ''
                'Treat as blocking only correctness, security, trust-boundary, data-loss, or lifecycle-integrity defects introduced or materially changed by this PR. Do not request unrelated hardening, architectural improvements, pre-existing fixes, stylistic changes, or speculative edge cases here; record those as follow-up work.'
                ''
                'When re-reviewing, verify the fixes made for existing findings. Do not restart an unrestricted whole-system redesign review.'
                ''
                '## Agent resources and cost'
                ''
                "- Surface: ``$($env:DELIVERY_SURFACE)``"
                "- Maximum budget: $($resourceUsage.maximumLabel)"
                "- Actual production-agent usage: $($resourceUsage.actualLabel)"
                "- Evidence: [coordinator workflow run](https://github.com/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID))"
              ) -join "`n"
              $titlePrefix = switch ($env:DELIVERY_SURFACE) {
                'MobileIos' { 'feat(ios)' }
                'MobileAndroid' { 'feat(android)' }
                'WebUi' { 'feat(web)' }
                default { 'feat(api)' }
              }
              $prTitle = "$titlePrefix`: $goalTitle"
              if ($prTitle.Length -gt 120) { $prTitle = "$($prTitle.Substring(0, 117).TrimEnd())..." }
              if ($existing.Count -eq 0) {
                [string[]]$draftArguments = @('--draft')
                $bodyPath = Join-Path $env:RUNNER_TEMP "production-pr-$($env:DELIVERY_SURFACE).md"
                Set-Content -LiteralPath $bodyPath -Value $body -Encoding UTF8
                gh pr create --repo $env:DELIVERY_REPOSITORY --base $env:DELIVERY_BASE_BRANCH --head $branch --title $prTitle --body-file $bodyPath @draftArguments | Out-Null
                if ($LASTEXITCODE -ne 0) { throw 'Failed to create the associated production delivery PR.' }
                $existing = @()
                $createdPrLookupAttempts = 6
                for ($createdPrLookupAttempt = 1; $createdPrLookupAttempt -le $createdPrLookupAttempts; $createdPrLookupAttempt++) {
                  $createdJson = gh pr list --repo $env:DELIVERY_REPOSITORY --state open --base $env:DELIVERY_BASE_BRANCH --head $branch --json number,url,state,mergedAt,headRefName,baseRefName,body,author,headRepository
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to resolve the created associated production delivery PR.' }
                  $existing = @($createdJson | ConvertFrom-Json | Where-Object {
                    $_.author.login -in $trustedAuthors -and
                    $_.headRepository.nameWithOwner -eq $env:DELIVERY_REPOSITORY -and
                    $_.headRefName -eq $branch -and
                    $_.baseRefName -eq $env:DELIVERY_BASE_BRANCH -and
                    (& $hasExactLine ([string]$_.body) $coordinatorIdentity) -and
                    (& $hasExactLine ([string]$_.body) $surfaceIdentity) -and
                    (& $hasExactLine ([string]$_.body) $phaseIdentity)
                  })
                  if ($existing.Count -gt 1) { break }
                  if ($existing.Count -eq 1) { break }
                  if ($createdPrLookupAttempt -lt $createdPrLookupAttempts) {
                    Write-Host "Created associated production PR is not queryable yet; retrying authenticated lookup ($createdPrLookupAttempt/$createdPrLookupAttempts)."
                    Start-Sleep -Seconds 2
                  }
                }
                if ($existing.Count -ne 1) { throw "Expected exactly one authenticated associated production PR after creation; found $($existing.Count)." }
              }
            } elseif ($existing[0].state -eq 'OPEN') {
              Write-Host "Reusing verified production head for PR #$($existing[0].number)."
            }
            $pr = $existing[0]
            if ($productionState -and $productionState.pullRequest -cne $pr.url) {
              $productionState.pullRequest = $pr.url
              Write-GoalTaskState -RepositoryRoot $coordinatorRoot -Branch $script:GoalBranch -DiagramPath $script:GoalPath -Task "$script:GoalSurface Production" -State $productionState
            }
            $publishedEvidence = [pscustomobject]@{
              surface = $env:DELIVERY_SURFACE; phase = 'Production'; coordinatorRepository = $env:GITHUB_REPOSITORY; coordinatorBranch = $env:COORDINATOR_REF
              agent = $env:DELIVERY_AGENT; repository = $env:DELIVERY_REPOSITORY; baseBranch = $env:DELIVERY_BASE_BRANCH
              headBranch = $branch; number = [int]$pr.number; url = [string]$pr.url; state = [string]$pr.state; resourceUsage = $resourceUsage
            }
            & "$coordinatorRoot/scripts/save-sequence-goal-delivery.ps1" -Evidence $publishedEvidence -DiagramPath $script:GoalPath
            if ($recoveryMode -ne 'Reuse' -and $pr.state -eq 'OPEN' -and $null -ne $resourceUsage) {
              $diagramText = Get-Content -LiteralPath (Join-Path $coordinatorRoot $diagrams[0]) -Raw
              $goalMatch = [regex]::Match($diagramText, '(?im)^\|\s*Goal\s*\|(?<value>[^|]+)\|\s*$')
              $goalTitle = if ($goalMatch.Success) { $goalMatch.Groups['value'].Value.Trim().Trim('`') } else { [System.IO.Path]::GetFileNameWithoutExtension($diagrams[0]) }
              $titlePrefix = switch ($env:DELIVERY_SURFACE) {
                'MobileIos' { 'feat(ios)' }
                'MobileAndroid' { 'feat(android)' }
                'WebUi' { 'feat(web)' }
                default { 'feat(api)' }
              }
              $deliveryTitle = "$titlePrefix`: $goalTitle"
              if ($deliveryTitle.Length -gt 120) { $deliveryTitle = "$($deliveryTitle.Substring(0, 117).TrimEnd())..." }
              $deliveredFiles = @(git diff --name-only --no-renames "origin/$($env:DELIVERY_BASE_BRANCH)...HEAD" | Where-Object { $_ } | Select-Object -First 100)
              $deliveredFileList = if ($deliveredFiles.Count -gt 0) { @($deliveredFiles | ForEach-Object { "- ``$_``" }) } else { @('- No changed files detected.') }
              $deliveryBody = @(
                "Associated sequence-goal delivery for ``$($env:GITHUB_REPOSITORY)@$($env:COORDINATOR_REF)``."
                ''
                '## Delivered outcome'
                ''
                $goalTitle
                ''
                '## Delivery ownership'
                ''
                "- Surface: ``$($env:DELIVERY_SURFACE)``"
                "- Agent: ``$($env:DELIVERY_AGENT)``"
                '- Phase: `Production`'
                "- Base branch: ``$($env:DELIVERY_BASE_BRANCH)``"
                ''
                '## Delivered files'
                ''
                $deliveredFileList
                ''
                '## Review scope'
                ''
                'Review only regressions introduced by this PR relative to its base branch that affect the stated delivery acceptance criteria.'
                ''
                'Treat as blocking only correctness, security, trust-boundary, data-loss, or lifecycle-integrity defects introduced or materially changed by this PR. Do not request unrelated hardening, architectural improvements, pre-existing fixes, stylistic changes, or speculative edge cases here; record those as follow-up work.'
                ''
                'When re-reviewing, verify the fixes made for existing findings. Do not restart an unrestricted whole-system redesign review.'
                ''
                '## Agent resources and cost'
                ''
                "- Maximum budget: $($resourceUsage.maximumLabel)"
                "- Actual production-agent usage: $($resourceUsage.actualLabel)"
                "- Evidence: [coordinator workflow run](https://github.com/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID))"
              ) -join "`n"
              $productionHead = (git rev-parse HEAD).Trim()
              $readProductionRemoteHead = {
                $refs = @(git ls-remote --heads origin "refs/heads/$branch")
                if ($LASTEXITCODE -ne 0 -or $refs.Count -ne 1) { throw 'Cannot establish authoritative production branch head.' }
                ($refs[0] -split '\s+')[0]
              }
              $livePr = Wait-ProductionHead -ExpectedHead $productionHead -ReadRemoteHead $readProductionRemoteHead -ReadPullRequest {
                $snapshot = gh pr view $pr.number --repo $env:DELIVERY_REPOSITORY --json state,isDraft,body,headRefName,headRefOid,baseRefName,headRepository,author | ConvertFrom-Json
                if ($LASTEXITCODE -ne 0) { throw 'Failed to refresh production PR metadata.' }
                $snapshot
              }
              $liveCurrentMetadata = (& $hasExactLine ([string]$livePr.body) $coordinatorIdentity) -and (& $hasExactLine ([string]$livePr.body) $surfaceIdentity) -and (& $hasExactLine ([string]$livePr.body) $phaseIdentity)
              if ($LASTEXITCODE -ne 0 -or $livePr.state -ne 'OPEN' -or $livePr.headRefName -ne $branch -or $livePr.baseRefName -ne $env:DELIVERY_BASE_BRANCH -or $livePr.headRepository.nameWithOwner -ne $env:DELIVERY_REPOSITORY -or $livePr.author.login -notin $trustedAuthors -or -not $liveCurrentMetadata) { throw "Associated PR #$($pr.number) changed identity before its metadata update." }
              $inferentialMatch = [regex]::Match([string]$livePr.body, '(?ims)(?:^|\n)## Inferential review[^\n]*\n.*?(?=\n## |\z)')
              if ($inferentialMatch.Success) { $deliveryBody = "$($deliveryBody.TrimEnd())`n`n$($inferentialMatch.Value.Trim())`n" }
              $deliveryBody += "`n`n## Production readiness`n`n$($productionOutcome.status): $($productionOutcome.summary)`n"
              $deliveryBody += (@($productionOutcome.remainingWork) | ForEach-Object { "`n- $_" }) -join ''
              $deliveryBody += "`n`nAcceptance evidence:`n" + (($productionOutcome.acceptanceEvidence | ForEach-Object { "- $_" }) -join "`n")
              $deliveryBody += "`n`nVerification:`n" + (($productionOutcome.verification | ForEach-Object { "- $($_.command): exit $($_.exitCode)" }) -join "`n")
              $bodyPath = Join-Path $env:RUNNER_TEMP "production-pr-$($env:DELIVERY_SURFACE).md"
              Set-Content -LiteralPath $bodyPath -Value $deliveryBody -Encoding UTF8
              Assert-ProductionRemoteHead -ExpectedHead $productionHead -ReadRemoteHead $readProductionRemoteHead
              gh pr edit $pr.number --repo $env:DELIVERY_REPOSITORY --title $deliveryTitle --body-file $bodyPath
              if ($LASTEXITCODE -ne 0) { throw "Failed to update associated PR #$($pr.number) delivery metadata." }
              if ($productionOutcome.status -ne 'Complete') {
                if (-not $livePr.isDraft) {
                gh pr ready $pr.number --undo --repo $env:DELIVERY_REPOSITORY
                if ($LASTEXITCODE -ne 0) { throw 'Failed to retain incomplete production as draft.' }
                }
                Write-Host "Production $($productionOutcome.status): $($productionOutcome.summary). Progress saved in the goal document; the monitor resumes Incomplete work within the continuation limit. Blocked work requires intervention. QA was not dispatched."
                if ($env:GITHUB_STEP_SUMMARY) { "### Production $($productionOutcome.status)`n$($productionOutcome.summary)`nSee the goal document for remaining work and automatic continuation status. QA has not started for this surface." | Out-File $env:GITHUB_STEP_SUMMARY -Append }
                return
              }
              if ($env:DELIVERY_SURFACE -ne 'MobileIos' -and $livePr.isDraft) {
                gh pr ready $pr.number --repo $env:DELIVERY_REPOSITORY
                if ($LASTEXITCODE -ne 0) { throw 'Failed to mark verified production PR ready.' }
              }
            }
            if ($recoveryMode -eq 'Reuse') {
              $readReuseHead = {
                $refs = @(git ls-remote --heads origin "refs/heads/$branch")
                if ($LASTEXITCODE -ne 0 -or $refs.Count -ne 1) { throw 'Cannot establish production head before reuse.' }
                ($refs[0] -split '\s+')[0]
              }
              $pr = Wait-ProductionHead -ExpectedHead $remoteProductionHead -ReadRemoteHead $readReuseHead -ReadPullRequest {
                $snapshot = gh pr view $pr.number --repo $env:DELIVERY_REPOSITORY --json number,url,state,mergedAt,isDraft,body,headRefName,headRefOid,baseRefName,headRepository,author | ConvertFrom-Json
                if ($LASTEXITCODE -ne 0) { throw 'Cannot refresh production PR before reuse.' }
                $snapshot
              }
              $currentIdentity = (& $hasExactLine ([string]$pr.body) $coordinatorIdentity) -and (& $hasExactLine ([string]$pr.body) $surfaceIdentity) -and (& $hasExactLine ([string]$pr.body) $phaseIdentity)
              if ($pr.state -ne 'OPEN' -or $pr.headRefName -ne $branch -or $pr.baseRefName -ne $env:DELIVERY_BASE_BRANCH -or $pr.headRepository.nameWithOwner -ne $env:DELIVERY_REPOSITORY -or $pr.author.login -notin $trustedAuthors -or -not $currentIdentity -or
                  (Get-ProductionRecoveryMode -State $productionState -HeadSha $remoteProductionHead -NeedsReadyTransition ($pr.isDraft -and $env:DELIVERY_SURFACE -ne 'MobileIos')) -ne 'Reuse') { throw 'Production PR changed before checkpoint reuse; reconcile on restart.' }
              Assert-ProductionRemoteHead -ExpectedHead $remoteProductionHead -ReadRemoteHead $readReuseHead
            }
            $readyHead = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or -not (Test-ProductionReadiness -State (Read-DeliveryGoalState $env:GITHUB_REPOSITORY $env:COORDINATOR_REF $env:DELIVERY_SURFACE) -HeadSha $readyHead)) {
              throw 'Production or goal requirements changed before QA dispatch; reverify on restart.'
            }
            'production_ready=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            $evidenceDir = Join-Path $coordinatorRoot 'TestResults/associated-prs'
            New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
            [ordered]@{
              surface = $env:DELIVERY_SURFACE; phase = 'Production'; coordinatorRepository = $env:GITHUB_REPOSITORY; coordinatorBranch = $env:GITHUB_REF_NAME; agent = $env:DELIVERY_AGENT; repository = $env:DELIVERY_REPOSITORY; baseBranch = $env:DELIVERY_BASE_BRANCH
              headBranch = $branch; number = [int]$pr.number; url = [string]$pr.url
              state = $(if ($pr.mergedAt) { 'Merged' } else { [string]$pr.state }); mergedAt = [string]$pr.mergedAt
              resourceUsage = $resourceUsage
            } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidenceDir "$($env:DELIVERY_SURFACE).json") -Encoding UTF8
          } finally { Pop-Location }
          } finally {
            $cleanupErrors = @()
            git -C $targetRoot config --local --unset-all http.https://github.com/.extraheader 2>$null
            if ($LASTEXITCODE -notin @(0, 5)) { $cleanupErrors += "target repository (exit $LASTEXITCODE)" }
            git -C $coordinatorRoot config --local --unset-all http.https://github.com/.extraheader 2>$null
            if ($LASTEXITCODE -notin @(0, 5)) { $cleanupErrors += "coordinator repository (exit $LASTEXITCODE)" }
            $global:LASTEXITCODE = 0
            if ($cleanupErrors.Count -gt 0) { throw "Failed to remove Git authentication from: $($cleanupErrors -join ', ')." }
          }

      - name: Stage production execution evidence
        if: always()
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'sequence-goal-production-attempt'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          New-Item -ItemType Directory -Force -Path 'coordinator/TestResults/agent-resource' | Out-Null
          $agentExecuted = Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'sequence-goal-production-started-${{ matrix.surface }}') -PathType Leaf
          [ordered]@{ surface = '${{ matrix.surface }}'; agentExecuted = $agentExecuted } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory '${{ matrix.surface }}.json') -Encoding UTF8
          if ($agentExecuted) {
            Set-Content -LiteralPath "coordinator/TestResults/agent-resource/sequence-goal-loop-${{ github.run_id }}-${{ matrix.surface }}.executed" -Value 'agent-executed' -Encoding UTF8
          }

      - name: Upload production attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-agent-attempt-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: ${{ runner.temp }}/sequence-goal-production-attempt/${{ matrix.surface }}.json
          if-no-files-found: error

      - name: Upload associated PR evidence
        if: steps.production_delivery.outputs.production_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: associated-pr-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: coordinator/TestResults/associated-prs/${{ matrix.surface }}.json
          if-no-files-found: error

      - name: Record production PR and dispatch matching QA
        if: steps.production_delivery.outputs.production_ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COORDINATOR_GH_TOKEN: ${{ steps.coordinator-token.outputs.token }}
          SEQUENCE_GOAL_GITHUB_APP_SLUG: ${{ vars.SEQUENCE_GOAL_GITHUB_APP_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkpoint = Get-Content -LiteralPath 'coordinator/TestResults/associated-prs/${{ matrix.surface }}.json' -Raw | ConvertFrom-Json
          ./coordinator/scripts/save-sequence-goal-delivery.ps1 -Evidence $checkpoint
          ./coordinator/scripts/dispatch-sequence-goal-qa.ps1 -Repository '${{ github.repository }}' -CoordinatorBranch $env:GITHUB_REF_NAME -Surface '${{ matrix.surface }}' -ProductionRepository $checkpoint.repository -ProductionNumber $checkpoint.number

      - name: Upload remote production-agent resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-agent-resource-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            coordinator/TestResults/agent-resource/sequence-goal-loop-${{ github.run_id }}-${{ matrix.surface }}.jsonl
            coordinator/TestResults/agent-resource/sequence-goal-loop-${{ github.run_id }}-${{ matrix.surface }}.budget.json
            coordinator/TestResults/agent-resource/sequence-goal-loop-${{ github.run_id }}-${{ matrix.surface }}.executed
            ${{ runner.temp }}/production-outcome-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.surface }}.json
          if-no-files-found: ignore

      - name: Upload remote production-agent command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-agent-command-logs-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: target/TestResults/agent-command-logs/
          if-no-files-found: ignore

  dispatch-missing-qa:
    name: Recover ${{ matrix.surface }} QA continuation
    needs: [resolve-delivery-agents, run-sequence-loop, open-coordinator-pr, deliver-cross-repository-production]
    if: always() && needs.resolve-delivery-agents.result == 'success' && needs.run-sequence-loop.result == 'success' && needs.open-coordinator-pr.result == 'success' && needs.resolve-delivery-agents.outputs.has_inprogress == 'true' && needs.resolve-delivery-agents.outputs.remote_count == '0' && needs.resolve-delivery-agents.outputs.qa_count != '0' && needs.deliver-cross-repository-production.result == 'skipped'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-delivery-agents.outputs.qa_matrix) }}
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve recovery repository
        id: recovery-repository
        shell: pwsh
        env:
          DELIVERY_REPOSITORY: ${{ matrix.repository }}
        run: |
          "name=$($env:DELIVERY_REPOSITORY.Split('/')[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create coordinator GitHub App token
        id: app-token
        if: env.APP_ID != '' && env.APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          private-key: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            ${{ steps.recovery-repository.outputs.name }}

      - name: Dispatch missing QA surface
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          SEQUENCE_GOAL_GITHUB_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DELIVERY_REPOSITORY: ${{ matrix.repository }}
          DELIVERY_BASE_BRANCH: ${{ matrix.base_branch }}
          DELIVERY_SURFACE: ${{ matrix.surface }}
        run: |
          $ErrorActionPreference = 'Stop'
          $diagrams = @(git diff --name-only origin/main...HEAD | Where-Object { $_ -like 'docs/sequence-diagrams/*.md' -and $_ -notmatch '/_template' })
          if ($LASTEXITCODE -ne 0 -or $diagrams.Count -ne 1) { throw 'Expected one coordinator diagram for QA recovery.' }
          $diagramText = Get-Content -LiteralPath $diagrams[0] -Raw
          $associatedSection = [regex]::Match($diagramText, '(?ims)^## Associated delivery pull requests\s*(?<body>.*?)(?=^## |\z)').Groups['body'].Value
          $productionRowPattern = '(?im)^\|\s*``?' + [regex]::Escape($env:DELIVERY_SURFACE) + '``?\s*\|\s*``?(?<repository>[^`]+)``?\s*\|\s*``?(?<base>[^`]+)``?\s*\|\s*``?(?<head>[^`]+)``?\s*\|\s*\[#(?<number>\d+)\]\((?<url>[^)]+)\)\s*\|'
          $productionRows = @([regex]::Matches($associatedSection, $productionRowPattern))
          if ($productionRows.Count -ne 1 -or $productionRows[0].Groups['repository'].Value -cne $env:DELIVERY_REPOSITORY -or $productionRows[0].Groups['base'].Value -cne $env:DELIVERY_BASE_BRANCH) { throw 'QA recovery requires one production ledger row matching the configured target.' }
          ./scripts/dispatch-sequence-goal-qa.ps1 -Repository $env:GITHUB_REPOSITORY -CoordinatorBranch $env:GITHUB_REF_NAME -Surface $env:DELIVERY_SURFACE -ProductionRepository $env:DELIVERY_REPOSITORY -ProductionNumber ([int]$productionRows[0].Groups['number'].Value)


  retain-agent-resource-evidence:
    name: Retain delivery attempt resource evidence
    needs: [resolve-delivery-agents, open-coordinator-pr, deliver-cross-repository-production]
    if: always() && needs.open-coordinator-pr.result == 'success'
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create coordinator GitHub App token
        id: app-token
        if: env.APP_ID != '' && env.APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          private-key: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out coordinator workflow scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Download production attempt evidence
        if: needs.deliver-cross-repository-production.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: production-agent-attempt-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sequence-goal-production-attempt
          merge-multiple: true

      - name: Resolve production resource expectation
        id: production_resource_expectation
        if: needs.deliver-cross-repository-production.result != 'skipped'
        shell: pwsh
        run: |
          $attempts = @(Get-ChildItem -LiteralPath '${{ runner.temp }}/sequence-goal-production-attempt' -Filter '*.json' -File | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json })
          $expectedCount = [int]'${{ needs.resolve-delivery-agents.outputs.remote_count }}'
          $attemptSurfaces = @($attempts | ForEach-Object { [string]$_.surface } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Sort-Object -Unique)
          if ($attempts.Count -ne $expectedCount -or $attemptSurfaces.Count -ne $expectedCount) { throw "Production attempt evidence is incomplete: expected $expectedCount unique surfaces, found $($attemptSurfaces.Count)." }
          "expect_budget=$(@($attempts | Where-Object agentExecuted).Count -gt 0)".ToLowerInvariant() | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Record attempt cost in goal document
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          ./scripts/save-sequence-goal-resources.ps1 -Branch $env:GITHUB_REF_NAME -RunId '${{ github.run_id }}' -Attempt '${{ github.run_attempt }}' -ExpectBudget:('${{ steps.production_resource_expectation.outputs.expect_budget || 'false' }}' -eq 'true')


  complete-goal:
    name: sl-seb-ai
    needs: [resolve-delivery-agents, run-sequence-loop, open-coordinator-pr, deliver-cross-repository-production, retain-agent-resource-evidence]
    if: always() && needs.resolve-delivery-agents.result == 'success' && needs.run-sequence-loop.result == 'success' && needs.run-sequence-loop.outputs.has_inprogress == 'true' && (github.event_name == 'workflow_dispatch' && inputs.smoke_test == true || needs.open-coordinator-pr.result == 'success') && (needs.deliver-cross-repository-production.result == 'success' || (needs.deliver-cross-repository-production.result == 'skipped' && needs.resolve-delivery-agents.outputs.remote_count == '0')) && needs.resolve-delivery-agents.outputs.qa_count == '0' && (github.event_name == 'workflow_dispatch' && inputs.smoke_test == true || needs.retain-agent-resource-evidence.result == 'success')
    concurrency:
      group: sequence-goal-ledger-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SEQUENCE_GOAL_DELIVERY_JOB_TIMEOUT_MINUTES || '55') }}
    env:
      SEQUENCE_GOAL_MAX_CHANGED_FILES: ${{ vars.SEQUENCE_GOAL_MAX_CHANGED_FILES || '200' }}
      SEQUENCE_GOAL_AGENT_TIMEOUT_MINUTES: ${{ vars.SEQUENCE_GOAL_AGENT_TIMEOUT_MINUTES || '40' }}
      SEQUENCE_GOAL_VERIFY_TIMEOUT_MINUTES: ${{ vars.SEQUENCE_GOAL_VERIFY_TIMEOUT_MINUTES || '20' }}
    steps:
      - name: Detect sequence-goal GitHub App credentials
        id: app-credentials
        shell: pwsh
        env:
          APP_ID: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
        run: |
          "configured=$(((-not [string]::IsNullOrWhiteSpace($env:APP_ID)) -and (-not [string]::IsNullOrWhiteSpace($env:APP_PRIVATE_KEY))).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create sequence-goal GitHub App token
        id: app-token
        if: steps.app-credentials.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        env:
          APP_ID: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}

      - name: Create cross-repository status token
        id: cross-repo-token
        if: contains(needs.resolve-delivery-agents.outputs.delivery_surfaces, 'MobileIos') || contains(needs.resolve-delivery-agents.outputs.delivery_surfaces, 'MobileAndroid') || contains(needs.resolve-delivery-agents.outputs.delivery_surfaces, 'WebUi')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_ID }}
          private-key: ${{ secrets.SEQUENCE_GOAL_GITHUB_APP_PRIVATE_KEY }}
          owner: VAAD1ST

      - name: Check out generated implementation and tests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Fetch active delivery refs
        shell: pwsh
        run: |
          $branchRef = "+refs/heads/$($env:GITHUB_REF_NAME):refs/remotes/origin/$($env:GITHUB_REF_NAME)"
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main $branchRef

      - name: Restore production-job context
        id: detect
        shell: pwsh
        run: |
          "has_diagrams=${{ needs.run-sequence-loop.result == 'success' && needs.run-sequence-loop.outputs.has_diagrams || needs.resolve-delivery-agents.outputs.has_diagrams }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "has_index=${{ needs.run-sequence-loop.result == 'success' && needs.run-sequence-loop.outputs.has_index || needs.resolve-delivery-agents.outputs.has_index }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore InProgress goal context
        id: inprogress
        shell: pwsh
        env:
          HAS_INPROGRESS: ${{ needs.run-sequence-loop.result == 'success' && needs.run-sequence-loop.outputs.has_inprogress || needs.resolve-delivery-agents.outputs.has_inprogress }}
          INPROGRESS_LIST: ${{ needs.run-sequence-loop.result == 'success' && needs.run-sequence-loop.outputs.inprogress_list || needs.resolve-delivery-agents.outputs.inprogress_list }}
        run: |
          "has_inprogress=$env:HAS_INPROGRESS" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "inprogress_list=$env:INPROGRESS_LIST" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Read coordinator state from goal document
        id: evidence
        shell: pwsh
        env:
          INPROGRESS_LIST: ${{ steps.inprogress.outputs.inprogress_list }}
        run: |
          . ./scripts/sequence-goal-document-state.ps1
          $diagrams = @($env:INPROGRESS_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries))
          if ($diagrams.Count -ne 1) { throw 'Expected one coordinator goal document.' }
          $state = Get-GoalCoordinatorState $diagrams[0]
          if (-not $state -or $state.branch -cne $env:GITHUB_REF_NAME -or $state.repository -cne $env:GITHUB_REPOSITORY) { throw 'Goal document does not belong to this coordinator.' }
          "goal_document=$($diagrams[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download production-agent resource evidence
        if: steps.inprogress.outputs.has_inprogress == 'true' && (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: production-agent-resource-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/agent-resource/
          merge-multiple: true

      - name: Download automation-agent resource evidence
        if: steps.inprogress.outputs.has_inprogress == 'true' && (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: automation-agent-resource-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: TestResults/agent-resource/

      - name: Set up Node for verification remediation
        if: steps.inprogress.outputs.has_inprogress == 'true' && (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI for verification remediation
        if: steps.inprogress.outputs.has_inprogress == 'true' && (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true)
        shell: pwsh
        run: |
          npm install -g @openai/codex@0.146.0
          codex --version

      - name: Run loop verification
        id: verify
        if: (steps.detect.outputs.has_diagrams == 'true' || steps.detect.outputs.has_index == 'true') && (steps.inprogress.outputs.has_inprogress != 'true' || (github.event_name == 'workflow_dispatch' && inputs.smoke_test == true) || needs.resolve-delivery-agents.outputs.qa_count == '0')
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(vars.SEQUENCE_GOAL_VERIFY_TIMEOUT_MINUTES || '20') }}
        shell: pwsh
        env:
          INPROGRESS_LIST: ${{ steps.inprogress.outputs.inprogress_list }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/sequence-goal-document-state.ps1
          $goalDocumentPath = '${{ steps.evidence.outputs.goal_document }}'
          $scopesJson = & ./scripts/resolve-verify-scopes.ps1 -Base origin/main -Head HEAD
          $scopes = @($scopesJson | ConvertFrom-Json)
          if ($scopes.Count -eq 0) {
            $scopes = @([PSCustomObject]@{ kind = 'ScopePath'; path = '.' })
          }

          $requiresFullVerification = $false
          if (-not [string]::IsNullOrWhiteSpace($goalDocumentPath) -and (Test-Path -LiteralPath $goalDocumentPath -PathType Leaf)) {
            $summary = Get-GoalCoordinatorState $goalDocumentPath
            $requiresFullVerification = @($summary.goals | Where-Object { $_.verificationMode -eq 'Full' }).Count -gt 0
          }

          $buildScopes = @($scopes | Where-Object { $_.kind -in @('SolutionPath', 'ProjectPath') })
          if ($requiresFullVerification -and $buildScopes.Count -eq 0) {
            throw 'Full promotion verification requires at least one resolved solution or project scope.'
          }

          $results = @()
          $failed = @()
          function Test-EvidencePathUnderRoot {
            param(
              [Parameter(Mandatory)][string]$RelativePath,
              [Parameter(Mandatory)][string[]]$AllowedRoots
            )

            if ([System.IO.Path]::IsPathRooted($RelativePath)) { return $false }
            $candidate = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $RelativePath))
            foreach ($allowedRoot in $AllowedRoots) {
              $resolvedRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $allowedRoot)).TrimEnd(
                [System.IO.Path]::DirectorySeparatorChar,
                [System.IO.Path]::AltDirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
              if ($candidate.StartsWith($resolvedRoot, [System.StringComparison]::OrdinalIgnoreCase) -and
                  (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                return $true
              }
            }
            return $false
          }
          $mermaidExitCode = 0
          try {
            & ./scripts/check-mermaid-diagrams.ps1 -BaseRef origin/main
          } catch {
            $mermaidExitCode = 1
            Write-Warning $_.Exception.Message
          }
          $results += [PSCustomObject]@{ kind = 'MermaidRender'; path = 'changed Markdown'; mode = 'Render'; command = './scripts/check-mermaid-diagrams.ps1 -BaseRef origin/main'; result = $(if ($mermaidExitCode -eq 0) { 'pass' } else { 'fail' }); exitCode = $mermaidExitCode }
          if ($mermaidExitCode -ne 0) { $failed += './scripts/check-mermaid-diagrams.ps1 -BaseRef origin/main' }
          foreach ($scope in $scopes) {
            $kind = [string]$scope.kind
            $path = [string]$scope.path
            if ($kind -eq 'ScopePath') {
              if ($requiresFullVerification) {
                Write-Host "Skipping repository fallback scope '$path' because resolved project or solution scopes provide Full verification."
                $results += [PSCustomObject]@{ kind = $kind; path = $path; mode = 'CoveredByFullScope'; command = ''; result = 'skipped'; exitCode = 0 }
                continue
              }

              $mode = 'Fast'
              $command = "./scripts/verify.ps1 -ScopePath '$path' -SkipBuild -SkipDeploymentCheck"
              & ./scripts/verify.ps1 -ScopePath $path -SkipBuild -SkipDeploymentCheck
            } elseif ($kind -eq 'SolutionPath') {
              if ($requiresFullVerification) {
                $mode = 'Full'
                $command = "./scripts/verify.ps1 -SolutionPath '$path'"
                & ./scripts/verify.ps1 -SolutionPath $path
              } else {
                $mode = 'Fast'
                $command = "./scripts/verify.ps1 -SolutionPath '$path' -SkipBuild"
                & ./scripts/verify.ps1 -SolutionPath $path -SkipBuild
              }
            } elseif ($kind -eq 'ProjectPath') {
              if ($requiresFullVerification) {
                $mode = 'Full'
                $command = "./scripts/verify.ps1 -ProjectPath '$path'"
                & ./scripts/verify.ps1 -ProjectPath $path
              } else {
                $mode = 'Fast'
                $command = "./scripts/verify.ps1 -ProjectPath '$path' -SkipBuild"
                & ./scripts/verify.ps1 -ProjectPath $path -SkipBuild
              }
            } else {
              throw "Unknown verify scope kind '$kind'."
            }

            $exitCode = $LASTEXITCODE
            $result = if ($exitCode -eq 0) { 'pass' } else { 'fail' }
            $results += [PSCustomObject]@{
              kind = $kind
              path = $path
              mode = $mode
              command = $command
              result = $result
              exitCode = $exitCode
            }

            if ($exitCode -ne 0) {
              $failed += $command
            }
          }

          $acceptanceFailures = @()
          $openQuestions = @()
          $diagrams = $env:INPROGRESS_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
          foreach ($diagram in $diagrams) {
            if ([string]::IsNullOrWhiteSpace($diagram) -or -not (Test-Path -LiteralPath $diagram -PathType Leaf)) {
              continue
            }

            $text = Get-Content -LiteralPath $diagram -Raw
            $acceptanceMatch = [regex]::Match($text, '(?im)^\|\s*Acceptance evidence\s*\|\s*(?<value>.+?)\s*\|\s*$')
            if (-not $acceptanceMatch.Success -or $acceptanceMatch.Groups['value'].Value -match '(?i)<[^>]+>|planned|tbd|todo|none|n/a') {
              $acceptanceFailures += "$diagram must provide concrete Agent Loop Goal Acceptance evidence."
            }

            $doneWhenMatch = [regex]::Match($text, '(?im)^\|\s*Done when\s*\|\s*(?<value>.+?)\s*\|\s*$')
            if (-not $doneWhenMatch.Success -or $doneWhenMatch.Groups['value'].Value -match '(?i)<[^>]+>|planned|tbd|todo') {
              $acceptanceFailures += "$diagram must provide a concrete Done when condition."
            }

            $expectedHarness = [regex]::Match($text, '(?is)## Expected harness\s*(?<body>.*?)(?:\r?\n## |\z)')
            if (-not $expectedHarness.Success -or $expectedHarness.Groups['body'].Value -notmatch '(?m)^\s*-\s+`?[^<\r\n]+`?\s*$') {
              $acceptanceFailures += "$diagram must list at least one concrete Expected harness item."
            }

            $suppliedUxField = [regex]::Match($text, '(?im)^\|\s*Supplied UX\s*\|\s*`?(?<value>[^|`]+)`?\s*\|\s*$')
            if ($suppliedUxField.Success -and $suppliedUxField.Groups['value'].Value.Trim() -match '(?i)^not applicable$') {
              $acceptanceFailures += "$diagram has invalid Supplied UX evidence. Use None only when no UX artefact was supplied."
            }
            $hasSuppliedUx = [regex]::IsMatch(
              $text,
              '(?im)(?:https?://[^\s|)]*|(?:\.{0,2}/)?[^\s|()]+)\.(?:png|jpe?g|webp|gif|svg|pdf|mp4|mov|webm)(?:[?#][^\s|)]*)?|https?://[^\s)]*(?:figma\.com|invisionapp\.com|sketch\.cloud|adobe\.com/(?:xd|products/xd)|marvelapp\.com|proto\.io|framer\.com)/'
            ) -or ($suppliedUxField.Success -and $suppliedUxField.Groups['value'].Value.Trim() -notmatch '(?i)^(?:none|n/a)$')
            if ($hasSuppliedUx) {
              $uxContract = [regex]::Match($text, '(?is)## UX contract\s*(?<body>.*?)(?:\r?\n## |\z)')
              $visualVerification = if ($uxContract.Success) {
                [regex]::Match($uxContract.Groups['body'].Value, '(?im)^\|\s*Visual verification\s*\|\s*(?<value>.*?)\s*\|\s*$')
              } else { $null }
              $screenStateMapping = if ($uxContract.Success) {
                [regex]::Match($uxContract.Groups['body'].Value, '(?im)^\|\s*Screen/state mapping\s*\|\s*(?<value>.*?)\s*\|\s*$')
              } else { $null }
              $designInspectionMatrix = if ($uxContract.Success) {
                [regex]::Match($uxContract.Groups['body'].Value, '(?im)^\|\s*Design inspection matrix\s*\|\s*(?<value>.*?)\s*\|\s*$')
              } else { $null }
              $uiAcceptanceTest = if ($uxContract.Success) {
                [regex]::Match($uxContract.Groups['body'].Value, '(?im)^\|\s*UI/UX acceptance test\s*\|\s*(?<value>.*?)\s*\|\s*$')
              } else { $null }
              $renderedEvidence = if ($uxContract.Success) {
                [regex]::Match($uxContract.Groups['body'].Value, '(?im)^\|\s*Rendered evidence\s*\|\s*(?<value>.*?)\s*\|\s*$')
              } else { $null }
              $comparisonResult = if ($uxContract.Success) {
                [regex]::Match($uxContract.Groups['body'].Value, '(?im)^\|\s*Comparison result\s*\|\s*(?<value>.*?)\s*\|\s*$')
              } else { $null }
              if ($null -eq $screenStateMapping -or -not $screenStateMapping.Success -or
                  [string]::IsNullOrWhiteSpace($screenStateMapping.Groups['value'].Value) -or
                  $screenStateMapping.Groups['value'].Value -match '(?i)<[^>]+>|^\s*`?(?:planned|tbd|todo|none|not applicable|n/a)\b') {
                $acceptanceFailures += "$diagram supplies UX but has no completed screen/state mapping evidence."
              }
              if ($null -eq $designInspectionMatrix -or -not $designInspectionMatrix.Success -or
                  [string]::IsNullOrWhiteSpace($designInspectionMatrix.Groups['value'].Value) -or
                  $designInspectionMatrix.Groups['value'].Value -match '(?i)<[^>]+>|^\s*`?(?:planned|tbd|todo|none|not applicable|n/a)\b') {
                $acceptanceFailures += "$diagram supplies UX but has no completed pre-implementation design inspection matrix."
              }
              if (-not $uxContract.Success -or $null -eq $visualVerification -or -not $visualVerification.Success -or
                  [string]::IsNullOrWhiteSpace($visualVerification.Groups['value'].Value) -or
                  $visualVerification.Groups['value'].Value -match '(?i)<[^>]+>|^\s*`?(?:planned|tbd|todo|none|not applicable|n/a)\b') {
                $acceptanceFailures += "$diagram supplies UX but has no completed screenshot/render comparison evidence."
              }
              if ($null -eq $uiAcceptanceTest -or -not $uiAcceptanceTest.Success -or
                  $uiAcceptanceTest.Groups['value'].Value -notmatch 'VAA\.EAPI\.Automation/[A-Za-z0-9_./-]+\.(?:cs|feature)') {
                $acceptanceFailures += "$diagram supplies UX but has no concrete UI/UX acceptance test under VAA.EAPI.Automation/."
              } else {
                $testPaths = @([regex]::Matches($uiAcceptanceTest.Groups['value'].Value, 'VAA\.EAPI\.Automation/[A-Za-z0-9_./-]+\.(?:cs|feature)') | ForEach-Object { $_.Value })
                foreach ($testPath in $testPaths) {
                  if (-not (Test-EvidencePathUnderRoot -RelativePath $testPath -AllowedRoots @('VAA.EAPI.Automation'))) {
                    $acceptanceFailures += "$diagram UI/UX acceptance test is missing or outside VAA.EAPI.Automation/: $testPath"
                  }
                }
              }
              if ($null -eq $renderedEvidence -or -not $renderedEvidence.Success) {
                $acceptanceFailures += "$diagram supplies UX but has no retained rendered evidence."
              } else {
                $imagePaths = @([regex]::Matches($renderedEvidence.Groups['value'].Value, '(?:docs|TestResults)/[A-Za-z0-9_./-]+\.(?:png|jpe?g|webp)') | ForEach-Object { $_.Value })
                if ($imagePaths.Count -lt 2) {
                  $acceptanceFailures += "$diagram must retain at least an actual render and comparison/diff image for UI/UX acceptance."
                }
                foreach ($imagePath in $imagePaths) {
                  if (-not (Test-EvidencePathUnderRoot -RelativePath $imagePath -AllowedRoots @('docs', 'TestResults'))) {
                    $acceptanceFailures += "$diagram rendered UI/UX evidence is missing or outside docs/ and TestResults/: $imagePath"
                  }
                }
              }
              if ($null -eq $comparisonResult -or -not $comparisonResult.Success -or
                  $comparisonResult.Groups['value'].Value -notmatch '(?i)^\s*`?Passed\b') {
                $acceptanceFailures += "$diagram supplies UX but its visual comparison result is not Passed."
              }
            }

            $openPoints = [regex]::Match($text, '(?is)## Open points to finalize\s*(?<body>.*?)(?:\r?\n## |\z)')
            $declaresNoOpenPoints = $openPoints.Success -and $openPoints.Groups['body'].Value -match '(?i)^\s*(?:-\s*)?None\b'
            if ($openPoints.Success -and -not $declaresNoOpenPoints -and $openPoints.Groups['body'].Value -match '(?im)^\s*-\s+.+') {
              $questions = @([regex]::Matches($openPoints.Groups['body'].Value, '(?im)^\s*-\s+(?<question>(?!None\b).+?)\s*$') | ForEach-Object {
                $_.Groups['question'].Value.Trim()
              })
              foreach ($question in $questions) {
                $openQuestions += [PSCustomObject]@{ diagram = $diagram; question = $question }
              }
            }
          }

          if ($acceptanceFailures.Count -gt 0) {
            $results += [PSCustomObject]@{
              kind = 'SemanticAcceptance'
              path = ($diagrams -join ';')
              mode = 'DiagramSatisfied'
              command = 'Agent Loop Goal acceptance, Done when, Expected harness, and authoritative UX evidence checks'
              result = 'fail'
              exitCode = 1
            }
            $failed += $acceptanceFailures
          } elseif ($diagrams.Count -gt 0) {
            $results += [PSCustomObject]@{
              kind = 'SemanticAcceptance'
              path = ($diagrams -join ';')
              mode = 'DiagramSatisfied'
              command = 'Agent Loop Goal acceptance, Done when, Expected harness, and authoritative UX evidence checks'
              result = 'pass'
              exitCode = 0
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($goalDocumentPath) -and (Test-Path -LiteralPath $goalDocumentPath -PathType Leaf)) {
            $summary = Get-GoalCoordinatorState $goalDocumentPath
            $summary.verification = @($results)
            $summary | Add-Member -NotePropertyName openQuestions -NotePropertyValue @($openQuestions) -Force
            Set-GoalCoordinatorState $goalDocumentPath $summary
          }

          if ($failed.Count -gt 0) {
            throw "Loop verification failed for: $($failed -join '; ')"
          }

      - name: Upload sequence-goal resource and cost evidence
        if: always() && steps.inprogress.outputs.has_inprogress == 'true' && (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true)
        uses: actions/upload-artifact@v4
        with:
          name: agent-resource-sequence-goal-loop-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: TestResults/agent-resource/

      - name: Record verification failure
        if: (steps.detect.outputs.has_diagrams == 'true' || steps.detect.outputs.has_index == 'true') && steps.verify.outcome == 'failure'
        shell: pwsh
        env:
          INPROGRESS_LIST: ${{ steps.inprogress.outputs.inprogress_list }}
        run: |
          . ./scripts/sequence-goal-document-state.ps1
          $goalDocumentPath = '${{ steps.evidence.outputs.goal_document }}'
          $diagrams = $env:INPROGRESS_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
          if (-not [string]::IsNullOrWhiteSpace($goalDocumentPath) -and (Test-Path -LiteralPath $goalDocumentPath -PathType Leaf)) {
            $summary = Get-GoalCoordinatorState $goalDocumentPath
            $summary.status = 'Failed'
            $summary.completedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            $summary.failure = [PSCustomObject]@{
              stage = 'verification'
              message = 'Loop verification failed; goal remains InProgress for triage or retry.'
              runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            }
            Set-GoalCoordinatorState $goalDocumentPath $summary
          }

          foreach ($diagram in $diagrams) {
            if ([string]::IsNullOrWhiteSpace($diagram)) { continue }
            ./scripts/promote-sequence-goal.ps1 `
              -DiagramPath $diagram `
              -ToStatus InProgress `
              -UpdateFieldsOnly `
              -TaskRef "branch:$($env:GITHUB_REF_NAME)" `
              -TransitionNote "Agent loop failed during verification. See run ${{ github.run_id }}."
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (Test-Path -LiteralPath '.codex/agent-loop') {
            git add -A -- docs/sequence-diagrams.md docs/sequence-diagrams .codex/agent-loop
          } else {
            git add -A -- docs/sequence-diagrams.md docs/sequence-diagrams
          }
          git diff --cached --quiet
          $stagedExitCode = $LASTEXITCODE
          if ($stagedExitCode -eq 1) { git commit -m "chore(sequence-goal): record failed verification"; if ($LASTEXITCODE -ne 0) { throw 'Failed to commit verification-failure evidence.' } }
          elseif ($stagedExitCode -eq 0) { Write-Host "No verification failure evidence changes to commit." }
          else { throw 'Failed to inspect staged verification-failure evidence.' }
          git stash push --include-untracked -m 'discarded sequence-goal verification failure workspace' | Out-Null
          git pull --rebase origin $env:GITHUB_REF_NAME
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"
          exit 1

      - name: Promote verified InProgress goals to Complete
        if: steps.inprogress.outputs.has_inprogress == 'true' && steps.verify.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.cross-repo-token.outputs.token || steps.app-token.outputs.token || github.token }}
          INPROGRESS_LIST: ${{ steps.inprogress.outputs.inprogress_list }}
        run: |
          $diagrams = $env:INPROGRESS_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
          $resourceUsage = $null
          $attemptPaths = @(./scripts/export-sequence-goal-resources.ps1 -DiagramPaths $diagrams)
          $productionBudgetEvidencePaths = @($attemptPaths | Where-Object { [IO.Path]::GetFileName($_) -match '-production-' })
          $automationBudgetEvidencePaths = @($attemptPaths | Where-Object { [IO.Path]::GetFileName($_) -match '-automation-' })
          $allBudgetEvidencePaths = @(
            $productionBudgetEvidencePaths + $automationBudgetEvidencePaths |
              Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) }
          )
          if ($allBudgetEvidencePaths.Count -gt 0) {
            $productionResourceUsage = if ($productionBudgetEvidencePaths.Count -gt 0) { & ./scripts/get-agent-resource-summary.ps1 -WorkflowId 'sequence-goal-loop' -BudgetEvidencePath $productionBudgetEvidencePaths | ConvertFrom-Json } else { $null }
            $automationResourceUsage = if ($automationBudgetEvidencePaths.Count -gt 0) { & ./scripts/get-agent-resource-summary.ps1 -WorkflowId 'sequence-goal-loop' -BudgetEvidencePath $automationBudgetEvidencePaths | ConvertFrom-Json } else { $null }
            $resourceUsage = & ./scripts/get-agent-resource-summary.ps1 -WorkflowId 'sequence-goal-loop' -BudgetEvidencePath $allBudgetEvidencePaths | ConvertFrom-Json
            $resourceUsage | Add-Member -NotePropertyName production -NotePropertyValue $productionResourceUsage -Force
            $resourceUsage | Add-Member -NotePropertyName automation -NotePropertyValue $automationResourceUsage -Force
            $productionBySurface = [ordered]@{}
            foreach ($surface in @('Backend', 'MobileIos', 'MobileAndroid', 'WebUi')) {
              $surfacePaths = @($productionBudgetEvidencePaths | Where-Object { [System.IO.Path]::GetFileName($_) -match "(?i)-$surface\.budget\.json$" })
              if ($surfacePaths.Count -gt 0) {
                $productionBySurface[$surface] = & ./scripts/get-agent-resource-summary.ps1 -WorkflowId 'sequence-goal-loop' -BudgetEvidencePath $surfacePaths | ConvertFrom-Json
              }
            }
            $resourceUsage | Add-Member -NotePropertyName productionBySurface -NotePropertyValue ([PSCustomObject]$productionBySurface) -Force
          } else {
            $labels = @($diagrams | ForEach-Object {
              $text = Get-Content -LiteralPath $_ -Raw
              $maximum = [regex]::Match($text, '(?im)^\|\s*Maximum agent resources\s*\|\s*(?<value>.*?)\s*\|\s*$').Groups['value'].Value.Trim()
              $actual = [regex]::Match($text, '(?im)^\|\s*Actual agent resources\s*\|\s*(?<value>.*?)\s*\|\s*$').Groups['value'].Value.Trim()
              if ([string]::IsNullOrWhiteSpace($maximum) -or $actual -notmatch '^\d[\d,]* tokens .*\$[\d.]+ USD$') { throw "Cannot complete $_ without retained resource evidence or a valid existing resource record." }
              [pscustomobject]@{ maximum = $maximum; actual = $actual }
            })
            if (@($labels.maximum | Sort-Object -Unique).Count -ne 1 -or @($labels.actual | Sort-Object -Unique).Count -ne 1) { throw 'Resumed goals have inconsistent existing resource records.' }
            $zero = '0 tokens (0 input, 0 cached + 0 output, 0 reasoning); $0.00 USD'
            $resourceUsage = [pscustomobject]@{ maximumLabel = $labels[0].maximum; actualLabel = $labels[0].actual; production = [pscustomobject]@{ actualLabel = $labels[0].actual }; automation = [pscustomobject]@{ actualLabel = $zero }; productionBySurface = [pscustomobject]@{} }
          }
          $pendingQuestions = @()
          $pendingPullRequests = @()
          $isSmokeTest = '${{ inputs.smoke_test }}' -eq 'true'
          $coordinatorIdentity = "Associated sequence-goal delivery for ``${{ github.repository }}@$($env:GITHUB_REF_NAME)``."
          $appSlug = '${{ vars.SEQUENCE_GOAL_GITHUB_APP_SLUG }}'; $trustedAuthors = @('github-actions', 'github-actions[bot]'); if ($appSlug) { $trustedAuthors += @($appSlug, "${appSlug}[bot]", "app/$appSlug") }
          foreach ($diagram in $diagrams) {
            $text = Get-Content -LiteralPath $diagram -Raw
            $associatedSection = [regex]::Match($text, '(?ims)^## Associated delivery pull requests\s*(?<body>.*?)(?=^## |\z)').Groups['body'].Value
            $associatedRowPattern = '(?im)^\|\s*``?(?<surface>Backend|MobileIos|MobileAndroid|WebUi|QA-(?:Backend|MobileIos|MobileAndroid|WebUi))``?\s*\|\s*``?(?<repository>[^`]+)``?\s*\|\s*``?(?<base>[^`]+)``?\s*\|\s*``?(?<head>[^`]+)``?\s*\|\s*\[#(?<number>\d+)\]\((?<url>[^)]+)\)\s*\|\s*``?(?<state>Open|Merged|Closed|Queued)``?\s*\|\s*(?<merged>[^|]+)\|\s*$'
            $associatedRows = @([regex]::Matches($associatedSection, $associatedRowPattern))
            $invalidAssociatedRows = @($associatedSection -split '\r?\n' | Where-Object { $_ -match '^\s*\|' -and $_ -notmatch '^\|\s*(?:Surface|[-: ]+)(?:\s*\|.*)?$' -and $_ -notmatch '^\|\s*`Coordinator`\s*\|' -and $_ -notmatch $associatedRowPattern })
            if ($invalidAssociatedRows.Count -gt 0) { throw "Malformed associated delivery row(s) in $diagram`: $($invalidAssociatedRows -join ' ; ')" }
            $declaredSurfaceMatch = [regex]::Match($text, '(?im)^\|\s*Delivery surface\s*\|\s*(?<value>.*?)\s*\|\s*$')
            $declaredSurfaces = @(($declaredSurfaceMatch.Groups['value'].Value.Replace('`', '') -split '[,;]') | ForEach-Object Trim | Where-Object { $_ })
            if ($isSmokeTest) { $declaredSurfaces = @() }
            elseif ($declaredSurfaces.Count -eq 0) { $declaredSurfaces = @('Backend') }
            $hasQaRows = @($associatedRows | Where-Object { $_.Groups['surface'].Value.StartsWith('QA-') }).Count -gt 0
            $expectedSurfaces = if ($hasQaRows) { @($declaredSurfaces | ForEach-Object { $_; "QA-$_" }) } else { $declaredSurfaces }
            $rowSurfaces = @($associatedRows | ForEach-Object { $_.Groups['surface'].Value })
            $missingSurfaces = @($expectedSurfaces | Where-Object { $_ -notin $rowSurfaces })
            $unexpectedSurfaces = @($rowSurfaces | Where-Object { $_ -notin $expectedSurfaces })
            if ($missingSurfaces.Count -gt 0 -or $unexpectedSurfaces.Count -gt 0 -or @($rowSurfaces | Sort-Object -Unique).Count -ne $rowSurfaces.Count) { throw "Associated delivery rows do not exactly match declared surfaces for $diagram." }
            foreach ($row in $associatedRows) {
              $repository = $row.Groups['repository'].Value
              $number = [int]$row.Groups['number'].Value
              $stateJson = gh pr view $number --repo $repository --json number,state,mergedAt,url,headRefName,baseRefName,body,author,headRepository
              if ($LASTEXITCODE -ne 0) { throw "Failed to revalidate associated PR $repository#$number before goal completion." }
              $state = $stateJson | ConvertFrom-Json
              $surface = $row.Groups['surface'].Value
              $deliverySurface = $surface -replace '^QA-', ''
              $phase = if ($surface.StartsWith('QA-')) { 'QA' } else { 'Production' }
              $hasExactLine = { param([string]$Body, [string]$Value) [regex]::IsMatch($Body, '(?m)^' + [regex]::Escape($Value) + '\s*$') }
              $currentMetadata = [regex]::IsMatch([string]$state.body, ('(?m)^- Surface: `{{1,2}}{0}`{{1,2}}\s*$' -f [regex]::Escape($deliverySurface))) -and
                [regex]::IsMatch([string]$state.body, ('(?m)^- Phase: `{{1,2}}{0}`{{1,2}}\s*$' -f [regex]::Escape($phase)))
              $authenticatedMetadata = (& $hasExactLine ([string]$state.body) $coordinatorIdentity) -and $currentMetadata
              if ($state.number -ne $number -or $state.url -ne $row.Groups['url'].Value -or
                  $state.headRefName -ne $row.Groups['head'].Value -or $state.baseRefName -ne $row.Groups['base'].Value -or
                  $state.headRepository.nameWithOwner -ne $repository -or $state.author.login -notin $trustedAuthors -or
                  -not $authenticatedMetadata) {
                throw "Associated PR $repository#$number failed final authenticated identity validation."
              }
              if ($phase -eq 'Production' -and $deliverySurface -eq 'MobileIos') {
                $inferential = [regex]::Match([string]$state.body, '(?is)(?:^|\n)## Inferential review[^\n]*\n(?<body>.*?)(?=\n## |\z)').Groups['body'].Value
                $requiredPasses = @('Security and privacy','Accessibility','Maintainability and architecture','Observability, analytics and diagnosability','Testing quality and coverage gaps','Behavioural regression and traveller flow correctness')
                $actualPasses = @([regex]::Matches($inferential, '(?im)^- \[x\] (?<pass>[^\r\n]+)\r?$') | ForEach-Object { $_.Groups['pass'].Value })
                $outcomes = @([regex]::Matches($inferential, '(?im)^Review outcome:\s*(?:no-findings|findings-addressed|not-applicable):\s*\S.*$'))
                if ($actualPasses.Count -ne $requiredPasses.Count -or ($actualPasses -join "`0") -cne ($requiredPasses -join "`0") -or $outcomes.Count -ne 1) {
                  throw "Associated iOS PR $repository#$number is missing the complete six-pass inferential-review contract."
                }
              }
              $displayState = if ($state.mergedAt) { 'Merged' } else { [string]$state.state }
              $mergedAt = if ($state.mergedAt) { [string]$state.mergedAt } else { 'n/a' }
              $updatedRow = "| ``$($row.Groups['surface'].Value)`` | ``$repository`` | ``$($row.Groups['base'].Value)`` | ``$($row.Groups['head'].Value)`` | [#$number]($($state.url)) | ``$displayState`` | $mergedAt |"
              $text = $text.Replace($row.Value, $updatedRow)
              if ([string]::IsNullOrWhiteSpace([string]$state.mergedAt)) {
                $pendingPullRequests += [PSCustomObject]@{
                  diagram = $diagram; surface = $row.Groups['surface'].Value; repository = $repository
                  number = $number; state = [string]$state.state; url = [string]$state.url
                }
              }
            }
            if ($associatedRows.Count -gt 0) { Set-Content -LiteralPath $diagram -Value $text -Encoding UTF8 }
            if (@($pendingPullRequests | Where-Object { $_.diagram -eq $diagram }).Count -gt 0) {
              ./scripts/promote-sequence-goal.ps1 `
                -DiagramPath $diagram `
                -ToStatus InProgress `
                -UpdateFieldsOnly `
                -TaskRef "branch:$env:GITHUB_REF_NAME" `
                -TransitionNote 'Implementation and automation verified; awaiting all associated delivery PRs to merge.'
              continue
            }
            $openPoints = [regex]::Match($text, '(?is)## Open points to finalize\s*(?<body>.*?)(?:\r?\n## |\z)')
            $declaresNoOpenPoints = $openPoints.Success -and $openPoints.Groups['body'].Value -match '(?i)^\s*(?:-\s*)?None\b'
            $questions = if ($openPoints.Success -and -not $declaresNoOpenPoints) {
              @([regex]::Matches($openPoints.Groups['body'].Value, '(?im)^\s*-\s+(?<question>(?!None\b).+?)\s*$') | ForEach-Object {
                $_.Groups['question'].Value.Trim()
              })
            } else { @() }
            if ($questions.Count -gt 0) {
              foreach ($question in $questions) {
                $pendingQuestions += [PSCustomObject]@{ diagram = $diagram; question = $question }
              }
              ./scripts/promote-sequence-goal.ps1 `
                -DiagramPath $diagram `
                -ToStatus InProgress `
                -UpdateFieldsOnly `
                -TaskRef "branch:$env:GITHUB_REF_NAME" `
                -TransitionNote "Implementation verified; awaiting answers to open questions raised on the delivery PR."
              continue
            }
            ./scripts/promote-sequence-goal.ps1 `
              -DiagramPath $diagram `
              -ToStatus Complete `
              -TaskRef "branch:$env:GITHUB_REF_NAME" `
              -CompletedBy "github-actions[bot]" `
              -TransitionNote "Auto-promoted to Complete after agent implementation and verification pass." `
              -MaximumAgentResources $resourceUsage.maximumLabel `
              -ActualAgentResources $resourceUsage.actualLabel `
              -ProductionAgentResources $resourceUsage.production.actualLabel `
              -AutomationAgentResources $resourceUsage.automation.actualLabel
          }

          . ./scripts/sequence-goal-document-state.ps1
          $goalDocumentPath = '${{ steps.evidence.outputs.goal_document }}'
          if (Test-Path -LiteralPath $goalDocumentPath -PathType Leaf) {
            $currentSummaryJson = (Get-GoalCoordinatorState $goalDocumentPath) | ConvertTo-Json -Depth 10
            $summary = $currentSummaryJson | ConvertFrom-Json
            $hasPending = $pendingQuestions.Count -gt 0 -or $pendingPullRequests.Count -gt 0
            $summary.status = if ($hasPending) { 'InProgress' } else { 'Complete' }
            $summary.completedAtUtc = if ($hasPending) { $null } else { (Get-Date).ToUniversalTime().ToString('o') }
            $summary | Add-Member -NotePropertyName openQuestions -NotePropertyValue @($pendingQuestions) -Force
            $summary | Add-Member -NotePropertyName associatedPullRequests -NotePropertyValue @($pendingPullRequests) -Force
            if ($summary.status -eq 'Complete') {
              $summary.commits = @(
                git log --oneline origin/main..HEAD |
                ForEach-Object { $_ }
              )
            }
            if ($null -ne $resourceUsage) {
              $summary | Add-Member -NotePropertyName resourceUsage -NotePropertyValue $resourceUsage -Force
            }
            $nextSummaryJson = $summary | ConvertTo-Json -Depth 10
            if ($nextSummaryJson.TrimEnd() -cne $currentSummaryJson.TrimEnd()) {
              Set-GoalCoordinatorState $goalDocumentPath $summary
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/sequence-diagrams.md docs/sequence-diagrams .codex/agent-loop
          ./scripts/check-sequence-diagram-status.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Complete goal evidence failed sequence-diagram status validation.' }
          git commit -m "chore(sequence-goal): auto-promote verified goals to Complete"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit Complete goal evidence.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push Complete goal evidence.' }

      - name: Detect completed goals
        id: complete
        if: steps.inprogress.outputs.has_inprogress == 'true'
        shell: pwsh
        env:
          INPROGRESS_LIST: ${{ steps.inprogress.outputs.inprogress_list }}
        run: |
          $diagrams = $env:INPROGRESS_LIST.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
          $hasComplete = $false
          $hasPublishable = $false
          . ./scripts/sequence-goal-document-state.ps1
          $goalDocumentPath = '${{ steps.evidence.outputs.goal_document }}'
          $summary = if (Test-Path -LiteralPath $goalDocumentPath -PathType Leaf) { Get-GoalCoordinatorState $goalDocumentPath } else { $null }
          foreach ($diagram in $diagrams) {
            $text = Get-Content -LiteralPath $diagram -Raw
            if ($text -match '(?im)^\|\s*Final state\s*\|\s*`Abandoned`\s*\|\s*$') { continue }
            $statusMatch = [regex]::Match($text, '(?im)^\|\s*Status\s*\|\s*`(?<status>[^`]+)`\s*\|\s*$')
            if ($statusMatch.Success -and $statusMatch.Groups['status'].Value.Trim() -eq 'Complete') {
              $hasComplete = $true
              $hasPublishable = $true
              break
            }
          }

          if (-not $hasPublishable -and $null -ne $summary -and $summary.status -eq 'InProgress' -and
              @($summary.openQuestions).Count -gt 0 -and @($summary.associatedPullRequests).Count -eq 0) {
            $hasPublishable = $true
          }

          "has_complete=$($hasComplete.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "has_publishable=$($hasPublishable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Clean smoke-test artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_test == true && steps.complete.outputs.has_complete == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagram = 'docs/sequence-diagrams/agent-loop-smoke-test.md'
          $indexPath = 'docs/sequence-diagrams.md'
          . ./scripts/sequence-goal-document-state.ps1
          $goalDocumentPath = '${{ steps.evidence.outputs.goal_document }}'

          if (Test-Path -LiteralPath $diagram -PathType Leaf) {
            Remove-Item -LiteralPath $diagram
          }

          if (Test-Path -LiteralPath $indexPath -PathType Leaf) {
            $index = Get-Content -LiteralPath $indexPath -Raw
            $index = [regex]::Replace(
              $index,
              '(?im)^\|\s*\[Agent Loop Smoke Test\]\(sequence-diagrams/agent-loop-smoke-test\.md\)\s*\|.*(?:\r?\n)?',
              ''
            )
            [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $indexPath), $index, [System.Text.UTF8Encoding]::new($false))
          }

          if (-not [string]::IsNullOrWhiteSpace($goalDocumentPath) -and (Test-Path -LiteralPath $goalDocumentPath -PathType Leaf)) {
            Remove-Item -LiteralPath $goalDocumentPath
          }

          if ((git status --porcelain).Length -eq 0) {
            Write-Host "No smoke-test artifacts to clean."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/sequence-diagrams.md docs/sequence-diagrams/agent-loop-smoke-test.md .codex/agent-loop
          git commit -m "chore(sequence-goal): clean smoke-test artifacts"
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: Finalize existing coordinator PR
        if: (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true) && steps.complete.outputs.has_publishable == 'true' && steps.verify.outcome == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs = require("fs");
            const { execSync } = require("child_process");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headRef = context.ref.replace('refs/heads/', '');
            const head = `${owner}:${headRef}`;
            const goalDocumentPath = `${{ steps.evidence.outputs.goal_document }}`;
            let summary = null;
            if (goalDocumentPath && fs.existsSync(goalDocumentPath)) {
              summary = JSON.parse(fs.readFileSync(goalDocumentPath, "utf8").match(/^### Delivery: Coordinator\r?\n```json\r?\n([\s\S]*?)\r?\n```/m)?.[1] || "null");
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              base: "main"
            });

            const primaryGoal = summary?.goals?.[0]?.title || summary?.goals?.[0]?.diagram || "verified sequence goal";
            const titleSuffix = primaryGoal.length > 120 ? `${primaryGoal.slice(0, 117)}...` : primaryGoal;
            const goalList = summary?.goals?.map(g => [
              `- \`${g.diagram}\``,
              `  - Goal: ${g.title || "not recorded"}`,
              `  - Harness sensor: ${g.harnessSensor || "not recorded"}`,
              `  - Verification mode: ${g.verificationMode || "Fast"}`,
              `  - Attempt: ${g.attempt}`
            ].join("\n")).join("\n") || "- Verified sequence goal";
            const openQuestions = summary?.openQuestions || [];
            const associatedPullRequests = summary?.associatedPullRequests || [];
            const questionList = openQuestions.length > 0
              ? openQuestions.map(q => `- **${q.diagram}**: ${q.question}`).join("\n")
              : "- None.";
            const associatedPrList = associatedPullRequests.length > 0
              ? associatedPullRequests.map(pr => `- ${pr.surface}: [${pr.repository}#${pr.number}](${pr.url}) — ${pr.state}`).join("\n")
              : "- All recorded associated pull requests are merged, or this is a repository-local delivery.";
            const verificationList = summary?.verification?.map(v => `- ${v.mode || "Fast"}: \`${v.command}\` -> ${v.result}`).join("\n") || "- Verification details were not recorded.";
            const commitList = summary?.commits?.map(c => `- ${c}`).join("\n") || "- See branch commit history.";
            const maximumResources = summary?.resourceUsage?.maximumLabel || "Not recorded.";
            const actualResources = summary?.resourceUsage?.actualLabel || "Not recorded.";
            const productionResources = summary?.resourceUsage?.production?.actualLabel || "Not recorded.";
            const automationResources = summary?.resourceUsage?.automation?.actualLabel || "Not recorded.";
            const productionBySurface = summary?.resourceUsage?.productionBySurface || {};
            const surfaceResourceLines = Object.entries(productionBySurface).length > 0
              ? Object.entries(productionBySurface).map(([surface, resources]) => `- ${surface} production: ${resources.actualLabel}`)
              : ["- Per-surface production usage: Not recorded."];
            const changedFiles = execSync("git diff --name-only origin/main..HEAD", { encoding: "utf8" })
              .trim()
              .split(/\r?\n/)
              .filter(Boolean)
              .slice(0, 100);
            const changedFileList = changedFiles.length > 0 ? changedFiles.map(f => `- \`${f}\``).join("\n") : "- No changed files detected.";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "<!-- Automated PR raised by the sequence goal loop after goal completion. -->",
              "Automated PR raised by the sequence goal loop after implementation verification.",
              openQuestions.length > 0 || associatedPullRequests.length > 0
                ? "Implementation is verified, but the goal remains InProgress pending the items below."
              : "All completion criteria are satisfied.",
              "",
              "## Overall deliverable",
              primaryGoal,
              "",
              "## Delivered goals",
              goalList,
              "",
              "## Questions requiring input",
              questionList,
              "",
              "## Associated delivery pull requests",
              associatedPrList,
              "",
              "## Verification",
              verificationList,
              "",
              "## Changed files",
              changedFileList,
              "",
              "## Review scope",
              "",
              "Review only regressions introduced by this PR relative to its base branch that affect the stated delivery acceptance criteria.",
              "",
              "Treat as blocking only correctness, security, trust-boundary, data-loss, or lifecycle-integrity defects introduced or materially changed by this PR. Do not request unrelated hardening, architectural improvements, pre-existing fixes, stylistic changes, or speculative edge cases here; record those as follow-up work.",
              "",
              "When re-reviewing, verify the fixes made for existing findings. Do not restart an unrestricted whole-system redesign review.",
              "",
              "## Agent loop evidence",
              `- Run: ${runUrl}`,
              `- Branch: \`${headRef}\``,
              goalDocumentPath ? `- Goal document: \`${goalDocumentPath}\`` : "- Goal document: not recorded",
              "",
              "## Agent resources and cost",
              `- Maximum budget: ${maximumResources}`,
              `- Production code generation: ${productionResources}`,
              ...surfaceResourceLines,
              `- Automation code generation: ${automationResources}`,
              `- Total actual: ${actualResources}`,
              "",
              "## Commits",
              commitList
            ].join("\n");

            const title = `feat(sequence-goal): ${titleSuffix}`;
            const questionMarker = "<!-- sequence-goal-open-points human-comment -->";
            const questionBody = [
              questionMarker,
              "## Input needed before this goal can be completed",
              "",
              questionList,
              "",
              "The implementation has passed verification and remains `InProgress` until these points are answered."
            ].join("\n");
            const coordinatorMarker = "Automated PR raised by the sequence goal loop after goal completion.";
            const appSlug = "${{ vars.SEQUENCE_GOAL_GITHUB_APP_SLUG }}";
            const trustedCoordinatorAuthors = new Set(["github-actions", "github-actions[bot]", ...(appSlug ? [appSlug, `${appSlug}[bot]`, `app/${appSlug}`] : [])]);
            const reusable = existing.data.filter(candidate => candidate.head?.ref === headRef && candidate.head?.repo?.full_name === `${owner}/${repo}` && candidate.base?.ref === "main" && trustedCoordinatorAuthors.has(candidate.user?.login || "") && (candidate.body || "").includes(coordinatorMarker));
            if (existing.data.length !== reusable.length || reusable.length > 1) throw new Error("Open coordinator PR failed trusted author, repository, branch, base, or marker validation before update.");
            if (reusable.length !== 1) throw new Error("The draft coordinator PR must already exist before finalization.");
            const coordinatorPr = reusable[0];
              const prNumber = coordinatorPr.number;
              if (openQuestions.length > 0 && !coordinatorPr.draft) {
                const converted = await github.graphql(`mutation($pullRequestId: ID!) { convertPullRequestToDraft(input: { pullRequestId: $pullRequestId }) { pullRequest { isDraft } } }`, { pullRequestId: coordinatorPr.node_id });
                if (!converted.convertPullRequestToDraft.pullRequest.isDraft) throw new Error("Coordinator PR remained ready while unresolved open points exist.");
                coordinatorPr.draft = true;
              }
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                title,
                body
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `Sequence goal loop refreshed this PR after run ${runUrl}.`
              });
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100
              });
              const priorQuestion = comments.find(comment => comment.body?.includes(questionMarker));
              if (openQuestions.length > 0) {
                if (priorQuestion) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: priorQuestion.id, body: questionBody });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: questionBody });
                }
              } else if (priorQuestion) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: priorQuestion.id,
                  body: `${questionMarker}\nAll previously raised open points have been answered; the goal is now complete.`
                });
              }
              if (openQuestions.length === 0 && coordinatorPr.draft) {
                const ready = await github.graphql(`mutation($pullRequestId: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $pullRequestId }) { pullRequest { isDraft } } }`, { pullRequestId: coordinatorPr.node_id });
                if (ready.markPullRequestReadyForReview.pullRequest.isDraft) throw new Error("Coordinator PR remained draft after open points were resolved.");
                coordinatorPr.draft = false;
              }
            core.info(`Updated PR #${prNumber}`);
            if (!coordinatorPr || coordinatorPr.head.ref !== headRef || coordinatorPr.base.ref !== "main") throw new Error("Coordinator PR identity verification failed after create/update.");

            const coordinatorRow = `| \`Coordinator\` | \`${owner}/${repo}\` | \`main\` | \`${headRef}\` | [#${coordinatorPr.number}](${coordinatorPr.html_url}) | \`${String(coordinatorPr.state || "open").toUpperCase()}\` | n/a |`;
            const coordinatorPattern = /^\|\s*`Coordinator`\s*\|.*$/mi;
            const diagrams = [...new Set((summary?.goals || []).map(goal => goal.diagram).filter(Boolean))];
            for (const diagram of diagrams) {
              if (!fs.existsSync(diagram)) {
                core.warning(`Cannot register coordinator PR in missing goal document ${diagram}.`);
                continue;
              }
              let text = fs.readFileSync(diagram, "utf8");
              if (coordinatorPattern.test(text)) {
                text = text.replace(coordinatorPattern, coordinatorRow);
              } else {
                const heading = "## Associated delivery pull requests";
                const start = text.indexOf(heading);
                if (start < 0) throw new Error(`${diagram} has no associated delivery pull requests section.`);
                const followingHeading = text.indexOf("\n## ", start + heading.length);
                const end = followingHeading < 0 ? text.length : followingHeading + 1;
                const section = text.slice(start, end).trimEnd();
                text = `${text.slice(0, start)}${section}\n${coordinatorRow}\n\n${text.slice(end).replace(/^\n+/, "")}`;
              }
              fs.writeFileSync(diagram, text, "utf8");
            }
            core.setOutput("coordinator_pr", String(coordinatorPr.number));

      - name: Register coordinator PR in goal documents
        if: (github.event_name != 'workflow_dispatch' || inputs.smoke_test != true) && steps.complete.outputs.has_publishable == 'true' && steps.verify.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git status --porcelain -- docs/sequence-diagrams).Length -eq 0) {
            Write-Host 'Coordinator PR ledger already current.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- docs/sequence-diagrams
          git commit -m 'chore(sequence-goal): register coordinator PR'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit verified coordinator PR registration.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            git pull --rebase origin $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Failed to rebase coordinator PR registration after a concurrent branch update.' }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to push verified coordinator PR registration after retry.' }
          }
