name: ai-harness-closed-loop-autonomy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: closed-loop-autonomy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: closed-loop-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforcement inventory fail-closed check
        shell: pwsh
        run: |
          ./scripts/check-harness-enforcement-inventory.ps1 -FailOnGap

      - name: Context routing policy check
        shell: pwsh
        run: |
          ./scripts/check-context-routing.ps1 -MaxAgeDays 30

      - name: Remediation log and escalation check
        shell: pwsh
        run: |
          ./scripts/check-harness-remediation-log.ps1 -MaxReviewAgeDays 14
