name: ai-harness-mermaid-validation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-mermaid-diagrams.ps1'
      - 'scripts/invoke-mermaid-validation-exercise.ps1'
      - '.github/workflows/ai-harness-mermaid-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mermaid-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-mermaid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for Mermaid CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Exercise Mermaid render validation
        shell: pwsh
        run: ./scripts/invoke-mermaid-validation-exercise.ps1

      - name: Render changed Mermaid diagrams
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $baseRef = 'origin/${{ github.base_ref }}'
          } else {
            & git rev-parse --verify 'HEAD~1' 2>$null | Out-Null
            $baseRef = if ($LASTEXITCODE -eq 0) { 'HEAD~1' } else { 'HEAD' }
          }
          ./scripts/check-mermaid-diagrams.ps1 -BaseRef $baseRef
