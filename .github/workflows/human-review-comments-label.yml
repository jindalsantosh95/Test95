name: Human Review Comments Label

on:
  pull_request_target:
    types: [opened, reopened]
  # Review events first run a read-only workflow. workflow_run can then use
  # a write token even when the PR branch comes from a fork.
  workflow_run:
    workflows: ['Human Review Comments Event']
    types: [completed]
  # GitHub Actions has no review-thread-resolution trigger. Reconcile all open
  # PRs so resolving or reopening a thread also updates the label.
  schedule:
    - cron: '2/10 * * * *'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Optional PR number; leave blank to reconcile all open PRs'
        required: false
        type: number

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: human-review-comments-label
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional comma-separated machine-user accounts, which GitHub reports
      # as User rather than Bot.
      AGENT_REVIEW_LOGINS: ${{ vars.VAA_REVIEW_AGENT_LOGINS }}
    steps:
      - name: Reconcile human review comments label
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'vaa-reviewer-comments';
            const agentLogins = new Set([
              'copilot',
              'copilot-pull-request-reviewer',
              'codex',
              'github-actions',
              ...(process.env.AGENT_REVIEW_LOGINS || '')
                .split(',').map(login => login.trim().toLowerCase()).filter(Boolean)
            ]);

            // A review thread can contain bot and human replies. Any human
            // comment in an unresolved thread keeps the label present.
            function isHuman(author) {
              if (author?.__typename !== 'User' || !author.login) return false;
              const login = author.login.toLowerCase();
              return !agentLogins.has(login)
                && !login.endsWith('[bot]')
                && !/^(copilot|codex)(?:-|\[)/.test(login);
            }

            const threadQuery = `
              query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 50, after: $cursor) {
                      nodes {
                        id
                        isResolved
                        comments(first: 30) {
                          nodes { author { __typename login } }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }
            `;
            const commentQuery = `
              query($threadId: ID!, $cursor: String!) {
                node(id: $threadId) {
                  ... on PullRequestReviewThread {
                    comments(first: 100, after: $cursor) {
                      nodes { author { __typename login } }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }
            `;

            async function hasUnresolvedHumanComment(number) {
              let threadCursor = null;
              do {
                const result = await github.graphql(threadQuery, {
                  owner, repo, number, cursor: threadCursor
                });
                const threads = result.repository?.pullRequest?.reviewThreads;
                if (!threads) throw new Error(`Cannot read review threads for PR #${number}.`);

                for (const thread of threads.nodes) {
                  if (thread.isResolved) continue;
                  let comments = thread.comments;
                  if (comments.nodes.some(comment => isHuman(comment.author))) return true;

                  while (comments.pageInfo.hasNextPage) {
                    const next = await github.graphql(commentQuery, {
                      threadId: thread.id,
                      cursor: comments.pageInfo.endCursor
                    });
                    comments = next.node?.comments;
                    if (!comments) throw new Error(`Cannot read comments in PR #${number}.`);
                    if (comments.nodes.some(comment => isHuman(comment.author))) return true;
                  }
                }

                threadCursor = threads.pageInfo.hasNextPage
                  ? threads.pageInfo.endCursor
                  : null;
              } while (threadCursor);
              return false;
            }

            let labelExists = null;
            async function ensureLabel() {
              if (labelExists === true) return;
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: label, color: 'd93f0b',
                    description: 'Unresolved PR review threads with human comments'
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({ owner, repo, name: label });
                }
              }
              labelExists = true;
            }

            const requestedNumber = context.payload.pull_request?.number
              ?? context.payload.workflow_run?.pull_requests?.[0]?.number
              ?? Number(context.payload.inputs?.pull_request_number || 0);
            let pullRequests;
            if (requestedNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: requestedNumber
              });
              pullRequests = [pr];
            } else {
              pullRequests = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100
              });
            }

            for (const pr of pullRequests) {
              if (pr.state !== 'open') continue;
              const number = pr.number;

              const needed = await hasUnresolvedHumanComment(number);
              // PR payloads include labels. Only fetch separately if that
              // embedded list reaches the API's usual page size.
              const labels = pr.labels.length < 100
                ? pr.labels
                : await github.paginate(github.rest.issues.listLabelsOnIssue, {
                    owner, repo, issue_number: number, per_page: 100
                  });
              const present = labels.some(item => item.name === label);

              if (needed && !present) {
                await ensureLabel();
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: number, labels: [label]
                });
                core.info(`Added ${label} to PR #${number}.`);
              } else if (!needed && present) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: number, name: label
                });
                core.info(`Removed ${label} from PR #${number}.`);
              } else {
                core.info(`PR #${number} already has the correct label state.`);
              }
            }
