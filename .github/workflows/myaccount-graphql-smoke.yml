name: Automation - MyAccount GraphQL Smoke

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment for the test config"
        required: true
        default: "sit"
        type: choice
        options:
          - dev
          - sit
          - uat
          - all
  schedule:
    # Daily staggered runs (UTC)
    - cron: "10 3 * * *" # sit
    - cron: "30 3 * * *" # uat

concurrency:
  group: myaccount-graphql-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-targets:
    name: Resolve Target Environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.resolve.outputs.environments }}
    steps:
      - name: Resolve environments
        id: resolve
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $schedule = "${{ github.event.schedule }}"
          $manualTarget = "${{ github.event.inputs.target_environment }}"

          $targets = @()

          if ($eventName -eq "schedule") {
            switch ($schedule) {
              "10 3 * * *" { $targets = @("sit") }
              "30 3 * * *" { $targets = @("uat") }
              default { $targets = @("sit") }
            }
          }
          else {
            switch ($manualTarget) {
              "all" { $targets = @("dev", "sit", "uat") }
              "dev" { $targets = @("dev") }
              "sit" { $targets = @("sit") }
              "uat" { $targets = @("uat") }
              default { $targets = @("sit") }
            }
          }

          $json = ConvertTo-Json -InputObject $targets -Compress
          "environments=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved target environments: $($targets -join ', ')"

  myaccount-graphql-smoke:
    name: "MyAccount GraphQL Smoke (${{ matrix.target_env }})"
    needs: resolve-targets
    strategy:
      fail-fast: false
      matrix:
        target_env: ${{ fromJson(needs.resolve-targets.outputs.environments) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      env: ${{ matrix.target_env }}
      BaseUrl: ${{ vars.BASE_URL }}
      graphQlMyAccountPublic: ${{ vars.GRAPHQL_MYACCOUNT_PUBLIC_PATH }}
      graphQlMyAccountSecure: ${{ vars.GRAPHQL_MYACCOUNT_SECURE_PATH }}
      graphQlLoyalty: ${{ vars.GRAPHQL_LOYALTY_PATH }}
      HAS_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_MYACCOUNT != '' }}
      TEST_FILTER: Category=MyAccountGQLRegressionTests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VAA.EAPI.Automation/VAA.EAPI.Automation.MyAccount/VAA.EAPI.Automation.MyAccount.csproj

      - name: Build
        run: dotnet build VAA.EAPI.Automation/VAA.EAPI.Automation.MyAccount/VAA.EAPI.Automation.MyAccount.csproj -c Release --no-restore

      - name: Run MyAccount GraphQL smoke tests
        shell: pwsh
        env:
          KeyVaultUrl: ${{ secrets.KEY_VAULT_URL }}
          KeyVaultTenantId: ${{ secrets.KEY_VAULT_TENANT_ID }}
          KeyVaultClientId: ${{ secrets.KEY_VAULT_CLIENT_ID }}
          KeyVaultClientSecret: ${{ secrets.KEY_VAULT_CLIENT_SECRET }}
        run: |
          dotnet test "VAA.EAPI.Automation/VAA.EAPI.Automation.MyAccount/VAA.EAPI.Automation.MyAccount.csproj" `
            -c Release `
            --no-build `
            --filter "$env:TEST_FILTER" `
            --results-directory "TestResults" `
            --logger "trx;LogFileName=MyAccount-graphql-smoke-$env:env.trx"

      - name: Publish MyAccount test summary
        id: publish_summary
        if: always()
        shell: pwsh
        run: |
          $summaryPath = $env:GITHUB_STEP_SUMMARY

          function Write-DefaultOutputs() {
            "total=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "passed=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "failed=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "skipped=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "pass_rate=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "duration=n/a" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "failure_summary=None" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "stakeholder_breakdown=- No stakeholder-facing check results were available." | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "customer_impact=- No customer impact could be determined because no test results were available." | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          function Write-MinimalSummary([string]$reason) {
            Write-DefaultOutputs
            "## MyAccount GraphQL Smoke Summary ($env:env)`n`n$reason" | Out-File -FilePath $summaryPath -Encoding utf8 -Append
          }

          $trxFile = Get-ChildItem -Path "TestResults" -Filter "*.trx" -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $trxFile) {
            Write-MinimalSummary "No TRX file was found in TestResults."
            exit 0
          }

          [xml]$trx = $null
          try {
            [xml]$trx = Get-Content -Path $trxFile.FullName -ErrorAction Stop
          }
          catch {
            Write-MinimalSummary "Unable to parse TRX file ``$($trxFile.Name)``. Error: $($_.Exception.Message)"
            exit 0
          }

          if ($null -eq $trx.TestRun -or $null -eq $trx.TestRun.ResultSummary -or $null -eq $trx.TestRun.ResultSummary.Counters) {
            Write-MinimalSummary "TRX file ``$($trxFile.Name)`` is missing ResultSummary counters."
            exit 0
          }

          function Get-CounterValue($value) {
            if ($null -eq $value -or [string]::IsNullOrWhiteSpace([string]$value)) { return 0 }
            return [int]$value
          }

          $counters = $trx.TestRun.ResultSummary.Counters
          $total = Get-CounterValue $counters.total
          $passed = Get-CounterValue $counters.passed
          $failed = Get-CounterValue $counters.failed
          $skipped = Get-CounterValue $counters.notExecuted
          $passRate = if ($total -gt 0) { [math]::Round(($passed / $total) * 100, 2) } else { 0 }

          [datetime]$startTime = [datetime]::MinValue
          [datetime]$finishTime = [datetime]::MinValue
          $durationText = "n/a"
          if ($null -ne $trx.TestRun.Times -and [datetime]::TryParse($trx.TestRun.Times.start, [ref]$startTime) -and [datetime]::TryParse($trx.TestRun.Times.finish, [ref]$finishTime)) {
            $duration = $finishTime - $startTime
            $durationText = "$([int]$duration.TotalMinutes)m $($duration.Seconds)s"
          }

          $failedResults = @()
          if ($null -ne $trx.TestRun.Results -and $null -ne $trx.TestRun.Results.UnitTestResult) {
            $failedResults = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" })
          }

          $failureSummaryText = "None"
          if ($failedResults.Count -gt 0) {
            $failureSummaryItems = $failedResults |
              ForEach-Object {
                $message = $_.Output.ErrorInfo.Message
                if ([string]::IsNullOrWhiteSpace($message)) { "No error message" }
                else { ($message -split "`r?`n")[0].Trim() }
              } |
              Group-Object |
              Sort-Object Count -Descending |
              Select-Object -First 5 |
              ForEach-Object {
                $firstLine = $_.Name
                if ($firstLine.Length -gt 140) { $firstLine = $firstLine.Substring(0, 140) + "..." }
                "$($_.Count)x $firstLine"
              }

            if ($failureSummaryItems.Count -gt 0) {
              $failureSummaryText = ($failureSummaryItems -join "`n")
            }
          }

          function Get-StakeholderCheck([string]$testName) {
            switch -Regex ($testName) {
              "AccountActivityDetails" { return @{ Name = "Account activity"; Impact = "Members may not be able to view their account activity." } }
              "AccountAddressDetails" { return @{ Name = "Account addresses"; Impact = "Members may not be able to view their saved account addresses." } }
              "AccountManageAccount" { return @{ Name = "Account management"; Impact = "Members may not be able to view or manage their account details." } }
              "AccountTenureDetails" { return @{ Name = "Membership tenure"; Impact = "Membership tenure information may not be available." } }
              "MemberVoucherDetails" { return @{ Name = "Member vouchers"; Impact = "Members may not be able to view their vouchers." } }
              "AccountPointDotComDetails" { return @{ Name = "Points purchase and gifting"; Impact = "Points purchase or gifting options may not be available." } }
              "AccountValidatePassword" { return @{ Name = "Password validation"; Impact = "Password validation may not be available." } }
              "RetrieveHouseHoldAccount" { return @{ Name = "Household accounts"; Impact = "Household account information may not be available." } }
              default { return @{ Name = "MyAccount GraphQL check"; Impact = "A MyAccount capability may not be available." } }
            }
          }

          $stakeholderBreakdownItems = @()
          $customerImpactItems = @()
          if ($null -ne $trx.TestRun.Results -and $null -ne $trx.TestRun.Results.UnitTestResult) {
            $testResults = @($trx.TestRun.Results.UnitTestResult)
            $stakeholderResultGroups = @($testResults |
              ForEach-Object {
                $stakeholderCheck = Get-StakeholderCheck $_.testName
                [pscustomobject]@{
                  Name = $stakeholderCheck.Name
                  Impact = $stakeholderCheck.Impact
                  Outcome = $_.outcome
                }
              } |
              Group-Object Name |
              Sort-Object Name)

            $stakeholderBreakdownItems = $stakeholderResultGroups |
              ForEach-Object {
                $testTotal = $_.Count
                $testPassed = @($_.Group | Where-Object { $_.Outcome -eq "Passed" }).Count
                $testFailed = @($_.Group | Where-Object { $_.Outcome -eq "Failed" }).Count
                $testSkipped = @($_.Group | Where-Object { $_.Outcome -eq "NotExecuted" }).Count

                if ($testFailed -gt 0) {
                  $customerImpactItems += "- $($_.Group[0].Impact)"
                  "- $($_.Name): $testPassed/$testTotal passed :x:"
                }
                elseif ($testSkipped -gt 0) {
                  "- $($_.Name): $testPassed passed, $testSkipped skipped :warning:"
                }
                else {
                  "- $($_.Name): $testPassed/$testTotal passed :white_check_mark:"
                }
              }
          }

          $stakeholderBreakdownText = if ($stakeholderBreakdownItems.Count -gt 0) {
            $stakeholderBreakdownItems -join "`n"
          }
          else {
            "- No stakeholder-facing check results were available."
          }

          $customerImpactText = if ($customerImpactItems.Count -gt 0) {
            ($customerImpactItems | Select-Object -Unique) -join "`n"
          }
          else {
            "- No customer impact detected."
          }

          "total=$total" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "passed=$passed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "failed=$failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "skipped=$skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pass_rate=$passRate" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "duration=$durationText" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "failure_summary<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $failureSummaryText | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "stakeholder_breakdown<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $stakeholderBreakdownText | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "customer_impact<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $customerImpactText | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $codeFence = '```'
          $summaryLines = @(
            "## MyAccount GraphQL Smoke Summary ($env:env)",
            "",
            "*Category filter:* ``$env:TEST_FILTER``",
            "",
            "| Metric | Value |",
            "|---|---:|",
            "| Total | $total |",
            "| Passed | $passed |",
            "| Failed | $failed |",
            "| Skipped | $skipped |",
            "| Pass rate | $passRate% |",
            "| Duration | $durationText |",
            "",
            "### Failure Summary (Top):",
            "$codeFence",
            "$failureSummaryText",
            "$codeFence"
          )

          $summaryLines -join "`n" | Out-File -FilePath $summaryPath -Encoding utf8 -Append

          try {
            $analysis = & "scripts/analyse-test-run-results.ps1" `
              -ResultsDirectory "TestResults" `
              -SuiteName "MyAccount GraphQL Smoke" `
              -EnvironmentName $env:env
            if (-not [string]::IsNullOrWhiteSpace($analysis)) {
              "`n$analysis" | Out-File -FilePath $summaryPath -Encoding utf8 -Append
            }
          }
          catch {
            "### Post-Test Failure Analysis`n`nUnable to generate failure analysis: $($_.Exception.Message)" | Out-File -FilePath $summaryPath -Encoding utf8 -Append
          }

      - name: Notify Slack summary
        if: always() && github.ref == 'refs/heads/main' && env.HAS_SLACK_WEBHOOK == 'true'
        shell: pwsh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_MYACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TOTAL: ${{ steps.publish_summary.outputs.total }}
          PASSED: ${{ steps.publish_summary.outputs.passed }}
          FAILED: ${{ steps.publish_summary.outputs.failed }}
          SKIPPED: ${{ steps.publish_summary.outputs.skipped }}
          PASS_RATE: ${{ steps.publish_summary.outputs.pass_rate }}
          DURATION: ${{ steps.publish_summary.outputs.duration }}
          FAILURE_SUMMARY: ${{ steps.publish_summary.outputs.failure_summary }}
          STAKEHOLDER_BREAKDOWN: ${{ steps.publish_summary.outputs.stakeholder_breakdown }}
          CUSTOMER_IMPACT: ${{ steps.publish_summary.outputs.customer_impact }}
          TARGET_ENV: ${{ matrix.target_env }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
          TEST_FILTER: ${{ env.TEST_FILTER }}
        run: |
          [int]$total = $env:TOTAL
          [int]$failed = $env:FAILED
          $allChecksPassed = $env:JOB_STATUS -eq "success" -and $total -gt 0 -and $failed -eq 0

          if ($allChecksPassed) {
            $statusEmoji = ":white_check_mark:"
            $statusText = "Healthy"
            $healthMessage = "All critical MyAccount backend checks passed. No issues were detected in $($env:TARGET_ENV.ToUpperInvariant())."
          }
          elseif ($env:JOB_STATUS -eq "cancelled") {
            $statusEmoji = ":warning:"
            $statusText = "Not Completed"
            $healthMessage = "The smoke test did not complete. Please review the workflow run before assessing backend health."
          }
          elseif ($total -eq 0) {
            $statusEmoji = ":warning:"
            $statusText = "Needs Review"
            $healthMessage = "No test results were produced, so MyAccount backend health could not be confirmed."
          }
          else {
            $statusEmoji = ":x:"
            $statusText = "Attention Required"
            $healthMessage = "$failed critical MyAccount backend check(s) failed and need investigation."
          }

          $londonTimeZone = [TimeZoneInfo]::FindSystemTimeZoneById("GMT Standard Time")
          $reportedAt = [TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $londonTimeZone)
          $reportDate = $reportedAt.ToString("MMM dd, yyyy")
          $timeZoneLabel = if ($reportedAt.IsDaylightSavingTime()) { "BST" } else { "GMT" }
          $reportTime = "$($reportedAt.ToString("h:mm tt")) $timeZoneLabel"
          $triggerText = if ($env:TRIGGER -eq "schedule") { "Scheduled" } elseif ($env:TRIGGER -eq "workflow_dispatch") { "Manually triggered" } else { $env:TRIGGER }
          $resultSummary = "- Backend: $($env:PASSED) passed, $($env:FAILED) failed, $($env:SKIPPED) skipped ($($env:TOTAL) total)"

          $blocks = @(
            @{
              type = "section"
              text = @{ type = "mrkdwn"; text = "$statusEmoji *MyAccount Backend Health: $($env:TARGET_ENV.ToUpperInvariant()) | $($statusText.ToUpperInvariant())*" }
            },
            @{
              type = "section"
              text = @{ type = "mrkdwn"; text = $healthMessage }
            },
            @{
              type = "section"
              fields = @(
                @{ type = "mrkdwn"; text = "*Date:*`n$reportDate" },
                @{ type = "mrkdwn"; text = "*Time:*`n$reportTime" },
                @{ type = "mrkdwn"; text = "*Duration:*`n$($env:DURATION)" },
                @{ type = "mrkdwn"; text = "*Backend Env:*`n$($env:TARGET_ENV.ToUpperInvariant())" },
                @{ type = "mrkdwn"; text = "*Trigger:*`n$triggerText" }
              )
            },
            @{ type = "context"; elements = @(@{ type = "mrkdwn"; text = "Repository: <$($env:REPOSITORY_URL)|$($env:GITHUB_REPOSITORY)>" }) },
            @{ type = "divider" },
            @{
              type = "section"
              text = @{ type = "mrkdwn"; text = "*Results Summary*`n$resultSummary" }
            },
            @{
              type = "section"
              text = @{ type = "mrkdwn"; text = "*What this confirms*`n$($env:STAKEHOLDER_BREAKDOWN)" }
            }
          )

          if (-not $allChecksPassed) {
            $blocks += @{
              type = "section"
              text = @{ type = "mrkdwn"; text = "*Customer Impact*`n$($env:CUSTOMER_IMPACT)" }
            }
          }

          $blocks += @{
            type = "actions"
            elements = @(
              @{ type = "button"; text = @{ type = "plain_text"; text = "View Technical Run Details" }; url = "$($env:RUN_URL)" },
              @{ type = "button"; text = @{ type = "plain_text"; text = "View Repository" }; url = "$($env:REPOSITORY_URL)" }
            )
          }

          $payload = @{
            text = "$statusEmoji MyAccount Backend Health: $($env:TARGET_ENV.ToUpperInvariant()) | $($statusText.ToUpperInvariant())"
            blocks = $blocks
          } | ConvertTo-Json -Depth 8

          try {
            Invoke-RestMethod -Method Post -Uri $env:SLACK_WEBHOOK_URL -ContentType "application/json" -Body $payload
          }
          catch {
            Write-Host "::warning::Slack notification failed: $($_.Exception.Message)"
          }

      - name: Upload MyAccount results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyAccount-graphql-smoke-results-${{ matrix.target_env }}
          path: TestResults/*.trx
          if-no-files-found: warn
