name: ai-harness-repository-parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: repo-harness-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect-scopes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scopes.outputs.matrix }}
      count: ${{ steps.scopes.outputs.count }}
      base: ${{ steps.scopes.outputs.base }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the pull-request base ref
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Fetch the push base commit
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        shell: pwsh
        run: git fetch --no-tags origin "${{ github.event.before }}"

      - name: Resolve changed scopes
        id: scopes
        shell: pwsh
        run: |
          ./scripts/invoke-verify-matrix-exercise.ps1
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = 'origin/${{ github.base_ref }}'
          } else {
            $base = '${{ github.event.before }}'
          }

          $scopes = & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/resolve-verify-scopes.ps1 -Base $base -Head HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Scope detection failed.' }
          $items = @($scopes | ConvertFrom-Json)
          $matrix = & ./scripts/new-verify-matrix.ps1 -ScopesJson $scopes
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "count=$($items.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved $($items.Count) verify scope(s)."

  verify:
    name: verify-batch-${{ matrix.batch }}
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the pull-request base ref
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Fetch the push base commit
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        shell: pwsh
        run: git fetch --no-tags origin "${{ github.event.before }}"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify every scope in the batch
        env:
          VERIFY_SCOPES: ${{ toJson(matrix.scopes) }}
          VERIFY_BASE: ${{ needs.detect.outputs.base }}
        shell: pwsh
        run: |
          $failed = @()
          foreach ($scope in @($env:VERIFY_SCOPES | ConvertFrom-Json)) {
            Write-Host "::group::Verify $($scope.kind) $($scope.path)"
            $arguments = @('-NoProfile', '-File', 'scripts/verify.ps1', "-$($scope.kind)", $scope.path, '-Base', $env:VERIFY_BASE, '-SkipBuild')
            & pwsh @arguments
            if ($LASTEXITCODE -ne 0) { $failed += "$($scope.kind):$($scope.path)" }
            Write-Host '::endgroup::'
          }
          if ($failed.Count -gt 0) { throw "Failed scopes: $($failed -join ', ')" }

  parity-gate:
    name: parity-gate
    runs-on: ubuntu-latest
    needs: [detect, verify]
    if: ${{ always() }}
    steps:
      - name: Evaluate scoped verify results
        shell: pwsh
        run: |
          if ('${{ needs.detect.result }}' -ne 'success') {
            throw 'Scope detection failed; parity cannot be established.'
          }
          $count = [int]'${{ needs.detect.outputs.count }}'
          $verifyResult = '${{ needs.verify.result }}'

          if ($count -eq 0) {
            Write-Host 'No relevant scopes detected; parity gate passes.'
            exit 0
          }

          if ($verifyResult -ne 'success') {
            Write-Host "Scoped verify result was '$verifyResult'; failing parity gate." -ForegroundColor Red
            exit 1
          }

          Write-Host 'Scoped verify matrix succeeded; parity gate passes.'
