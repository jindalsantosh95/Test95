name: Copilot Label Automation

on:
  schedule:
    - cron: '*/5 7-18 * * 1-5'
  workflow_dispatch:

concurrency:
  group: copilot-label-automation
  cancel-in-progress: true

jobs:
  manage-copilot-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      issues: write
    steps:

      - name: Debug - Log Event Information
        uses: actions/github-script@v7
        with:
          script: |
            console.log(`Event Name: ${context.eventName}`);
            console.log(`Actor: ${context.actor}`);
            console.log(`Schedule: ${context.payload.schedule}`);

      - name: Handle Copilot Review Completion
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |-
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const reviewAuthors = ['copilot', 'copilot[bot]', 'copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]', 'codex', 'codex[bot]'];

            const londonParts = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Europe/London',
              weekday: 'short',
              hour: 'numeric',
              hour12: false
            }).formatToParts(new Date());
            const londonWeekday = londonParts.find(part => part.type === 'weekday')?.value;
            const londonHour = Number(londonParts.find(part => part.type === 'hour')?.value);
            const isWeekday = !['Sat', 'Sun'].includes(londonWeekday);
            const isWorkingHour = isWeekday && londonHour >= 8 && londonHour < 18;

            if (!isWorkingHour) {
              console.log(`Skipping outside London working hours. Current London time: ${londonWeekday} ${londonHour}:00`);
              return;
            }

            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const openPullRequests = pullRequests.filter(pullRequest => !pullRequest.draft);
            console.log(`Inspecting ${openPullRequests.length} open non-draft pull requests`);

            for (const pullRequest of openPullRequests) {
              const pr_number = pullRequest.number;
              console.log(`Inspecting pull request ${pr_number}`);

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr_number,
                per_page: 100
              });

              const copilotReview = reviews
                .slice()
                .reverse()
                .find(review => reviewAuthors.includes(review.user?.login));

              if (!copilotReview) {
                console.log(`No Copilot/Codex review found for pull request ${pr_number}`);
                continue;
              }

              console.log(`Found Copilot/Codex review ${copilotReview.id} for pull request ${pr_number}`);
            
              // Query review threads via GraphQL
              const query = `
                query($owner: String!, $repo: String!, $pr_number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr_number) {
                      reviewThreads(first: 100) {
                        nodes {
                          isResolved
                          comments(first: 1) {
                            nodes {
                              author {
                                login
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;
            
              let result;
              try {
                result = await github.graphql(query, {
                  owner: owner,
                  repo: repo,
                  pr_number: pr_number
                });
              } catch (error) {
                console.log(`GraphQL query failed for pull request ${pr_number} because: `, error.message);
                continue;
              }
            
              // Filter for unresolved threads authored by Copilot or Codex
              const unresolvedCopilotThreads = result.repository.pullRequest.reviewThreads.nodes.filter(thread => {
                if (thread.isResolved) return false;
                const authorLogin = thread.comments.nodes?.[0]?.author?.login;
                return reviewAuthors.includes(authorLogin);
              });
            
              const hasUnresolvedThreads = unresolvedCopilotThreads.length > 0;
              console.log(`Found ${unresolvedCopilotThreads.length} unresolved Copilot/Codex threads on pull request ${pr_number}`);
            
              const labels = pullRequest.labels;
              const copilotLabels = labels
                .filter(label => label.name.startsWith('copilot-'))
                .map(label => label.name);
              const labelToAdd = hasUnresolvedThreads ? 'copilot-left-comments' : 'copilot-passed';

              if (copilotLabels.length === 1 && copilotLabels[0] === labelToAdd) {
                console.log(`Pull request ${pr_number} already has ${labelToAdd}`);
                continue;
              }
            
              for (const label of copilotLabels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr_number,
                    name: label
                  });
                } catch (error) {
                  console.log(`Could not remove label ${label} on ${owner}/${repo} pull request ${pr_number} because: `, error.message);
                }
              }
            
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr_number,
                  labels: [labelToAdd]
                });
                console.log(`Added ${labelToAdd} label to pull request ${pr_number}`);
              } catch (error) {
                console.log(`Could not add ${labelToAdd} label on ${owner}/${repo} pull request ${pr_number} because: `, error.message);
              }
            }
