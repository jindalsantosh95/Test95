info:
  name: Get Virgin Points
  type: http
  seq: 1
  tags:
    - Member Data

http:
  method: GET
  url: "{{baseUrl}}/{{memberNumber}}/VirginPoints"
  headers:
    - name: Accept
      value: application/json
    - name: x-correlation-id
      value: "VRED-Bruno-{{$randomUUID}}"
    - name: api-channel
      value: Bruno
    - name: Authorization
      value: "Bearer {{accessToken}}"
      disabled: true
    - name: Ocp-Apim-Subscription-Key
      value: "{{ocpApimSubscriptionKey}}"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
