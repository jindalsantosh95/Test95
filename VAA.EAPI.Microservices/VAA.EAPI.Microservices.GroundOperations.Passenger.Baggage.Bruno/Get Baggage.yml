info:
  name: Get Baggage Allowance
  type: http
  seq: 2

http:
  method: GET
  url: "{{baggagems}}/GetBaggage/{{travelPartyId}}?hidePaidBaggage=false"
  headers:
    - name: ocp-apim-subscription-key
      value: "{{baggagems_ocp}}"
  params:
    - name: hidePaidBaggage
      value: "false"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();
        var passenger1 = body.passengers && body.passengers[0];

        if (!passenger1 || !passenger1.baggageOffers) {
          console.log("No baggage offer was returned for the first passenger.");
        } else {
          bru.setVar("passengerNiN", passenger1.passengerNiN);

          var firstFreeBags = passenger1.baggageOffers.find(function (baggage) {
            return baggage.price.amount === 0;
          });

          if (firstFreeBags) {
            bru.setVar("1stFreeBaggageOfferId", firstFreeBags.baggageOfferId);
            bru.setVar("1stFreeBaggageCount", Number(firstFreeBags.baggageCount));
            bru.setVar("1stFreeBaggagePrice", parseFloat(firstFreeBags.price.amount));
            bru.setVar("1stFreeBaggageCurrency", firstFreeBags.price.currency);
          }

          var firstPaidBags = passenger1.baggageOffers.find(function (baggage) {
            return baggage.price.amount > 0;
          });

          if (firstPaidBags) {
            bru.setVar("1stPaidBaggageOfferId", firstPaidBags.baggageOfferId);
            bru.setVar("1stPaidBaggageCount", Number(firstPaidBags.baggageCount));
            bru.setVar("1stPaidBaggagePrice", parseFloat(firstPaidBags.price.amount));
            bru.setVar("1stPaidBaggageCurrency", firstPaidBags.price.currency);
          }

          var selectedBaggageOffer = firstPaidBags || firstFreeBags;

          if (selectedBaggageOffer) {
            var currencyCode = selectedBaggageOffer.price.currency;
            var currencyNumber;

            if (currencyCode === "GBP") {
              currencyNumber = 826;
            } else if (currencyCode === "USD") {
              currencyNumber = 840;
            }

            var totalPrice = parseFloat(selectedBaggageOffer.price.amount);

        bru.setVar("baggageOfferId", selectedBaggageOffer.baggageOfferId);
        bru.setVar("baggageCount", Number(selectedBaggageOffer.baggageCount));
        bru.setVar("totalPrice", totalPrice);
        bru.setVar("currencyCode", currencyCode);
        bru.setVar("currencyNumber", currencyNumber);
        bru.setVar(
          "decimalPrecisionCount",
          selectedBaggageOffer.price.decimalPrecisionCount || 0
        );

        bru.setVar("totalBagPaymentPrice", totalPrice * totalPrice);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
