info:
  name: Payment Details
  type: http
  seq: 6

http:
  method: GET
  url: "{{paymentms}}/paymentDetails/{{paymentReferenceId}}"
  headers:
    - name: ocp-apim-subscription-key
      value: "{{paymentms_ocp}}"
    - name: channel
      value: DFMOBILE
    - name: formOfPayment
      value: Card
    - name: api-channel
      value: DFMOBILE
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var body = res.getBody();

        var paymentDetails = body.paymentDetails && body.paymentDetails[0];

        if (!paymentDetails) {
          console.log("No payment details found in response.");
        } else {
          // Payment reference
          bru.setVar("paymentReferenceId", body.paymentReferenceId);

          // Card holder details
          var cardMethod = paymentDetails.cardMethod;
          var payer = paymentDetails.payer;

          if (payer) {
            bru.setVar("cardHolderFirstName", payer.firstName);
            bru.setVar("cardHolderLastName", payer.lastName);
          }

          if (cardMethod) {
            bru.setVar("cardType", cardMethod.cardType);
            // Do not populate/store PAN or CVV from API responses. Provide cardNumber/cardVerificationValue manually if required.

            // expiryDate is in MM-YY format, e.g. 01-30
            if (cardMethod.expiryDate) {
              var expiryParts = cardMethod.expiryDate.split("-");

              if (expiryParts.length === 2) {
                bru.setVar("expiryMonth", expiryParts[0]);
                bru.setVar("expiryYear", expiryParts[1]);
              }
            }
          }

          // Billing address
          var billingAddress = paymentDetails.billingAddress;

          if (billingAddress) {
            bru.setVar("addressLine1", billingAddress.addressLine1);
            bru.setVar("addressLine2", billingAddress.addressLine2);
            bru.setVar("city", billingAddress.city);
            bru.setVar("country", billingAddress.country);
            bru.setVar("postalCode", billingAddress.postalCode);
          }

          // Payment details
          var amount = paymentDetails.amount;

          if (amount) {
            bru.setVar("totalPrice", amount.monetaryAmount);
            bru.setVar("decimalPrecisionCount", amount.decimalPrecisionCount);
            bru.setVar("currencyCode", amount.baseCurrency);
          }

          console.log("Payment details populated successfully.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
