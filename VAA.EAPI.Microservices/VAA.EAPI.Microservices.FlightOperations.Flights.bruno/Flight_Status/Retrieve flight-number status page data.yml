info:
  name: Retrieve flight-number status page data
  type: http
  seq: 2
  tags:
    - Flight_Status

http:
  method: GET
  url: "{{baseUrl}}/flightstatus/flights/:flightNumber/:departureDate"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: departureAirportCode
      value: LHR
      type: query
    - name: selectedLegId
      value: "1"
      type: query
    - name: flightNumber
      value: "0091"
      type: path
    - name: departureDate
      value: "{{flightStatusDate}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
