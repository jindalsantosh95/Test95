info:
  name: Retrieve flight operation schedule Information
  type: http
  seq: 2
  tags:
    - Flights_Microservice

http:
  method: POST
  url: "{{baseUrl}}/operationalschedule"
  body:
    type: json
    data: |-
      {
        "airlineCode": "",
        "flightNumber": 0,
        "localDateFrom": "",
        "localDateTo": "",
        "direction": "",
        "limit": 0,
        "originAirportCode": "",
        "destinationAirportCode": ""
      }
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://login.microsoft.com/6bdfd5a8-531f-4f14-9af1-dc7b444c3ad8/oauth2/v2.0/token
    refreshTokenUrl: "{{oauth_refresh_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
      clientSecret: "{{oauth_client_secret}}"
      placement: header
    scope: https://VirginAtlantic365.onmicrosoft.com/5b7feac5-d831-4988-93e5-5f85a80e1c9f/User_impersonation
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

