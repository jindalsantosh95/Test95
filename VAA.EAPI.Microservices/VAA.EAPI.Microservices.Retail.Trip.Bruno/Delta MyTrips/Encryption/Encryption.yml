info:
  name: Encryption
  type: http
  seq: 5

http:
  method: POST
  url: "{{delta_encryption}}/{{reservationResourceId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: channelId
      value: DC
    - name: transactionId
      value: NGT-MyTrips-{{$randomUUID}}
