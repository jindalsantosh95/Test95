opencollection: 1.0.0

info:
  name: Delta MyTrips
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{delta_token}}"
    credentials:
      clientId: "{{ping_client_id}}"
      clientSecret: "{{delta_mytrips_client_secret}}"
      placement: body
    scope: read
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
  variables:
    - name: ping_auth_token
      value: ""
    - name: DeltaToken
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
