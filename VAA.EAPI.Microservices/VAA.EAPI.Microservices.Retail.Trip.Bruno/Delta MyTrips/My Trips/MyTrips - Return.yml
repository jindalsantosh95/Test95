info:
  name: MyTrips - Return
  type: http
  seq: 4

http:
  method: POST
  url: "{{delta_mytrips}}"
  headers:
    - name: transactionid
      value: "{{$randomUUID}}"
    - name: channelid
      value: MyTrips
    - name: appid
      value: DC
    - name: x-air4_mytrips_test
      value: "{{appname_test}}"
  body:
    type: json
    data: "{\r

      \  \"using\": \"CONFIRMATION\",\r

      \  \"confirmationNum\": \"DBBX4U\",\r

      \  \"ticketNum\": \"\",\r

      \  \"creditCardNum\": \"\",\r

      \  \"loyaltyNum\": \"\",\r

      \  \"givenNames\": \"FirstDCWfy\",\r

      \  \"surname\": \"LastpBDHD\",\r

      \  \"departureAirportCode\": \"\"\r

      }\r

      \r\n"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "let responseData = res.getBody();\r

        bru.setEnvVar(\"reservationResourceId\", responseData.travelReservations[0].reservationResourceId);\r

        bru.setEnvVar(\"passengerResourceId\", responseData.travelReservations[0].passengers[0].passengerResourceId);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
