info:
  name: MyTrips-using PNRnumber
  type: http
  seq: 1

http:
  method: POST
  url: "{{delta_mytrips}}"
  headers:
    - name: transactionid
      value: "{{$randomUUID}}"
    - name: channelid
      value: MyTrips
      disabled: true
    - name: appid
      value: DC
      disabled: true
    - name: x-air4_mytrips_test
      value: "{{appname_test}}"
    - name: channelid
      value: DFMOBILE
    - name: appid
      value: D2
  body:
    type: json
    data: |-
      {
          "using": "CONFIRMATION",
          "confirmationNum": "{{pnr}}",
          "givenNames": "{{givenNames}}",
          "surname": "{{surname}}",
          "ticketNum": "",
          "creditCardNum": "",
          "loyaltyNum": "",   
          "departureAirportCode": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "let responseData = res.getBody();\r

        bru.setEnvVar(\"reservationResourceId\", responseData.travelReservations[0].reservationResourceId);\r

        bru.setEnvVar(\"passengerResourceId\", responseData.travelReservations[0].passengers[0].passengerResourceId);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
