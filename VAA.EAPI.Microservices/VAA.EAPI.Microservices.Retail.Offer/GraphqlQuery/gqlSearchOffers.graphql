        originAirportCode
        originCityCode
        scheduledArrivalLocalTs
        scheduledDepartureLocalTs
        stopCnt
        pendingGovtApproval
        totalAirTime {
          dayCnt
          hourCnt
          minuteCnt
        }
        flightSegmentId
      }
    }
    errors {
      code
      developerMessage
      message
      moreInfo {
        callbackId
        callbackInSecs
        code
        field
        message
      }
    }
  }
}