info:
  name: Compile Deployment Status For Pipeline
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/deploymentstatus/compile/pipeline"
  headers:
    - name: Ocp-Apim-Subscription-Key
      value: "{{ocpkey}}"
  body:
    type: json
    data: |-
      {
        "pipelineId": 123,
        "pipelineName": "Pipeline name"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
