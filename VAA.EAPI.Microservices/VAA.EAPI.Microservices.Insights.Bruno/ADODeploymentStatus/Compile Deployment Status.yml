info:
  name: Compile Deployment Status
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/deploymentstatus/compile"
  headers:
    - name: Ocp-Apim-Subscription-Key
      value: "{{ocpkey}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
