info:
  name: Microservice
  type: folder
  seq: 2

request:
  headers:
    - name: Ocp-Apim-Subscription-Key
      value: "{{Ocp-Apim-Subscription-Key}}"
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://login.microsoftonline.com/6bdfd5a8-531f-4f14-9af1-dc7b444c3ad8/oauth2/token
    credentials:
      clientId: "{{clientId}}"
      clientSecret: "{{clientSecret}}"
      placement: body
    additionalParameters:
      accessTokenRequest:
        - name: resource
          placement: body
          value: "{{addressAppId}}"
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
