info:
  name: Start Check In
  type: http
  seq: 1

http:
  method: POST
  url: "{{checkinms}}/CheckIn"
  headers:
    - name: ocp-apim-subscription-key
      value: "{{checkinms_ocp}}"
  body:
    type: json
    data: "{\r

      \    \"pnrLocator\": \"{{pnrLocator}}\",\r

      \    \"originCode\": \"{{origin}}\",\r

