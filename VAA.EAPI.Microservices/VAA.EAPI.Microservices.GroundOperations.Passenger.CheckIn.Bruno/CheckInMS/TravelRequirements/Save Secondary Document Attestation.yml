info:
  name: Save Secondary Document Attestation
  type: http
  seq: 7

http:
  method: POST
  url: "{{checkinms}}/TravelRequirements/SaveSecondaryDocumentAttestation"
  headers:
    - name: ocp-apim-subscription-key
      value: "{{checkinms_ocp}}"
  body:
    type: json
    data: |-
      {
          "requirementsId": "{{requirementsId}}",
          "passengerId": "{{pax1_id}}",
          "sliceId": "{{slice1_id}}",
          "secondaryDocumentId": "{{secondaryDocumentId}}",
          "countryCode": "{{secondaryDocumentCountryCode}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var json = res.getBody();

        if (json?.requirementsId) {
          bru.setVar("requirementsId", json.requirementsId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
