info:
  name: Save Return Date
  type: http
  seq: 3

http:
  method: POST
  url: "{{checkinms}}/TravelRequirements/SaveReturnDate"
  headers:
    - name: ocp-apim-subscription-key
      value: "{{checkinms_ocp}}"
  body:
    type: json
    data: |-
      {
          "requirementsId": "{{requirementsId}}",
          "passengerId": "{{pax1_id}}",
          "returnOn": "2027-10-01",
          "noReturnDate": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var json = res.getBody();

        if (json?.requirementsId) {
          bru.setVar("requirementsId", json.requirementsId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
