parameters:
  agentPool: ''
  agentSpecification: ''
  functionAppName_Secure: ''
  functionAppName_Public: ''  
  keyvaultName: ''
  AppInsightsName: ''
  appserviceplan: ''
  storageAccountName: ''
  storageAccountName_P: ''
  environment: ''
  location: ''
  resourceGroupName: ''
  serviceConnection: ''
  subscriptionId: ''
  pr_name: ''
  WEBSITE_DNS_ALT_SERVER: ''
  WEBSITE_DNS_SERVER: ''


jobs: 
- deployment: '${{parameters.pr_name}}'      
  
  pool:
    name: ${{parameters.agentPool}} 
    vmImage: ${{parameters.agentSpecification}}  
  
  environment: ${{parameters.environment}}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          artifact: drop      

        # Task to create the GraphQL (Secure) Function App     
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Create ${{parameters.functionAppName_Secure}} Function App'
          inputs:
            azureResourceManagerConnection: ${{parameters.serviceConnection}}
            subscriptionid: ${{parameters.subscriptionId}}
            resourceGroupName:  ${{parameters.resourceGroupName}}
            location:  ${{parameters.location}}
            csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy_slot.json
            csmParametersFile: $(Pipeline.workspace)/drop/Parameters/dev-azuredeploy.parameters.json
            deploymentMode: 'Incremental'
            overrideParameters: -AppSetting:OperationsVisibilityMode Secure -FunctionAppName ${{parameters.functionAppName_Secure}} -AppServicePlanName ${{parameters.appserviceplan}} -AppInsightsName ${{parameters.AppInsightsName}} -vaultName ${{parameters.keyvaultName}} -storageAccountName ${{parameters.storageAccountName}} -WEBSITE_DNS_ALT_SERVER ${{parameters.WEBSITE_DNS_ALT_SERVER}} -WEBSITE_DNS_SERVER ${{parameters.WEBSITE_DNS_SERVER}}

        # Task to deploy to the GraphQL (Secure) Function App
        - task: AzureFunctionApp@1
          displayName: 'Deploy to ${{parameters.functionAppName_Secure}} Function App' 
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            appType: 'functionApp'
            appName: ${{parameters.functionAppName_Secure}}
            resourceGroupName: ${{parameters.resourceGroupName}}
            package: '$(Pipeline.workspace)/drop/*.zip'
            deploymentMethod: 'runFromPackage' 
            deployToSlotOrASE: true                
            slotName: DS

        
        # Task to Start the Slot Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start Azure App Service (Slot): ${{parameters.functionAppName_Secure}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Azure App Service'
            WebAppName: ${{parameters.functionAppName_Secure}}
            resourceGroupName:  ${{parameters.resourceGroupName}}            
            SpecifySlotOrASE: true
            Slot: DS  

        # Task to Start Swap with Preview in Prod Function App
        - task: AzureAppServiceManage@0
          displayName: Start Swap with Preview'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Swap With Preview'
            WebAppName: ${{parameters.functionAppName_Secure}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SourceSlot: DS
            PreserveVnet: true

        # Task to Complete the Swap with Prod Function App
        - task: AzureAppServiceManage@0
          displayName: 'Complete Swap slot to Env'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Complete Swap'
            WebAppName: ${{parameters.functionAppName_Secure}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SourceSlot: DS
            PreserveVnet: true

        # Task to Stop the Slot Function App
        - task: AzureAppServiceManage@0
          displayName: 'Stop Azure App Service (Slot): ${{parameters.functionAppName}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Stop Azure App Service'
            WebAppName: ${{parameters.functionAppName_Secure}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SpecifySlotOrASE: true
            Slot: DS

        

        # Task to create the GraphQL (Public) Function App      
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Create ${{parameters.functionAppName_Public}} Function App'
          inputs:
            azureResourceManagerConnection: ${{parameters.serviceConnection}}
            subscriptionid: ${{parameters.subscriptionId}}
            resourceGroupName:  ${{parameters.resourceGroupName}}
            location:  ${{parameters.location}}
            csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy_slot.json
            csmParametersFile: $(Pipeline.workspace)/drop/Parameters/dev-azuredeploy.parameters.json
            deploymentMode: 'Incremental'
            overrideParameters: -AppSetting:OperationsVisibilityMode Public -FunctionAppName ${{parameters.functionAppName_Public}} -AppServicePlanName ${{parameters.appserviceplan}} -AppInsightsName ${{parameters.AppInsightsName}} -vaultName ${{parameters.keyvaultName}} -storageAccountName ${{parameters.storageAccountName_P}} -WEBSITE_DNS_ALT_SERVER ${{parameters.WEBSITE_DNS_ALT_SERVER}} -WEBSITE_DNS_SERVER ${{parameters.WEBSITE_DNS_SERVER}}

        # Task to deploy to the GraphQL (Public) Function App
        - task: AzureFunctionApp@1
          displayName: 'Deploy to ${{parameters.functionAppName_Public}} Function App' 
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            appType: 'functionApp'
            appName: ${{parameters.functionAppName_Public}}
            resourceGroupName: ${{parameters.resourceGroupName}}
            package: '$(Pipeline.workspace)/drop/*.zip'
            deploymentMethod: 'runFromPackage' 
            deployToSlotOrASE: true                
            slotName: DS

        
        # Task to Start the Slot Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start Azure App Service (Slot): ${{parameters.functionAppName_Public}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Azure App Service'
            WebAppName: ${{parameters.functionAppName_Public}}
            resourceGroupName:  ${{parameters.resourceGroupName}}            
            SpecifySlotOrASE: true
            Slot: DS  

        # Task to Start Swap with Preview in Prod Function App
        - task: AzureAppServiceManage@0
          displayName: Start Swap with Preview'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Swap With Preview'
            WebAppName: ${{parameters.functionAppName_Public}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SourceSlot: DS
            PreserveVnet: true

        # Task to Complete the Swap with Prod Function App
        - task: AzureAppServiceManage@0
          displayName: 'Complete Swap slot to Env'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Complete Swap'
            WebAppName: ${{parameters.functionAppName_Public}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SourceSlot: DS
            PreserveVnet: true

        # Task to Stop the Slot Function App
        - task: AzureAppServiceManage@0
          displayName: 'Stop Azure App Service (Slot): ${{parameters.functionAppName_Public}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Stop Azure App Service'
            WebAppName: ${{parameters.functionAppName_Public}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SpecifySlotOrASE: true
            Slot: DS