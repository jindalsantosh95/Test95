parameters: 
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''
  testRepoPath: ''
  RestoreBuildProjects: '**/*.csproj'

jobs: 
  - job: 'SanityTesting'
    displayName: 'Sanity Testing'
    pool:
      name: ${{parameters.agentPool}}
      vmImage: ${{parameters.agentSpecification}}
    steps:
      # Task to checkout the repository
      - checkout: 'git://Enterprise API Management Team/${{parameters.testRepoPath}}'
        displayName: 'Checkout Testing Repository'
    
      # Task to restore the project
      - task: DotNetCoreCLI@2
        displayName: 'Restore Project'
        inputs:
          command: restore
          projects: '${{parameters.RestoreBuildProjects}}'

      # Task to build the project
      - task: DotNetCoreCLI@2
        displayName: 'Build Project'
        inputs:
          command: build
          projects: '${{parameters.RestoreBuildProjects}}'
          arguments: '--configuration $(BuildConfiguration) --no-restore'

      # Task to publish the project
      - task: DotNetCoreCLI@2
        displayName: 'Publish Project'
        inputs:
          command: publish
          publishWebProjects: false
          projects: '${{parameters.RestoreBuildProjects}}'
          arguments: '--configuration $(BuildConfiguration) --output $(build.ArtifactStagingDirectory) --no-build'
          zipAfterPublish: false
          modifyOutputPath: false

      # task to publish build artifacts to Azure Pipelines 
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifacts' 
        inputs:
          PathtoPublish: '$(build.ArtifactStagingDirectory)'
          condition: succeededOrFailed() 

      # task to perform the sanity test 
      - task: VSTest@2
        displayName: 'Sanity Test' 
        inputs:
          testAssemblyVer2: |
            **\*VAA.VEAPI.API.Tests.Core.dll
            !**\*TestAdapter.dll
            !**\obj\**
          testFiltercriteria: 'TestCategory=Sanity'
          failOnMinTestsNotRun: false
          searchFolder: '$(System.DefaultWorkingDirectory)'