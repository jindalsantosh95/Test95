parameters:
  agentPool: ''
  agentSpecification: ''
  applicationName: ''
  functionAppName: ''
  functionAppName_D: ''  
  keyvaultName: ''
  AppInsightsName: ''
  appserviceplan: ''
  appserviceplan_D: ''
  storageAccountName: ''
  environment: ''
  location: ''
  resourceGroupName: ''
  resourceGroupName_D: ''
  serviceConnection: ''
  serviceConnection_D: ''
  subscriptionId: ''
  subscriptionId_D: ''
  pr_name: ''
  APIM_IP: ''
  WEBSITE_DNS_ALT_SERVER: ''
  WEBSITE_DNS_SERVER: ''

jobs: 
- deployment: '${{parameters.pr_name}}'      
  
  pool:
    name: ${{parameters.agentPool}} 
    vmImage: ${{parameters.agentSpecification}}  
  
  environment: ${{parameters.environment}}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          artifact: drop      

        # Task to create the Function App- Legacy     
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Create ${{parameters.functionAppName}} Function App'
          inputs:
            azureResourceManagerConnection: ${{parameters.serviceConnection}}
            subscriptionid: ${{parameters.subscriptionId}}
            resourceGroupName:  ${{parameters.resourceGroupName}}
            location:  ${{parameters.location}}
            csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy_slot.json
            csmParametersFile: $(Pipeline.workspace)/drop/Parameters/${{parameters.environment}}-azuredeploy.parameters.json
            deploymentMode: 'Incremental'
            overrideParameters: -IPRestriction "${{parameters.APIM_IP}}" -Appsetting:WEBSITE_DNS_ALT_SERVER "${{parameters.WEBSITE_DNS_ALT_SERVER}}" -Appsetting:WEBSITE_DNS_SERVER "${{parameters.WEBSITE_DNS_SERVER}}"

            
        # Task to deploy application in the Slot Function App
        - task: AzureFunctionApp@1
          displayName: 'Deploy to ${{parameters.functionAppName}} Function App' 
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            appType: 'functionApp'
            appName: ${{parameters.functionAppName}}
            resourceGroupName: ${{parameters.resourceGroupName}}
            package: '$(Pipeline.workspace)/drop/*.zip'
            deploymentMethod: 'runFromPackage' 
            deployToSlotOrASE: true                
            slotName: DS

        
        # Task to Start the Slot Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start Azure App Service (Slot): ${{parameters.functionAppName}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Azure App Service'
            WebAppName: ${{parameters.functionAppName}}
            resourceGroupName:  ${{parameters.resourceGroupName}}            
            SpecifySlotOrASE: true
            Slot: DS  

        # Task to Start Swap with Preview in Prod Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start Swap with Preview'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Swap With Preview'
            WebAppName: ${{parameters.functionAppName}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SourceSlot: DS
            PreserveVnet: true

        # Task to Complete the Swap with Prod Function App
        - task: AzureAppServiceManage@0
          displayName: 'Complete Swap slot to Env'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Complete Swap'
            WebAppName: ${{parameters.functionAppName}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SourceSlot: DS
            PreserveVnet: true

        # Task to Stop the Slot Function App
        - task: AzureAppServiceManage@0
          displayName: 'Stop Azure App Service (Slot): ${{parameters.functionAppName}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Stop Azure App Service'
            WebAppName: ${{parameters.functionAppName}}
            resourceGroupName:  ${{parameters.resourceGroupName}} 
            SpecifySlotOrASE: true
            Slot: DS

        

        # Task to create the Function App - Digital 
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Create ${{parameters.functionAppName_D}} Function App'
          inputs:
            azureResourceManagerConnection: ${{parameters.serviceConnection_D}}
            subscriptionid: ${{parameters.subscriptionId_D}}
            resourceGroupName:  ${{parameters.resourceGroupName_D}}
            location:  ${{parameters.location}}
            csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy_digital.json
            csmParametersFile: $(Pipeline.workspace)/drop/Parameters/${{parameters.environment}}-digital-azuredeploy.parameters.json
            deploymentMode: 'Incremental' 

        # Task to stop the Function App
        - task: AzureAppServiceManage@0
          displayName: 'Stop Azure App Service: ${{parameters.functionAppName_D}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection_D}}
            Action: 'Stop Azure App Service'
            WebAppName: ${{parameters.functionAppName_D}}

        # Task to deploy the Function App
        - task: AzureFunctionApp@1
          displayName: 'Deploy to Function APP' 
          inputs:
            azureSubscription: ${{parameters.serviceConnection_D}}
            appType: 'functionApp'
            appName: ${{parameters.functionAppName_D}}
            deployToSlotOrASE: true
            resourceGroupName: ${{parameters.resourceGroupName_D}}
            package: '$(Pipeline.workspace)/drop/*.zip'
            deploymentMethod: 'runFromPackage'     

        # Task to start the Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start Azure App Service: ${{parameters.functionAppName_D}}'
          inputs:
            azureSubscription: ${{parameters.serviceConnection_D}}
            Action: 'Start Azure App Service'
            WebAppName: ${{parameters.functionAppName_D}}
    