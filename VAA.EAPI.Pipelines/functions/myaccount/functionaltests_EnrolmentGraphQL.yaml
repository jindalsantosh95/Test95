parameters: 
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''
  testRepoPath: 'Enterprise Microservices'
  rootPath: ''
  sanityrootpath: 'VAA.EAPI.Automation'
  RestoreBuildProjects: '**/*.csproj'
  variableGroupName: ''
  environment: ''

jobs: 
  - job: 'SanityTesting'
    displayName: 'Myaccount Sanity Testing'
    
    pool:
      name: ${{parameters.agentPool}}
      vmImage: ${{parameters.agentSpecification}}
    variables:
      - group: ${{parameters.variableGroupName}}
    steps:
      # Task to checkout the repository
      - checkout: 'self'
        displayName: 'Checkout Testing Repository'

      # Task to install DotNet Core SDK
      - task: UseDotNet@2
        displayName: 'Install DotNet Core SDK' 
        inputs:
          packageType: 'sdk'
          version: '10.0.x'
    
      # Task to build the project
      - task: DotNetCoreCLI@2
        displayName: 'Build Project'
        inputs:
          command: build
          projects: '${{parameters.sanityrootpath}}/VAA.EAPI.Automation.MyAccount/VAA.EAPI.Automation.MyAccount.csproj'
         # arguments: '--configuration $(BuildConfiguration) --no-restore'

      #Trips Gql testing
      - task: VSTest@2
        displayName: 'Myaccount-GraphQL-TestSuite'
        inputs:
          testAssemblyVer2: | 
            **\VAA.EAPI.Automation.MyAccount.dll
          testFiltercriteria: 'Category=EnrolmentGraphQL-Regression'
          testRunTitle: 'Trips-GraphQL-TestSuite'
          rerunFailedTests: true
          rerunType: basedOnTestFailureCount
          rerunMaxAttempts: 2
        continueOnError: true
