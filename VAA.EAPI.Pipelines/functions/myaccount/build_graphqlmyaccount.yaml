parameters:   
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''  
  rootPath: ''
  subRootPath: ''
  applicationName: ''
  SPECTRAL_DSN: ''
  SPECTRAL_KEY: ''
  deploymentroot: 'VAA.EAPI.GraphQL'

stages: 
  - stage: 'Build'
    jobs: 
      - job: 'Build'
        displayName: 'Build'  
        pool:
          name: ${{parameters.agentPool}} 
          vmImage: ${{parameters.agentSpecification}} 
                
        steps:
          # Task to install DotNet Core SDK
          - task: UseDotNet@2
            displayName: 'Install DotNet Core SDK' 
            inputs:
              packageType: 'sdk'
              version: '10.0.x'
          
          # Task to build projects
          - task: DotNetCoreCLI@2
            displayName: 'Build GraphQL function project'
            inputs:
              command: 'build'
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Account.csproj
                **/${{parameters.deploymentroot}}.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}}'

            #Task to build & run unit test
          - task: DotNetCoreCLI@2
            displayName: 'Build & run unit tests'
            inputs:
              command: 'test'
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Account.Tests.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}} --collect "XPlat Code coverage"'


          # Task to Install Report Generator Tool
          #- script: 'dotnet tool install --global dotnet-reportgenerator-globaltool --version 4.5.8'
          #  displayName: 'Install ReportGenerator tool'

          # Task to Create Reports
          #- script: 'reportgenerator -reports:$(Agent.TempDirectory)/**/coverage.cobertura.xml -targetdir:$(Build.SourcesDirectory)/coverlet/reports -filefilters:-*VAA.EAPI.Common*;-*VAA.EAPI.Domain*;-*VAA.EAPI.Infrastructure* -classfilters:-*WesalServiceReference.* -reporttypes:"cobertura"'
          #  displayName: 'Create reports'
            
          # Task to Publish Code Coverage
          #- task: PublishCodeCoverageResults@1
          #  displayName: 'Publish code coverage'
          #  inputs: 
          #    codecoverageTool: cobertura
          #    summaryFileLocation: '$(Build.SourcesDirectory)/coverlet/reports/Cobertura.xml'

          # Task to publish the project
          - task: DotNetCoreCLI@2
            displayName: 'Publish Project'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: |
                **/${{parameters.deploymentroot}}.Domain.Account.csproj
                **/${{parameters.deploymentroot}}.csproj
              arguments: '--configuration ${{parameters.buildConfiguration}} --output $(build.ArtifactStagingDirectory)'
              zipAfterPublish: false

          # Task to create merge folder
          - script: 'mkdir  $(Build.ArtifactStagingDirectory)\merge'
            displayName: 'Create merge folder to combine packages'
            
          # Task to copy build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy build output to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Account
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to copy graphQL build output to merge folder
          - task: CopyFiles@2
            displayName: 'Copy GraphQL to merge folder'
            inputs:
              SourceFolder: $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}
              TargetFolder: $(Build.ArtifactStagingDirectory)\merge
              OverWrite: true

          # Task to create creake package, zip file
          - task: ArchiveFiles@2
            displayName: 'Package build outputs'
            inputs:
              rootFolderOrFile:  $(Build.ArtifactStagingDirectory)\merge
              includeRootFolder: false
              archiveType: 'zip' 
              archiveFile: '$(Build.ArtifactStagingDirectory)/${{parameters.deploymentroot}}.zip' 

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\merge'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\merge'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Account'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}.Domain.Account'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to delete merge folder
          - task: DeleteFiles@1
            displayName: 'Remove $(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}'
            inputs:
              SourceFolder: '$(Build.ArtifactStagingDirectory)\${{parameters.deploymentroot}}'
              Contents: '*'
              RemoveSourceFolder: true
              RemoveDotFiles: true

          # Task to copy the ARM files to artifactstagingdirectory
          - task: CopyFiles@2
            displayName: 'Copy ARM Files'
            inputs:
              SourceFolder: '${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment'
              TargetFolder: '$(build.ArtifactStagingDirectory)'

          # task to publish build artifacts to Azure Pipelines 
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts' 
            inputs:
              PathtoPublish: $(build.ArtifactStagingDirectory)
              ArtifactName: 'drop' 
              publishLocation: 'Container'

          # task to validate the DEV ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - DEV'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_DEV}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Template/azuredeploy.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Parameters/dev-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the SIT ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - SIT'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_SIT}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Template/azuredeploy.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Parameters/sit-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the UAT ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - UAT'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_UAT}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Template/azuredeploy.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Parameters/uat-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the PROD ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - PROD'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_Prod}}
              subscriptionId: ${{parameters.subscriptionId_Prod}}
              resourceGroupName: ${{parameters.resourceGroupName_PROD}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Template/azuredeploy.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Parameters/prod-azuredeploy.parameters.json
              deploymentMode: Validation