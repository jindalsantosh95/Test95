    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_slot_test5.yaml
        parameters:
          functionAppName: ${{parameters.functionAppName_DT1}}     
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}
          environment: PR
