          appserviceplan: ${{parameters.appserviceplan_DT1}}    
          resourceGroupName: ${{parameters.resourceGroupName_DT1}}       
          serviceConnection: ${{parameters.serviceConnection_NonProd}}
          subscriptionId: ${{parameters.subscriptionId_NonProd}}  
          AppInsightsName: ${{parameters.AppInsightsName_DT1}}
