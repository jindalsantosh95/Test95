parameters:
  agentPool: ''
  agentSpecification: ''
  functionAppName_Secure: ''
  functionAppName_Public: ''  
  AppInsightsName: ''
  appserviceplan: ''
  storageAccountName: ''
  storageAccountName_P: ''
  environment: ''
  location: ''
  resourceGroupName: ''
  serviceConnection: ''
  subscriptionId: ''
  pr_name: ''
  WEBSITE_DNS_ALT_SERVER: ''
  WEBSITE_DNS_SERVER: ''


jobs: 
- deployment: '${{parameters.pr_name}}'      
  
  pool:
    name: ${{parameters.agentPool}} 
    vmImage: ${{parameters.agentSpecification}}  
  
  environment: ${{parameters.environment}}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          artifact: drop      

        # Task to create the GraphQL (Secure) Function App     
        - task: AzureResourceManagerTemplateDeployment@3
          displayName: 'Create ${{parameters.functionAppName_Secure}} Function App'
          inputs:
            azureResourceManagerConnection: ${{parameters.serviceConnection}}
            subscriptionid: ${{parameters.subscriptionId}}
            resourceGroupName:  ${{parameters.resourceGroupName}}
            location:  ${{parameters.location}}
            csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy.json
            csmParametersFile: $(Pipeline.workspace)/drop/Parameters/dev-azuredeploy.parameters.json
            deploymentMode: 'Incremental'
            overrideParameters: -FunctionAppName ${{parameters.functionAppName_Secure}} -storageAccountName ${{parameters.storageAccountName}} -AppServicePlanName ${{parameters.appserviceplan}} -AppInsightsName ${{parameters.AppInsightsName}} -vaultName ${{parameters.keyvaultName}} -ServerFarmIdRg ${{parameters.resourceGroupName}} -WEBSITE_DNS_ALT_SERVER ${{parameters.WEBSITE_DNS_ALT_SERVER}} -WEBSITE_DNS_SERVER ${{parameters.WEBSITE_DNS_SERVER}}

        # Task to stop the GraphQL (Secure) Function App
        - task: AzureAppServiceManage@0
          displayName: 'Stop ${{parameters.functionAppName_Secure}} Function App'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Stop Azure App Service'
            WebAppName: ${{parameters.functionAppName_Secure}}

        # Task to deploy to the GraphQL (Secure) Function App
        - task: AzureFunctionApp@1
          displayName: 'Deploy to ${{parameters.functionAppName_Secure}} Function App' 
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            appType: 'functionApp'
            appName: ${{parameters.functionAppName_Secure}}
            deployToSlotOrASE: true
            resourceGroupName: ${{parameters.resourceGroupName}}
            package: '$(Pipeline.workspace)/drop/*.zip'
            deploymentMethod: 'runFromPackage'     

        # Task to start the GraphQL (Secure) Function App
        - task: AzureAppServiceManage@0
          displayName: 'Start ${{parameters.functionAppName_Secure}} Function App'
          inputs:
            azureSubscription: ${{parameters.serviceConnection}}
            Action: 'Start Azure App Service'
            WebAppName: ${{parameters.functionAppName_Secure}}
