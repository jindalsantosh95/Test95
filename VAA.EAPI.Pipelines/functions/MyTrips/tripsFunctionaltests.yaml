parameters: 
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''
  testRepoPath: 'Enterprise Microservices'
  rootPath: ''
  sanityrootpath: 'VAA.EAPI.Automation'
  RestoreBuildProjects: '**/*.csproj'
  variableGroupName: ''
  environment: ''

jobs: 
  - job: 'SanityTesting'
    displayName: 'Trips Gql Sanity Testing'
    
    pool:
      name: ${{parameters.agentPool}}
      vmImage: ${{parameters.agentSpecification}}
    variables:
      - group: ${{parameters.variableGroupName}}
    steps:
      # Task to checkout the repository
      - checkout: 'self'
        displayName: 'Checkout Testing Repository'

      # Task to install DotNet Core SDK
      - task: UseDotNet@2
        displayName: 'Install DotNet Core SDK' 
        inputs:
          packageType: 'sdk'
          version: '10.0.x'
    
      # Task to build the project
      - task: DotNetCoreCLI@2
        displayName: 'Build Project'
        inputs:
          command: build
          projects: '${{parameters.sanityrootpath}}/VAA.EAPI.Automation.Trips/VAA.EAPI.Automation.Trips.csproj'
         # arguments: '--configuration $(BuildConfiguration) --no-restore'

      #Trips Gql testing
      - task: VSTest@2
        displayName: 'Trips-GraphQL-TestSuite'
        inputs:
          testAssemblyVer2: | 
            **\VAA.EAPI.Automation.Trips.dll
            **\*Tests.dll
            !**\obj\**
          testFiltercriteria: 'Category=RetrieveBookingMobile-Regression|Category=TravelChecklistMobile-Regression|Category=SpecialMealsMobile-Regression|Category=SpecialAssistanceMobile-Regression|Category=SeatMapMobile-Regression|Category=LoyaltyMobile-Regression|Category=SeatValidationsInBasketMS-Regression|Category=SelectFreeSeats-Regression|Category=ContentValidationsMobile-Regression|Category=UpsellMobile-Regression|Category=SelectPaidSeats-Regression|Category=SeatsErrorScenarios-Regression'
          testRunTitle: 'Trips-GraphQL-TestSuite'
          rerunFailedTests: true
          rerunType: basedOnTestFailureCount
          rerunMaxAttempts: 2
        continueOnError: true

      - task: PublishTestResults@2
        displayName: 'Publish Test Results **/Log_For_*.txt'
        inputs:
           testResultsFormat: XUnit
           testResultsFiles: '**/Log_For_*.txt'    

      - task: epsteam.EmailReportExtension.EmailReport.EmailReport@1
        displayName: 'Send Email Report Always'
        inputs:
          subject: '[{environmentStatus}] {passPercentage} GraphQL - $(env) STAGE | Graphql Trips Endpoint Tests passed post deployment'
          includeInToSectionStr: 2
          toAddress: 'vinay.dhawan@fly.virgin.com;rachana.srivastava@fly.virgin.com;santosh.jindal@fly.virgin.com;himani.saxena@fly.virgin.com;robert.hutson@fly.virgin.com'
          defaultDomain: VirginAtlantic365.onmicrosoft.com
          includeCommits: false
          includeOthersInTotal: false
          includeResultsFromOtherJobs: false
          includeBuildSummary: false
          groupTestResultsBy: run
          maxTestFailuresToShow: 10
          enableTLS: true
          smtpConnectionEndpoint: EmailServices
