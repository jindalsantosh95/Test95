parameters:   
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''  
  rootPath: ''
  subRootPath: ''
  applicationName: ''
  SPECTRAL_DSN: ''
  SPECTRAL_KEY: ''


stages: 
  - stage: 'Build'
    jobs: 
      - job: 'Build'
        displayName: 'Build'  
        pool:
          name: ${{parameters.agentPool}} 
          vmImage: ${{parameters.agentSpecification}}         
          
        steps:
          
          # Task to install DotNet Core SDK
          - task: UseDotNet@2
            displayName: 'Install DotNet Core SDK' 
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          # Task to restore
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '${{parameters.rootPath}}/**/${{parameters.subRootPath}}.${{parameters.applicationName}}.csproj'
          
          # Task to build the project
          - task: DotNetCoreCLI@2
            displayName: 'Build Project'
            inputs:
              command: 'build'
              projects: '${{parameters.rootPath}}/**/${{parameters.subRootPath}}.${{parameters.applicationName}}.csproj'
              arguments: '--configuration ${{parameters.buildConfiguration}}'


          # Task to publish the project
          - task: DotNetCoreCLI@2
            displayName: 'Publish Project'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: |
                  ${{parameters.rootPath}}/**/${{parameters.subRootPath}}.${{parameters.applicationName}}.csproj
                  
                  
              arguments: '--configuration ${{parameters.buildConfiguration}} --output $(build.ArtifactStagingDirectory)'
              zipAfterPublish: true

          # Task to copy the ARM files to artifactstagingdirectory
          - task: CopyFiles@2
            displayName: 'Copy ARM Files'
            inputs:
              SourceFolder: '${{parameters.rootPath}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment'
              TargetFolder: '$(build.ArtifactStagingDirectory)'
 
          # task to publish build artifacts to Azure Pipelines 
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts' 
            inputs:
              PathtoPublish: '$(build.ArtifactStagingDirectory)'
              ArtifactName: 'drop' 
              publishLocation: 'Container'