parameters:
  agentPool: ''
  agentSpecification: ''
  applicationName: ''
  buildConfiguration: '' 
  location: ''
  functionAppName_Secure_DEV: ''
  functionAppName_Secure_SIT: ''
  functionAppName_Secure_UAT: ''
  functionAppName_Secure_PRD: ''
  functionAppName_Public_DEV: ''
  functionAppName_Public_SIT: ''
  functionAppName_Public_UAT: ''
  functionAppName_Public_PRD: ''
  AzureWebJobsStorage_DEV: ''
  AzureWebJobsStorage_SIT: ''
  AzureWebJobsStorage_UAT: ''
  AzureWebJobsStorage_PROD: ''  
  AzureWebJobsStorage_Secure_DEV: ''
  AzureWebJobsStorage_Secure_SIT: ''
  AzureWebJobsStorage_Secure_UAT: '' 
  AzureWebJobsStorage_Secure_PROD: ''
  AzureWebJobsStorage_Public_DEV: ''
  AzureWebJobsStorage_Public_SIT: ''
  AzureWebJobsStorage_Public_UAT: ''  
  AzureWebJobsStorage_Public_PROD: ''    
  WEBSITE_DNS_ALT_SERVER: ''
  WEBSITE_DNS_SERVER: ''
  VARIABLE_GROUP_NAME_SCHEMA: ''
  SLACK_API_TOKEN: ''
  SLACK_TITLE: ''
  AppInsightsName_DT5: ''
  appserviceplan_DT5: ''
  resourceGroupName_DT5: ''
  functionAppName_DT5: ''
  KeyvaultName_DT5: ''
  storageAccountName_DT5: ''
  storageAccountName_P_DT5: ''
  functionAppName_Secure_DT5: ''
  functionAppName_Public_DT5: ''

stages:

  - stage: 'PR_Test5'
    variables: 
    - template: /VAA.EAPI.Pipelines/variables/GraphQL.yaml
    displayName: 'Deployment - Test5' 
    condition: and(succeeded(),eq(variables['Build.Reason'], 'PullRequest'), ne(variables['System.PullRequest.PullRequestId'], 'Null'))
    dependsOn: build   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_graphqlstitch_Test5.yaml
        parameters:
          functionAppName_Secure: ${{parameters.functionAppName_Secure_DT5}}
          functionAppName_Public: ${{parameters.functionAppName_Public_DT5}}    
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}
          environment: Test5
          pr_name: PR_Test5
          location: ${{parameters.location}}    
          appserviceplan: ${{parameters.appserviceplan_DT5}}
          keyvaultName: ${{parameters.KeyvaultName_DT5}}      
          resourceGroupName: ${{parameters.resourceGroupName_DT5}}       
          serviceConnection: ${{variables.serviceConnection_DEV_SIT_UAT}}
          subscriptionId: ${{variables.subscriptionId_DEV_SIT_UAT}} 
          AppInsightsName: ${{parameters.AppInsightsName_DT5}}
          storageAccountName: ${{parameters.storageAccountName_DT5}}
          storageAccountName_P: ${{parameters.storageAccountName_P_DT5}}
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}

  - stage: 'DEV'
    variables: 
    - template: /VAA.EAPI.Pipelines/variables/GraphQL.yaml
    displayName: 'Deployment - DEV' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_graphqlfull.yaml   
        parameters:
          functionAppName_Secure: ${{parameters.functionAppName_Secure_DEV}}
          functionAppName_Public: ${{parameters.functionAppName_Public_DEV}}          
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}
          environment: ${{variables.environment_DEV}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName_DEV}}       
          serviceConnection: ${{variables.serviceConnection_DEV_SIT_UAT}}
          subscriptionId: ${{variables.subscriptionId_DEV_SIT_UAT}}   
          AppInsightsName: ${{parameters.AppInsightsName_DEV}} 
          AzureWebJobsStorage_Secure: ${{parameters.AzureWebJobsStorage_Secure_DEV}}  
          AzureWebJobsStorage_Public: ${{parameters.AzureWebJobsStorage_Public_DEV}}  
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}

  - stage: 'FullGql_SchemaValidation_DEV'
    displayName: 'FullGql_SchemaValidation_DEV' 
    dependsOn: DEV
    jobs:  
      - template: /VAA.EAPI.Pipelines/functions/functional_testing_SchemaValidation.yaml
        parameters:
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}
          buildConfiguration: ${{parameters.buildConfiguration}} 
          variableGroupName: ${{parameters.VARIABLE_GROUP_NAME_SCHEMA}}
          SLACK_API_TOKEN: ${{parameters.SLACK_API_TOKEN}}
          SLACK_TITLE: ${{parameters.SLACK_TITLE}}
   
 


  - stage: 'SIT'
    variables: 
    - template: /VAA.EAPI.Pipelines/variables/GraphQL.yaml
    displayName: 'Deployment - SIT' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.Pipelines/functions/deployment_graphqlfull.yaml   
        parameters:
          functionAppName_Secure: ${{parameters.functionAppName_Secure_SIT}}
          functionAppName_Public: ${{parameters.functionAppName_Public_SIT}}          
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}        
          environment: ${{variables.environment_SIT}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName_SIT}}        
          serviceConnection: ${{variables.serviceConnection_DEV_SIT_UAT}}
          subscriptionId: ${{variables.subscriptionId_DEV_SIT_UAT}} 
          AppInsightsName: ${{parameters.AppInsightsName_SIT}} 
          AzureWebJobsStorage_Secure: ${{parameters.AzureWebJobsStorage_Secure_SIT}}  
          AzureWebJobsStorage_Public: ${{parameters.AzureWebJobsStorage_Public_SIT}}   
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}
                                                  

  - stage: 'UAT'
    variables: 
    - template: /VAA.EAPI.Pipelines/variables/GraphQL.yaml
    displayName: 'Deployment - UAT' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.Pipelines/functions/deployment_graphqlfull.yaml   
        parameters:
          functionAppName_Secure: ${{parameters.functionAppName_Secure_UAT}}
          functionAppName_Public: ${{parameters.functionAppName_Public_UAT}}          
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}        
          environment: ${{variables.environment_UAT}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName_UAT}}        
          serviceConnection: ${{variables.serviceConnection_DEV_SIT_UAT}}
          subscriptionId: ${{variables.subscriptionId_DEV_SIT_UAT}}
          AppInsightsName: ${{parameters.AppInsightsName_UAT}} 
          AzureWebJobsStorage_Secure: ${{parameters.AzureWebJobsStorage_Secure_UAT}}  
          AzureWebJobsStorage_Public: ${{parameters.AzureWebJobsStorage_Public_UAT}} 
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}
                         
          
  - stage: 'PROD'
    variables: 
    - template: /VAA.EAPI.Pipelines/variables/GraphQL.yaml
    displayName: 'Deployment - PROD' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.Pipelines/functions/deployment_graphqlfull.yaml   
        parameters:
          functionAppName_Secure: ${{parameters.functionAppName_Secure_PRD}}
          functionAppName_Public: ${{parameters.functionAppName_Public_PRD}}          
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}        
          environment: ${{variables.environment_PROD}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName_PROD}}        
          serviceConnection: ${{variables.serviceConnection_PROD}}
          subscriptionId: ${{variables.subscriptionId_PROD}}       
          AppInsightsName: ${{parameters.AppInsightsName_PROD}} 
          AzureWebJobsStorage_Secure: ${{parameters.AzureWebJobsStorage_Secure_PROD}}  
          AzureWebJobsStorage_Public: ${{parameters.AzureWebJobsStorage_Public_PROD}}  
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}
                        