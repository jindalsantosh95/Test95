parameters:   
  agentPool: ''
  agentSpecification: ''
  buildConfiguration: ''  
  rootPath: ''
  subRootPath: ''
  applicationName: ''
  SPECTRAL_DSN: ''
  SPECTRAL_KEY: ''
  deploymentroot: 'VAA.EAPI.Deployments'

stages: 
  - stage: 'Build'
    jobs: 
      - job: 'Build'
        displayName: 'Build'  
        pool:
          name: ${{parameters.agentPool}} 
          vmImage: ${{parameters.agentSpecification}}         

        steps:
          # Task to copy the ARM files to artifactstagingdirectory
          - task: CopyFiles@2
            displayName: 'Copy ARM Files'
            inputs:
              SourceFolder: '${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment'
              TargetFolder: '$(build.ArtifactStagingDirectory)'

          # task to publish build artifacts to Azure Pipelines 
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Artifacts' 
            inputs:
              PathtoPublish: '$(build.ArtifactStagingDirectory)'
              ArtifactName: 'drop' 
              publishLocation: 'Container'

          # task to validate the DEV ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - DEV'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_DEV}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Template/azuredeploy.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Parameters/dev-azuredeploy.parameters.json
              deploymentMode: Validation

          # task to validate the SIT ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - SIT'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_SIT}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Template/azuredeploy.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Parameters/sit-azuredeploy.parameters.json
              deploymentMode: Validation    

          # task to validate the UAT ARM template 
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'ARM Validation - UAT'
            inputs:
              ConnectedServiceName: ${{parameters.serviceConnection_NonProd}}
              subscriptionId: ${{parameters.subscriptionId_NonProd}}
              resourceGroupName: ${{parameters.resourceGroupName_UAT}}
              location: ${{parameters.location}}
              csmFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Template/azuredeploy.json
              csmParametersFile: ${{parameters.deploymentroot}}/${{parameters.subRootPath}}.${{parameters.applicationName}}.Deployment/Parameters/uat-azuredeploy.parameters.json
              deploymentMode: Validation 