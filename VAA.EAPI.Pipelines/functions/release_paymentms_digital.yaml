parameters:
  agentPool: ''
  agentPool_APIM: ''
  agentSpecification: ''
  location: ''
  agentPool_SANDBOX: ''
  buildConfiguration: ''
  applicationName: ''
  microserviceName: ''
  productId: ''
  apimurlname: ''
  APIM_NonProd: ''
  APIM_Prod: ''
  APIM_Sandbox: ''
  APIMResourceGroupName_NonProd: ''
  APIMResourceGroupName_Sandbox: ''
  APIMResourceGroupName_Prod: ''
  APIMServiceConnection_NonProd: ''
  APIMServiceConnection_Prod: ''
  APIMServiceConnection_Sandbox: ''
  APIMSubscriptionId_NonProd: ''
  APIMSubscriptionId_Prod: ''
  APIMSubscriptionId_Sandbox: ''
  testRepoPath_SIT: ''
  testRepoPath_UAT: ''
  appserviceplan: ''
  appserviceplan_D: ''
  keyvaultName: ''
  resourceGroupName_DEV: ''
  resourceGroupName_SIT: ''
  resourceGroupName_UAT: ''
  resourceGroupName_PROD: ''
  resourceGroupName_SANDBOX: ''
  resourceGroupName_DEV_D: ''
  resourceGroupName_SIT_D: ''
  resourceGroupName_UAT_D: ''
  resourceGroupName_PROD_D: ''
  serviceConnection_NonProd: ''
  serviceConnection_NonProd_D: ''
  serviceConnection_Prod: ''
  serviceConnection_Prod_D: ''
  subscriptionId_NonProd: ''
  subscriptionId_NonProd_D: ''
  subscriptionId_Prod: '' 
  subscriptionId_Prod_D: '' 
  functionAppName_DEV: ''
  functionAppName_SIT: ''
  functionAppName_UAT: ''
  functionAppName_SANDBOX: ''
  functionAppName_PRD: ''
  functionAppName_Digital_DEV: ''
  functionAppName_Digital_SIT: ''
  functionAppName_Digital_UAT: ''
  functionAppName_Digital_PRD: ''
  # APIM parameters already declared above
  APIM_IP_DEV_SIT_UAT: ''
  APIM_IP_PRD: ''
  WEBSITE_DNS_ALT_SERVER: ''
  WEBSITE_DNS_SERVER: ''
  WEBSITE_DNS_ALT_SERVER_SANDBOX: ''
  WEBSITE_DNS_SERVER_SANDBOX: ''
  SLACK_API_TOKEN: ''
  SLACK_TITLE: ''
  
  #Performance Variables
  functionAppName_PRFM: ''
  appInsightsName_PRFM: ''
  appInsightsKey_PRFM: ''
  storageAccName_PRFM: ''
  StorageAccCnncstring_PRFM: ''
  keyvault_PRFM: ''
  resourceGroupName_PRFM: ''
  AppServicePlanName_PRFM: ''


stages:
  
  - stage: 'AFN_DEV'
    displayName: 'AFN - DEV' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_paymentms_digital.yaml   
        parameters:
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}  
          location: ${{parameters.location}} 
          environment: 'dev'
          applicationName: ${{parameters.applicationName}}
          functionAppName: ${{parameters.functionAppName_DEV}}
          functionAppName_D: ${{parameters.functionAppName_Digital_DEV}}
          resourceGroupName: ${{parameters.resourceGroupName_DEV}}   
          resourceGroupName_D: ${{parameters.resourceGroupName_DEV_D}}   
          serviceConnection: ${{parameters.serviceConnection_NonProd}}
          serviceConnection_D: ${{parameters.serviceConnection_NonProd_D}}
          subscriptionId: ${{parameters.subscriptionId_NonProd}}
          subscriptionId_D: ${{parameters.subscriptionId_NonProd_D}}
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}

  - stage: 'APIM_DEV'     
    displayName: 'APIM - DEV' 
    dependsOn: AFN_DEV   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_apim_eapi.yaml
        parameters:
          apimEnv: 'DEV/'
          apiEnv: '_DEV' 
          apisEnv: 'dev'
          stage: 'DEV'                           
          agentPool: ${{parameters.agentPool_APIM}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}          
          microserviceName: ${{parameters.microserviceName}}
          productId: ${{parameters.productId}}  
          apimurlname: ${{parameters.apimurlname}} 
          functionAppName: ${{parameters.functionAppName_DEV}} 
          resourceGroupName: ${{parameters.resourceGroupName_DEV}}   
          serviceConnection: ${{parameters.serviceConnection_NonProd}}
          APIMName: ${{parameters.APIM_NonProd}}  
          APIMResourceGroupName: ${{parameters.APIMResourceGroupName_NonProd}}       
          APIMServiceConnection: ${{parameters.APIMServiceConnection_NonProd}}
          APIMSubscriptionId: ${{parameters.APIMSubscriptionId_NonProd}}          
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}              

  - stage: 'AFN_SIT'
    displayName: 'AFN - SIT' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_paymentms_digital.yaml   
        parameters:
          environment: 'sit' 
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}   
          location: ${{parameters.location}}           
          applicationName: ${{parameters.applicationName}}
          functionAppName: ${{parameters.functionAppName_SIT}} 
          functionAppName_D: ${{parameters.functionAppName_Digital_SIT}}
          resourceGroupName: ${{parameters.resourceGroupName_SIT}} 
          resourceGroupName_D: ${{parameters.resourceGroupName_SIT_D}}   
          serviceConnection: ${{parameters.serviceConnection_NonProd}}
          serviceConnection_D: ${{parameters.serviceConnection_NonProd_D}}
          subscriptionId: ${{parameters.subscriptionId_NonProd}}
          subscriptionId_D: ${{parameters.subscriptionId_NonProd_D}}
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}} 

  - stage: 'APIM_SIT'     
    displayName: 'APIM - SIT' 
    dependsOn: AFN_SIT   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_apim_eapi.yaml
        parameters:
          stage: 'SIT'  
          apimEnv: 'SIT/'
          apiEnv: '_SIT'     
          apisEnv: 'sit'                              
          agentPool: ${{parameters.agentPool_APIM}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}
          microserviceName: ${{parameters.microserviceName}}  
          productId: ${{parameters.productId}}    
          apimurlname: ${{parameters.apimurlname}}                  
          functionAppName: ${{parameters.functionAppName_SIT}}                      
          resourceGroupName: ${{parameters.resourceGroupName_SIT}}       
          serviceConnection: ${{parameters.serviceConnection_NonProd}}
          APIMName: ${{parameters.APIM_NonProd}}          
          APIMResourceGroupName: ${{parameters.APIMResourceGroupName_NonProd}}       
          APIMServiceConnection: ${{parameters.APIMServiceConnection_NonProd}}
          APIMSubscriptionId: ${{parameters.APIMSubscriptionId_NonProd}}          
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}  

          
  #- stage: 'Testing_SIT'
  #  displayName: 'Testing - SIT' 
  #  dependsOn: APIM_SIT   
  #  jobs:  
  #    - template: /VAA.EAPI.Pipelines/functions/sanitytesting.yaml   
  #      parameters:
  #        agentPool: ${{parameters.agentPool}}
  #        agentSpecification: ${{parameters.agentSpecification}}  
  #        buildConfiguration: ${{parameters.buildConfiguration}} 
  #        testRepoPath: ${{parameters.testRepoPath_SIT}} 
                                                   

  - stage: 'AFN_UAT'
    displayName: 'AFN - UAT' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_paymentms_digital.yaml   
        parameters:
          environment: 'uat'          
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}   
          location: ${{parameters.location}}          
          applicationName: ${{parameters.applicationName}}         
          functionAppName: ${{parameters.functionAppName_UAT}}
          functionAppName_D: ${{parameters.functionAppName_Digital_UAT}}
          resourceGroupName: ${{parameters.resourceGroupName_UAT}}
          resourceGroupName_D: ${{parameters.resourceGroupName_UAT_D}} 
          serviceConnection: ${{parameters.serviceConnection_NonProd}}
          serviceConnection_D: ${{parameters.serviceConnection_NonProd_D}}
          subscriptionId: ${{parameters.subscriptionId_NonProd}}
          subscriptionId_D: ${{parameters.subscriptionId_NonProd_D}}
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}   

  - stage: 'APIM_UAT'
    displayName: 'APIM - UAT' 
    dependsOn: AFN_UAT   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_apim_eapi.yaml
        parameters:
          stage: 'UAT'   
          apimEnv: 'UAT/'
          apiEnv: '_UAT'    
          apisEnv: 'uat'                              
          agentPool: ${{parameters.agentPool_APIM}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}} 
          microserviceName: ${{parameters.microserviceName}}  
          productId: ${{parameters.productId}}      
          apimurlname: ${{parameters.apimurlname}}               
          functionAppName: ${{parameters.functionAppName_UAT}}                      
          resourceGroupName: ${{parameters.resourceGroupName_UAT}}       
          serviceConnection: ${{parameters.serviceConnection_NonProd}}
          APIMName: ${{parameters.APIM_NonProd}}           
          APIMResourceGroupName: ${{parameters.APIMResourceGroupName_NonProd}}       
          APIMServiceConnection: ${{parameters.APIMServiceConnection_NonProd}}
          APIMSubscriptionId: ${{parameters.APIMSubscriptionId_NonProd}}          
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}} 
          
  #- stage: 'Testing_UAT'
  #  displayName: 'Testing - UAT' 
  #  dependsOn: APIM_UAT   
  #  jobs:  
  #    - template: /VAA.EAPI.Pipelines/functions/sanitytesting.yaml   
  #      parameters:
  #        agentPool: ${{parameters.agentPool}}
  #        agentSpecification: ${{parameters.agentSpecification}}  
  #        buildConfiguration: ${{parameters.buildConfiguration}} 
  #        testRepoPath: ${{parameters.testRepoPath_UAT}}
    
  - stage: 'SANDBOX'
    variables: 
    - template: /VAA.EAPI.Pipelines/variables/SANDBOX.yaml
    displayName: 'Deployment - SANDBOX' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:
      - template: /VAA.EAPI.Pipelines/functions/deployment_sandbox.yaml   
        parameters:
          functionAppName: ${{parameters.functionAppName_SANDBOX}}
          agentPool: ${{parameters.agentPool_SANDBOX}}
          agentSpecification: ${{parameters.agentSpecification}}
          applicationName: ${{parameters.applicationName}}        
          environment: ${{variables.environment}}
          location: ${{variables.location}}          
          resourceGroupName: ${{variables.resourceGroupName}}        
          serviceConnection: ${{variables.serviceConnection}}
          subscriptionId: ${{variables.subscriptionId}}
          #APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}  
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER_SANDBOX}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER_SANDBOX}}    
          
  - stage: 'AFN_PRFM'
    displayName: 'AFN - Performance' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_prfm_storage_asp.yaml   
        parameters:
          environment: 'PRFM'          
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}   
          location: ${{parameters.location}}          
          applicationName: ${{parameters.applicationName}}         
          functionAppName: ${{parameters.functionAppName_PRFM}}
          appInsightsName: ${{parameters.appInsightsName_PRFM}}
          appInsightsKey: ${{parameters.appInsightsKey_PRFM}}
          storageAccName: ${{parameters.storageAccName_PRFM}}
          storageAccName_Cnnc: ${{parameters.StorageAccCnncstring_PRFM}}
          AppServicePlanName: ${{parameters.AppServicePlanName_PRFM}}
          keyvault: ${{parameters.keyvault_PRFM}}
          resourceGroupName: ${{parameters.resourceGroupName_PRFM}}       
          serviceConnection: ${{parameters.serviceConnection_NonProd}}
          subscriptionId: ${{parameters.subscriptionId_NonProd}}
          APIM_IP: ${{parameters.APIM_IP_DEV_SIT_UAT}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}} 
                                         

  - stage: 'AFN_PROD'
    displayName: 'AFN - PROD' 
    condition: and(succeeded(),or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), contains(variables['Build.SourceBranch'], 'HotFix')))
    dependsOn: build   
    jobs:   
      - template: /VAA.EAPI.Pipelines/functions/deployment_paymentms_digital.yaml   
        parameters:
          environment: 'prod'                     
          agentPool: ${{parameters.agentPool}}
          agentSpecification: ${{parameters.agentSpecification}}   
          location: ${{parameters.location}}         
          applicationName: ${{parameters.applicationName}}
          functionAppName: ${{parameters.functionAppName_PRD}}
          functionAppName_D: ${{parameters.functionAppName_Digital_PRD}}
          resourceGroupName: ${{parameters.resourceGroupName_PROD}}
          resourceGroupName_D: ${{parameters.resourceGroupName_PROD_D}}
          serviceConnection: ${{parameters.serviceConnection_Prod}}
          serviceConnection_D: ${{parameters.serviceConnection_Prod_D}}
          subscriptionId: ${{parameters.subscriptionId_Prod}}
          subscriptionId_D: ${{parameters.subscriptionId_Prod_D}}
          APIM_IP: ${{parameters.APIM_IP_PRD}}
          WEBSITE_DNS_ALT_SERVER: ${{parameters.WEBSITE_DNS_ALT_SERVER}}
          WEBSITE_DNS_SERVER: ${{parameters.WEBSITE_DNS_SERVER}}    
