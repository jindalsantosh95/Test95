parameters:
- name: JobName
- name: ServiceConnection
- name: Environment
- name: RG_ServiceBus
- name: Subscriptionid

jobs: 
- deployment: ${{parameters.JobName}}
       
  
  pool:
   vmImage: 'windows-latest'
  variables:
   - group: ${{parameters.Environment}}
  
  
  environment: ${{parameters.Environment}}
  strategy:
   runOnce:
    deploy:
      steps:
      - download: current
        artifact: drop

      
      
      
      
      - task: AzureResourceManagerTemplateDeployment@3
        displayName: Create Service Bus
        inputs:
          azureResourceManagerConnection: ${{parameters.ServiceConnection}}
          subscriptionId: ${{parameters.Subscriptionid}}
          resourceGroupName: ${{parameters.RG_ServiceBus}}
          location: $(ResourceGroupLocation)
          csmFile: $(Pipeline.workspace)/drop/Template/azuredeploy.json
          csmParametersFile: $(Pipeline.workspace)/drop/Parameters/${{parameters.Environment}}-azuredeploy.parameters.json
          deploymentMode: 'Incremental'