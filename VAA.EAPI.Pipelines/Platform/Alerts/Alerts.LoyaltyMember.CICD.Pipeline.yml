trigger:
  branches:
    include:
    - '*'
    
  paths:
    include:
      - VAA.EAPI.Deployments/VAA.EAPI.Microservices.Alerts.Deployment/LoyaltyMember*
      
  

variables:  
  - name: SolutionName
    value: 'VAA.EAPI.Microservices.Alerts'
  - name: RootPath
    value: 'VAA.EAPI.Deployments'
  - name: BuildConfiguration
    value: 'release'
  - name: MicroserviceName
    value: 'LoyaltyMember'

    
      
name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)
stages:
 - stage: 'build'
   
   
   jobs: 
    - job: build
      displayName: Build 
      pool:
       vmImage: 'windows-latest'
      

      steps: 
       - template:  /VAA.EAPI.Pipelines/Platform/Alerts/templates/build.yml
       #- template: templates/build.yml
         parameters:
          buildConfiguration: $(BuildConfiguration)
          applicationName: $(SolutionName)     
          RootPath:  $(RootPath)
          MicroserviceName: $(MicroserviceName)
          

      
       

 - stage: 'DeploytoDev'
   variables: 
    - template: /VAA.EAPI.Pipelines/variables/Alerts-dev-var.yml
   displayName: 'Deploy Function to Dev' 
   #condition: and(succeeded(),eq(variables['Build.SourceBranch'], 'refs/heads/main'))
   dependsOn: build   
   jobs:
     - template: /VAA.EAPI.Pipelines/Platform/Alerts/templates/Alerts.yml
     #- template: templates/deployment.yml
       parameters:
        JobName: 'DeployDev'
        ServiceConnection: ${{variables.ServiceConnection}}
        Environment: ${{variables.Environment}}
        RG_Alerts: ${{variables.RG_Alerts}}
        Subscriptionid: ${{variables.Subscriptionid}}
        ResourceLocation: ${{variables.ResourceLocation}}
        MicroserviceName: ${{variables.MicroserviceName}}

