variables: 
  - group: APIM  
  - group: APIM_IP
  - group: Common_Variables
  - group: Graphql_CheckIn
  - group: Graphql_Stitch
  - group: Spectral_Ops
  - name: agentPool
    value: 'Azure Pipelines'
  - name: agentPool1
    value: 'EAPITestingAgent' 
  - name: agentSpecification
    value: 'windows-latest'
  - name: buildConfiguration
    value: 'release'    
  - name: rootPath
    value: 'VAA.EAPI.GraphQL'
  - name: subRootPath
    value: 'VAA.EAPI'    
  - name: applicationName
    value: 'GraphQL'
  - name: functionAppName_Secure_DT5
    value: 'AVADEUNAFNGRAPHQLCheckInDT5'
  - name: functionAppName_Secure_DEV
    value: 'AVADEUNAFNGRAPHQLCheckIn'
  - name: functionAppName_Secure_SIT
    value: 'AVATEUNAFNGRAPHQLCheckIn'
  - name: functionAppName_Secure_UAT
    value: 'AVASEUNAFNGRAPHQLCheckIn'
  - name: functionAppName_Secure_PRD
    value: 'AVAPEUNAFNGRAPHQLCheckIn'
  - name: functionAppName_Public_DT5
    value: 'AVADEUNAFNGRAPHQLCheckInPDT5'     
  - name: functionAppName_Public_DEV
    value: 'AVADEUNAFNGRAPHQLCheckInP'
  - name: functionAppName_Public_SIT
    value: 'AVATEUNAFNGRAPHQLCheckInP'
  - name: functionAppName_Public_UAT
    value: 'AVASEUNAFNGRAPHQLCheckInP'
  - name: functionAppName_Public_PRD
    value: 'AVAPEUNAFNGRAPHQLCheckInP'  
  - name: testRepoPath_DEV
    value: 'VAA.ENTERPRISE.API.TESTS.CORE' 
  - name: testRepoPath_SIT
    value: 'VAA.ENTERPRISE.API.TESTS.CORE'   
  - name: testRepoPath_UAT
    value: 'VAA.ENTERPRISE.API.TESTS.CORE'     
      
name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)

stages:
  # CI (Build) Pipeline
  - template: functions/build_graphqlCheckIn.yaml
    parameters:
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification)
      buildConfiguration: $(buildConfiguration)
      rootPath: $(rootPath)
      location: $(location)
      subRootPath: $(subRootPath)
      SPECTRAL_DSN: $(SPECTRAL_DSN)
      SPECTRAL_KEY: $(SPECTRAL_KEY)
      applicationName: $(applicationName)
      resourceGroupName_DEV: $(resourceGroupNameGraphql_DEV)
      resourceGroupName_SIT: $(resourceGroupNameGraphql_SIT)
      resourceGroupName_UAT: $(resourceGroupNameGraphql_UAT)
      resourceGroupName_PROD: $(resourceGroupNameGraphql_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      serviceConnection_Prod: $(serviceConnection_Prod)


  # CD (Deployment) Pipeline
  - template: functions/CheckIn/release_graphqlsplit_checkin.yaml
    parameters:
      agentPool: $(agentPool)
      agentPool_Sanity: $(agentPool1)
      agentSpecification: $(agentSpecification) 
      applicationName: $(applicationName)
      testRepoPath_DEV: $(testRepoPath_DEV)
      testRepoPath_SIT: $(testRepoPath_SIT)
      testRepoPath_UAT: $(testRepoPath_UAT)    
      functionAppName_Secure_DT5: $(functionAppName_Secure_DT5)   
      functionAppName_Secure_DEV: $(functionAppName_Secure_DEV)
      functionAppName_Secure_SIT: $(functionAppName_Secure_SIT)
      functionAppName_Secure_UAT: $(functionAppName_Secure_UAT)
      functionAppName_Secure_PRD: $(functionAppName_Secure_PRD)
      functionAppName_Public_DT5: $(functionAppName_Public_DT5)
      functionAppName_Public_DEV: $(functionAppName_Public_DEV)
      functionAppName_Public_SIT: $(functionAppName_Public_SIT)
      functionAppName_Public_UAT: $(functionAppName_Public_UAT)
      functionAppName_Public_PRD: $(functionAppName_Public_PRD)
      AppInsightsName_DEV: $(AppInsightsName_DEV)
      AppInsightsName_SIT: $(AppInsightsName_SIT)
      AppInsightsName_UAT: $(AppInsightsName_UAT)
      AppInsightsName_PROD: $(AppInsightsName_PROD)
      storageAccountName_DEV: $(AzureWebJobsStorage_GQLCheckIn_Sec_DEV)
      storageAccountName_SIT: $(AzureWebJobsStorage_GQLCheckIn_Sec_SIT)
      storageAccountName_UAT: $(AzureWebJobsStorage_GQLCheckIn_Sec_UAT)   
      storageAccountName_PROD: $(AzureWebJobsStorage_GQLCheckIn_Sec_PROD)
      storageAccountName_DEV_P: $(AzureWebJobsStorage_GQLCheckIn_Public_DEV)
      storageAccountName_SIT_P: $(AzureWebJobsStorage_GQLCheckIn_Public_SIT)
      storageAccountName_UAT_P: $(AzureWebJobsStorage_GQLCheckIn_Public_UAT)   
      storageAccountName_PROD_P: $(AzureWebJobsStorage_GQLCheckIn_Public_PROD)       
      location: $(location)
      resourceGroupName_DT5: $(resourceGroupName_DT5)
      AppInsightsName_DT5: $(AppInsightsName_DT5)
      appserviceplan_DT5: $(appserviceplan_DT5)
      KeyvaultName_DT5: $(KeyvaultName_DT5)
      storageAccountName_DT5: $(storageAccountName_DT5)
      storageAccountName_P_DT5: $(storageAccountName_P_DT5)  
      VARIABLE_GROUP_NAME_SCHEMA: "SchemaValidation_DEV"   
      VARIABLE_GROUP_NAME_NBF_DEV: "TESTING_NBF_DEV"
      VARIABLE_GROUP_NAME_NBF_SIT: "TESTING_NBF_SIT"
      VARIABLE_GROUP_NAME_NBF_UAT: "TESTING_NBF_UAT"  
      WEBSITE_DNS_ALT_SERVER: $(WEBSITE_DNS_ALT_SERVER)
      WEBSITE_DNS_SERVER: $(WEBSITE_DNS_SERVER)         
      stitchfunctionAppName_DEV: $(stitchfunctionAppName_DEV)
      stitchfunctionAppName_SIT: $(stitchfunctionAppName_SIT)
      stitchfunctionAppName_UAT: $(stitchfunctionAppName_UAT)
      stitchfunctionAppName_PROD: $(stitchfunctionAppName_PROD)
      stitchrgname_DEV: $(stitchrgname_DEV)
      stitchrgname_SIT: $(stitchrgname_SIT)
      stitchrgname_UAT: $(stitchrgname_UAT)
      stitchrgname_PROD: $(stitchrgname_PROD)
      SLACK_API_TOKEN: $(SLACK_API_TOKEN)
      SLACK_TITLE: $(SLACK_TITLE_PAXOPS)