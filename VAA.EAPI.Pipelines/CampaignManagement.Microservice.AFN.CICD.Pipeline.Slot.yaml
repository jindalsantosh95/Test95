trigger:
  branches:
    include:
      - '*'
    
  paths:
    include:
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.Loyalty.Campaign.Management*
      - VAA.EAPI.Deployments/VAA.EAPI.Microservices.Loyalty.Campaign.Management*
    exclude: 
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.Loyalty.Campaign.Management.bruno
pr:
  branches:
    include:
      - main
  
  paths:
    include:
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.Loyalty.Campaign.Management*
      - VAA.EAPI.Deployments/VAA.EAPI.Microservices.Loyalty.Campaign.Management*
    exclude: 
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.Loyalty.Campaign.Management.bruno

variables: 
  - group: AzureWebJobsStorage
  - group: APIM_IP
  - name: agentPool
    value: 'Azure Pipelines'
  - name: agentSpecification
    value: 'windows-latest'
  - name: buildConfiguration
    value: 'release'
  - name: testRepoPath_SIT
    value: 'VAA.ENTERPRISE.API.TESTS.CORE'   
  - name: testRepoPath_UAT
    value: 'VAA.ENTERPRISE.API.TESTS.CORE'      
  - name: rootPath
    value: 'VAA.EAPI.Microservices'
  - name: subRootPath
    value: 'VAA.EAPI.Microservices'    
  - name: applicationName
    value: 'Loyalty.Campaign.Management'
  - name: functionAppName_DEV
    value: 'AVADEUNAFNCAMPAIGNMANAGEMENT'
  - name: functionAppName_SIT
    value: 'AVATEUNAFNCAMPAIGNMANAGEMENT'
  - name: functionAppName_UAT
    value: 'AVASEUNAFNCAMPAIGNMANAGEMENT'
  - name: functionAppName_PRD
    value: 'AVAPEUNAFNCAMPAIGNMANAGEMENT'
  - name: slotName
    value: 'DS'  
   
      
name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)

stages:
  # CI (Build) Pipeline
  - template: functions/build_updated_arguments.yaml
    parameters:
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification)
      buildConfiguration: $(buildConfiguration)
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      applicationName: $(applicationName)

 # CD (Deployment) Pipeline
  - template: functions/release_slot_Loops.yaml
    parameters:
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification) 
      applicationName: $(applicationName)
      testRepoPath_SIT: $(testRepoPath_SIT)
      testRepoPath_UAT: $(testRepoPath_UAT)        
      functionAppName_DEV: $(functionAppName_DEV)
      functionAppName_SIT: $(functionAppName_SIT)
      functionAppName_UAT: $(functionAppName_UAT)
      functionAppName_PRD: $(functionAppName_PRD)
      APIM_IP_DEV_SIT_UAT: $(APIM_IP_DEV_SIT_UAT)
      APIM_IP_PRD: $(APIM_IP_PRD)
      WEBSITE_DNS_ALT_SERVER: $(WEBSITE_DNS_ALT_SERVER)
      WEBSITE_DNS_SERVER: $(WEBSITE_DNS_SERVER) 
      VARIABLE_GROUP_NAME_SIT: "TESTING_LOYALTY_VARIABLES_SIT"
      VARIABLE_GROUP_NAME_UAT: "TESTING_LOYALTY_VARIABLES_UAT"
      slotName: $(slotName)