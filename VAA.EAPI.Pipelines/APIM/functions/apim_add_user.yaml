parameters:
  agentPool: ''
  agentSpecification: ''
  environment: ''  
  APIMServiceConnection: ''  
  APIMSubscriptionId: ''  
  APIMResourceGroupName: ''  
  APIMName: '' 
  UserName: ''  
  FirstName: ''  
  LastName: ''  
  Email: ''  
  Provider: ''  

stages:

  - stage: 'APIM_Add_User'
    displayName: 'APIM Add User' 
    dependsOn: publishArtifacts     

    jobs: 
    - deployment: '${{parameters.environment}}'     
      pool:
        name: ${{parameters.agentPool}} 
        vmImage: ${{parameters.agentSpecification}}  

      environment: ${{parameters.environment}}  
      strategy:
        runOnce:
          deploy:
            steps:
            - download: current
              artifact: drop           
            
            # Task to create the Function App      
            - task: AzureResourceManagerTemplateDeployment@3
              displayName: 'APIM Add User'
              inputs:
                azureResourceManagerConnection: ${{parameters.APIMServiceConnection}}
                subscriptionid: ${{parameters.APIMSubscriptionId}}
                resourceGroupName:  ${{parameters.APIMResourceGroupName}}
                location:  'North Europe'
                csmFile: $(Pipeline.workspace)/drop/templates/apim_create_group.json
                deploymentMode: 'Incremental'
                overrideParameters: -APIMName ${{parameters.APIMName}} -UserName ${{parameters.UserName}} -FirstName ${{parameters.FirstName}} -LastName ${{parameters.LastName}} -Email ${{parameters.Email}} -Provider ${{parameters.Provider}}