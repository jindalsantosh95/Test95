trigger:
  branches:
    include:
      - '*'
    
  paths:
    include:
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.CRM.Email*
      - VAA.EAPI.Microservices/VAA.EAPI.Infrastructure.Email*
      - VAA.EAPI.Deployments/VAA.EAPI.Microservices.CRM.Email*
    exclude:
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.CRM.Email.bruno
      - VAA.EAPI.Microservices/VAA.EAPI.Infrastructure.Email.bruno
pr:
  branches:
    include:
      - main
  
  paths:
    include:
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.CRM.Email*
      - VAA.EAPI.Microservices/VAA.EAPI.Infrastructure.Email*
      - VAA.EAPI.Deployments/VAA.EAPI.Microservices.CRM.Email*
    exclude:
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.CRM.Email.bruno
      - VAA.EAPI.Microservices/VAA.EAPI.Infrastructure.Email.bruno

variables: 
  - group: Common_Variables
  - group: performance_variables
  - group: APIM  
  - group: APIM_IP
  - group: Spectral_Ops
  - name: agentPool
    value: 'Azure Pipelines'  
  - name: agentPool1
    value: 'LoyaltySystems'  
  - name: agentSpecification
    value: 'windows-latest'
  - name: buildConfiguration
    value: 'release' 
  - name: testRepoPath_SIT
    value: 'VAA.ENTERPRISE.API.TESTS.CORE'   
  - name: testRepoPath_UAT
    value: 'VAA.ENTERPRISE.API.TESTS.CORE'     
  - name: rootPath
    value: 'VAA.EAPI.Microservices' 
  - name: subRootPath
    value: 'VAA.EAPI.Microservices'   
  - name: applicationName
    value: 'CRM.Email'
  - name: microserviceName
    value: 'email'   
  - name: apimurlname
    value: 'EmailMS' 
  - name: functionAppName_DEV
    value: 'AVADEUNFNEMAILMS' 
  - name: functionAppName_SIT
    value: 'AVATEUNFNEMAILMICROSERV' 
  - name: functionAppName_UAT
    value: 'AVASEUNFNEMAILMICROSERV' 
  - name: functionAppName_SANDBOX
    value: 'AVAIEUNAFNEMAILMS'
  - name: functionAppName_PRD
    value: 'AVAPEUNFNEMAILMICROSERV'  
  - name: slotName
    value: 'DS'       
      
name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)

stages:
  # CI (Build) Pipeline
  - template: functions/build_apim.yaml
    parameters:   
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification)
      buildConfiguration: $(buildConfiguration)
      location: $(location)           
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      SPECTRAL_DSN: $(SPECTRAL_DSN)
      SPECTRAL_KEY: $(SPECTRAL_KEY)
      applicationName: $(applicationName) 
      resourceGroupName_DEV: $(resourceGroupName_DEV)
      resourceGroupName_SIT: $(resourceGroupName_SIT)
      resourceGroupName_UAT: $(resourceGroupName_UAT)
      resourceGroupName_PROD: $(resourceGroupName_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      serviceConnection_Prod: $(serviceConnection_Prod)

  # CD (Deployment) Pipeline
  - template: functions/release_slot_apim_withsandbox_prfm.yaml
    parameters:
      agentPool: $(agentPool)
      agentPool_SANDBOX: $(agentPool1)
      agentSpecification: $(agentSpecification) 
      buildConfiguration: $(buildConfiguration)  
      location: $(location)                     
      applicationName: $(applicationName)  
      microserviceName: $(microserviceName)
      apimurlname: $(apimurlname)
      productId: $(productId)
      resourceGroupName_DEV: $(resourceGroupName_DEV)
      resourceGroupName_SIT: $(resourceGroupName_SIT)
      resourceGroupName_UAT: $(resourceGroupName_UAT)
      resourceGroupName_PROD: $(resourceGroupName_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      serviceConnection_Prod: $(serviceConnection_Prod)
      subscriptionId_NonProd: $(subscriptionId_NonProd)
      subscriptionId_Prod: $(subscriptionId_Prod)          
      functionAppName_DEV: $(functionAppName_DEV)
      functionAppName_SIT: $(functionAppName_SIT)
      functionAppName_UAT: $(functionAppName_UAT)
      functionAppName_SANDBOX: $(functionAppName_SANDBOX)
      functionAppName_PRD: $(functionAppName_PRD)  
      testRepoPath_SIT: $(testRepoPath_SIT)
      testRepoPath_UAT: $(testRepoPath_UAT)
      APIM_NonProd: $(APIM_NonProd)
      APIM_Prod: $(APIM_Prod)
      APIMResourceGroupName_NonProd: $(APIMResourceGroupName_NonProd)       
      APIMServiceConnection_NonProd: $(APIMServiceConnection_NonProd)
      APIMSubscriptionId_NonProd: $(APIMSubscriptionId_NonProd) 
      APIMResourceGroupName_Prod: $(APIMResourceGroupName_Prod)       
      APIMServiceConnection_Prod: $(APIMServiceConnection_Prod)
      APIMSubscriptionId_Prod: $(APIMSubscriptionId_Prod)                
      APIM_IP_DEV_SIT_UAT: $(APIM_IP_DEV_SIT_UAT)
      APIM_IP_PRD: $(APIM_IP_PRD)
      WEBSITE_DNS_ALT_SERVER: $(WEBSITE_DNS_ALT_SERVER)
      WEBSITE_DNS_SERVER: $(WEBSITE_DNS_SERVER) 
      WEBSITE_DNS_SERVER_SANDBOX: $(primaryDNS)
      WEBSITE_DNS_ALT_SERVER_SANDBOX: $(secondaryDNS)   
      #Performance Variables
      functionAppName_PRFM: $(Email_functionAppName_PRFM)
      appInsightsName_PRFM: $(Email_applicationInsigts_PRFM)
      storageAccName_PRFM: $(Email_storageacc_PRFM)
      StorageAccCnncstring_PRFM: $(Email_storageaccCnncString_PRFM)
      keyvault_PRFM: $(Keyvault_old_PRFM)
      resourceGroupName_PRFM: $(Digital_Old_Rg)
      AppServicePlanName_PRFM: $(AppServicePlanName)