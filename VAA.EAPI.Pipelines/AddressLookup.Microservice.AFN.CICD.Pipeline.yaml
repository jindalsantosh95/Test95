trigger:
  branches:
    include:
      - '*'
    
  paths:
    include:
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.Loyalty.AddressLookup*
      - VAA.EAPI.Deployments/VAA.EAPI.Microservices.Loyalty.AddressLookup*
    exclude: 
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.Loyalty.AddressLookup.bruno
pr:
  branches:
    include:
      - main
  
  paths:
    include:
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.Loyalty.AddressLookup*
      - VAA.EAPI.Deployments/VAA.EAPI.Microservices.Loyalty.AddressLookup*
    exclude: 
      - VAA.EAPI.Microservices/VAA.EAPI.Microservices.Loyalty.AddressLookup.bruno

variables: 
  - group: Common_Variables
  - group: APIM
  - group: APIM_IP
  - name: agentPool
    value: 'Azure Pipelines'
  - name: agentSpecification
    value: 'windows-latest'
  - name: buildConfiguration
    value: 'release'
  - name: testRepoPath_SIT
    value: 'VAA.ENTERPRISE.API.TESTS.CORE'   
  - name: testRepoPath_UAT
    value: 'VAA.ENTERPRISE.API.TESTS.CORE'      
  - name: rootPath
    value: 'VAA.EAPI.Microservices'
  - name: subRootPath
    value: 'VAA.EAPI.Microservices'    
  - name: applicationName
    value: 'Loyalty.AddressLookup'
  - name: functionAppName_DEV
    value: 'AVADEUNAFNADDRESSLOOKUPMS'
  - name: functionAppName_SIT
    value: 'AVATEUNAFNADDRESSLOOKUPMICROSERV'
  - name: functionAppName_UAT
    value: 'AVASEUNAFNADDRESSLOOKUPMICROSERV'
  - name: functionAppName_PRD
    value: 'AVAPEUNAFNADDRESSLOOKUPMICROSERV'    
      
name: $(BuildDefinitionName)_1.0.$(year:yy)$(DayOfYear)$(Rev:.r)

stages:
  # CI (Build) Pipeline
  - template: functions/build.yaml
    parameters:
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification)
      buildConfiguration: $(buildConfiguration)
      location: $(location)           
      rootPath: $(rootPath)
      subRootPath: $(subRootPath)
      applicationName: $(applicationName) 
      resourceGroupName_DEV: $(resourceGroupName_DEV)
      resourceGroupName_SIT: $(resourceGroupName_SIT)
      resourceGroupName_UAT: $(resourceGroupName_UAT)
      resourceGroupName_PROD: $(resourceGroupName_PROD)
      serviceConnection_NonProd: $(serviceConnection_NonProd)
      serviceConnection_Prod: $(serviceConnection_Prod)

  # CD (Deployment) Pipeline
  - template: functions/release.yaml
    parameters:
      agentPool: $(agentPool)
      agentSpecification: $(agentSpecification) 
      applicationName: $(applicationName)
      testRepoPath_SIT: $(testRepoPath_SIT)
      testRepoPath_UAT: $(testRepoPath_UAT)        
      functionAppName_DEV: $(functionAppName_DEV)
      functionAppName_SIT: $(functionAppName_SIT)
      functionAppName_UAT: $(functionAppName_UAT)
      functionAppName_PRD: $(functionAppName_PRD)
      APIM_IP_DEV_SIT_UAT: $(APIM_IP_DEV_SIT_UAT)
      APIM_IP_PRD: $(APIM_IP_PRD)
      WEBSITE_DNS_ALT_SERVER: $(WEBSITE_DNS_ALT_SERVER)
      WEBSITE_DNS_SERVER: $(WEBSITE_DNS_SERVER)

  - stage: 'APIM_DEV'
    displayName: 'APIM - DEV'
    dependsOn: DEV
    variables:
      - template: /VAA.EAPI.Pipelines/variables/DEV.yaml
    jobs:
      - template: functions/deployment_apim.yaml
        parameters:
          stage: 'DEV'
          apimEnv: 'DEV/'
          apiEnv: '_DEV'
          apisEnv: 'dev'
          agentPool: $(agentPool)
          agentSpecification: $(agentSpecification)
          applicationName: $(applicationName)
          microserviceName: 'addresslookupmicroservice'
          apimurlname: 'addresslookup'
          functionAppName: $(functionAppName_DEV)
          resourceGroupName: ${{ variables.resourceGroupName }}
          serviceConnection: ${{ variables.serviceConnection }}
          APIMName: $(APIM_NonProd)
          APIMResourceGroupName: $(APIMResourceGroupName_NonProd)
          APIMServiceConnection: $(APIMServiceConnection_NonProd)
          APIMSubscriptionId: $(APIMSubscriptionId_NonProd)
          APIM_IP: $(APIM_IP_DEV_SIT_UAT)
          apimParametersFile: 'Parameters/dev-azuredeploy-apim.parameters.json'

  - stage: 'APIM_SIT'
    displayName: 'APIM - SIT'
    dependsOn: SIT
    variables:
      - template: /VAA.EAPI.Pipelines/variables/SIT.yaml
    jobs:
      - template: functions/deployment_apim.yaml
        parameters:
          stage: 'SIT'
          apimEnv: 'SIT/'
          apiEnv: '_SIT'
          apisEnv: 'sit'
          agentPool: $(agentPool)
          agentSpecification: $(agentSpecification)
          applicationName: $(applicationName)
          microserviceName: 'addresslookupmicroservice'
          apimurlname: 'addresslookup'
          functionAppName: $(functionAppName_SIT)
          resourceGroupName: ${{ variables.resourceGroupName }}
          serviceConnection: ${{ variables.serviceConnection }}
          APIMName: $(APIM_NonProd)
          APIMResourceGroupName: $(APIMResourceGroupName_NonProd)
          APIMServiceConnection: $(APIMServiceConnection_NonProd)
          APIMSubscriptionId: $(APIMSubscriptionId_NonProd)
          APIM_IP: $(APIM_IP_DEV_SIT_UAT)
          apimParametersFile: 'Parameters/sit-azuredeploy-apim.parameters.json'

  - stage: 'APIM_UAT'
    displayName: 'APIM - UAT'
    dependsOn: UAT
    variables:
      - template: /VAA.EAPI.Pipelines/variables/UAT.yaml
    jobs:
      - template: functions/deployment_apim.yaml
        parameters:
          stage: 'UAT'
          apimEnv: 'UAT/'
          apiEnv: '_UAT'
          apisEnv: 'uat'
          agentPool: $(agentPool)
          agentSpecification: $(agentSpecification)
          applicationName: $(applicationName)
          microserviceName: 'addresslookupmicroservice'
          apimurlname: 'addresslookup'
          functionAppName: $(functionAppName_UAT)
          resourceGroupName: ${{ variables.resourceGroupName }}
          serviceConnection: ${{ variables.serviceConnection }}
          APIMName: $(APIM_NonProd)
          APIMResourceGroupName: $(APIMResourceGroupName_NonProd)
          APIMServiceConnection: $(APIMServiceConnection_NonProd)
          APIMSubscriptionId: $(APIMSubscriptionId_NonProd)
          APIM_IP: $(APIM_IP_DEV_SIT_UAT)
          apimParametersFile: 'Parameters/uat-azuredeploy-apim.parameters.json'

  - stage: 'APIM_PROD'
    displayName: 'APIM - PROD'
    dependsOn: PROD
    variables:
      - template: /VAA.EAPI.Pipelines/variables/PRD.yaml
    jobs:
      - template: functions/deployment_apim.yaml
        parameters:
          stage: 'PROD'
          apimEnv: ''
          apiEnv: ''
          apisEnv: 'prod'
          agentPool: $(agentPool)
          agentSpecification: $(agentSpecification)
          applicationName: $(applicationName)
          microserviceName: 'addresslookupmicroservice'
          apimurlname: 'addresslookup'
          functionAppName: $(functionAppName_PRD)
          resourceGroupName: ${{ variables.resourceGroupName }}
          serviceConnection: ${{ variables.serviceConnection }}
          APIMName: $(APIM_Prod)
          APIMResourceGroupName: $(APIMResourceGroupName_Prod)
          APIMServiceConnection: $(APIMServiceConnection_Prod)
          APIMSubscriptionId: $(APIMSubscriptionId_Prod)
          APIM_IP: $(APIM_IP_PRD)
          apimParametersFile: 'Parameters/prod-azuredeploy-apim.parameters.json'
